ence has been decreasing for centuries despite current wars.","progress","s11bsoly"],["Evidence the world is getting worse: technological progress brought climate change, biodiversity loss and resource depletion.","progress","shqixw5"],["Evidence the world is getting worse: while poverty has decreased, wealth inequality has significantly increased.","progress","stp6xx7"],["Global life expectancy rose about 36 years in a century.","progress","smat0bz"],["The earliest lists were for survival, tracking whether a city had enough grain.","todo","s1bk5mku"],["Sumerian clay tablets and Egyptian papyrus scrolls date to 2500 BCE.","todo","s1yxouqd"],["During the Renaissance and Enlightenment, to-do lists shifted from tracking things to tracking ideas.","todo","s15v5jld"],["One of Leonardo da Vinci's to-do items: \"Describe the tongue of the woodpecker.\"","todo","s1y9fl0"],["Other items on Leonardo da Vinci's to-do list: \"Calculate the measurement of Milan\" and \"Discover how the eye sees.\"","todo","s16r151w"],["Benjamin Franklin made a chart of 13 virtues, with a goal for each.","todo","sofnjl"],["During the Industrial Revolution, workers got checklists stating the exact seconds a task should take.","todo","sfz91g"],["To-do apps like Notion and OmniFocus use algorithms, dates and gamification.","todo","sde6z9j"],["Digital lists have a flaw called The Bottomless Pit: infinite storage allows infinite tasks.","todo","s1cp3vmv"],["John Tierney and psychologist Roy F. Baumeister argue that the list may have birthed happiness and dissatisfaction.","todo","s1rktdyd"],["John Tierney is a writer for The New York Times.","todo","s1otpefp"],["The Eisenhower Method is named after the 34th US President.","todo","s1k68gsn"],["Eisenhower sorts tasks by urgency and importance into 4 quadrants.","todo","s1ahumcv"],["Eisenhower: urgent and important means do it now.","todo","s1ukj1j6"],["Eisenhower: urgent but not important means get someone else to do it.","todo","s4a4a8b"],["Eisenhower: important but not urgent means schedule a time.","todo","sjs4pvy"],["In the 1-2-3 Method, the tasks are 1 major, 2 big and 3 small.","todo","s1xz8a66"],["The Ivy Lee Method began in 1918, when Charles Schwab hired Ivy Lee to improve efficiency.","todo","s1dgf7yo"],["Ivy Lee: at the end of each day, write down the six most important tasks for tomorrow, ranked.","todo","sa2ts9s"],["In Ivy Lee, unfinished tasks move to the next day's list.","todo","syx8jyd"],["The 4-D Method stands for Do, Delegate, Defer, Delete.","todo","s97kf1f"],["Unlike Eisenhower, the 4-D Method is based on time and skillset.","todo","s19bi82m"],["In 4-D, \"Do\" is something that takes 2 minutes.","todo","suxjh2k"],["In 4-D, \"Delegate\" hands off tasks that are urgent for others but need no specific personal skillset.","todo","s1ldrduy"],["Eat That Frog is a book by Brian Tracy.","todo","snqrdnu"],["Eat That Frog says to do your hardest task first thing in the morning.","todo","s13aor1j"],["Eat That Frog discusses the Amygdala Hijack, where the brain treats a hard task like a predator.","todo","s19f1fdn"],["The name Eat That Frog comes from a line by Mark Twain.","todo","s18g1s8a"],["Must-Do's 1-3-5 rule gives 1 must-do, 3 should-do and 5 nice-to-do tasks.","todo","s1eg5sgu"],["The Bullet Journal was developed by Ryder Carroll.","todo","s1uvq9ug"],["The Bullet Journal aims to \"track the past, order the present, and design the future\".","todo","s1v1gmrr"],["The Bullet Journal's method is called Rapid Logging.","todo","s6do4zs"],["Rapid Logging symbols: tasks •, events O, notes —, priority *, inspiration !.","todo","s1wcd9ex"],["The Ivy Lee Method is about 100 years old.","todo","s5dqosc"],["Must-Do means naming the one or few non-negotiable tasks for the day.","todo","sqsgokg"],["Which method limits you to six tasks but splits them by size? 1-2-3 Method","todo","q1gfy62a"],["Which method is most similar to Eisenhower? 4-D Method","todo","q91wj34"],["Eisenhower: not important and not urgent means no need to worry about it.","todo","sgiehfn"],["In 4-D, \"Defer\" moves bigger tasks to a specific later time.","todo","s1rpo7m2"],["In 4-D, \"Delete\" removes unnecessary tasks.","todo","s62e4k5"],["BuJo combines a planner, to-do list and diary.","todo","sro41cp"],["The Zeigarnik effect: people remember uncompleted or interrupted tasks better.","todo","s1yb63dc"],["Bluma Zeigarnik noticed the effect in the 1920s.","todo","sh3q1lv"],["Bluma Zeigarnik saw that waiters could recall unpaid orders in detail but forgot them once the bill was settled.","todo","s8ld5mr"],["An unfinished task leaves an open loop that keeps it live in memory.","todo","s7boimd"],["Students who interrupt study with unrelated activities will remember material better.","todo","szgj46o"],["A later view of the Zeigarnik effect: the subconscious is asking the conscious brain to make a plan.","todo","sxycicu"],["Under that later view of the Zeigarnik effect, once a plan is made, the subconscious stops asking.","todo","saqj0v2"],["Best to keep both a to-do list and a done list, which closes open items.","todo","s13cj6ng"],["Unfinished work creates cognitive tension.","todo","s16l6ltg"],["\"The list is the origin of culture\" was said by Umberto Eco.","todo","s10g0522"],["Eco held an exhibit of lists at the Louvre.","todo","su0b3ta"],["Eco wrote the 1980 historical murder mystery The Name of the Rose.","todo","s1oxlzwb"],["Eco was an Italian intellectual, philosopher, novelist and semiotician.","todo","smma16j"],["Practical lists are finite and aim at completeness.","todo","s1fm1055"],["Poetic lists are artistic and gesture at infinity.","todo","sm44n12"],["A to-do list is a practical list.","todo","s1i4rwe1"],["Eco suggests lists help us confront the \"humiliation\" of our mortality.","todo","ssrn5nm"],["In November 2025, the Supreme Court of Bangladesh restored caretaker governments.","nearish","s15za8qs"],["A caretaker government takes over between the end of one government and the election of the next.","nearish","s1dot7m9"],["In caretaker mode, a government can keep running the country but cannot make big, life-changing decisions.","nearish","sklh6xr"],["Belgium's caretaker period lasted 652 days.","nearish","ska7qg8"],["Belgium's coalition collapsed over immigration.","nearish","s1gwjleh"],["Belgium's caretaker period ended in October 2020 with Alexander De Croo.","nearish","svbbb10"],["Pro of caretaker governments: they provide stability and prevent power vacuums, and they ensure neutrality in campaigns.","nearish","s1w3gg51"],["Con of caretaker governments: they lack a full democratic mandate, which weakens accountability.","nearish","s1kk8qi3"],["Bangladesh's caretaker government once lasted two years instead of the usual 90 days.","nearish","s9qyixl"],["In Myanmar, General Min Aung Hlaing took the role of Prime Minister in a self-appointed caretaker government.","nearish","s9q8j2m"],["The US has no caretaker governments. Neither does Venezuela.","nearish","s1wge5di"],["US presidents are limited to two four-year terms.","nearish","s13ddo8q"],["A lame duck is an elected person nearing the end of a term after a successor has been elected.","nearish","suh9nat"],["For removing term limits: experienced leaders give stability, voters keep their choice, and long projects aren't changed mid-project.","nearish","s1ma09la"],["Against removing term limits: organizations become prone to corruption, younger ideas get blocked, and a leader may die in office.","nearish","s1oorijo"],["A way for a leader to hold power: keep the military personally loyal, and frame yourself as the only thing preventing catastrophe.","nearish","sf6xqvl"],["Elizabeth I delayed naming her successor.","nearish","sxulblf"],["Elizabeth I told the Scottish ambassador that the people \"have their eyes fixed upon the person who is next to succeed.\"","nearish","sr2e9xk"],["Pro of an unknown successor: it prevents the lame duck effect and limits opposing camps.","nearish","sog8s3u"],["Con of an unknown successor: panic, leadership crises after sudden deaths, and a rushed selection.","nearish","s8p6945"],["An example of an unknown successor: the Pope is elected by the College of Cardinals only after a death or resignation.","nearish","s1rjezbx"],["The Doomsday Clock was debuted in 1947 by the Bulletin of the Atomic Scientists.","nearish","s1vboe4j"],["The Doomsday Clock is adjusted every January.","nearish","s1kdaa7x"],["The Doomsday Clock first focused on nuclear warfare; now it also weighs climate change and disruptive technologies.","nearish","s1hz96p3"],["During the 1962 Cuban Missile Crisis, the Doomsday Clock was further from midnight than in less dangerous times.","nearish","s1panplw"],["The Doomsday Clock's time comes from expert opinions on current events.","nearish","s1unyl96"],["As of 2026 the Doomsday Clock is 85 seconds to midnight.","nearish","syyi6qa"],["The Doomsday Clock was set to 85 seconds on 27 January 2026.","nearish","s5e5r7z"],["The Doomsday Clock's usefulness: it focuses media attention and works as a diplomatic tool.","nearish","svxtoge"],["Londoners feared the end of the world in 1666, with fire and illness all around.","nearish","s1g92t0s"],["Millerites: New England preacher William Miller calculated 2,300 years from 457 BCE using the Book of Daniel.","nearish","s1g31yy5"],["Miller's first window for Christ's return ran from March 1843 to March 1844.","nearish","s5eeuxl"],["Miller attracted an estimated 100,000+ followers, with as many as a million attending meetings.","nearish","s1hwdphk"],["William Miller's date was reset to October 22, 1844.","nearish","szwhv2k"],["When Miller's reset date passed too, the event became known as the Great Disappointment.","nearish","s5089co"],["Wodziwob's visions came in 1869, from a prophet in Nevada.","nearish","s155p1lj"],["Wodziwob's visions followed a typhoid epidemic and colonial catastrophe in 1867.","nearish","s1mygzh2"],["Wodziwob saw white people swallowed up while Native peoples were ight.","nearish","slvhoxo"],["A 2008 rumor said the Large Hadron Collider might spawn a micro black hole.","nearish","s12k0q8t"],["A real micro black hole would evaporate via Hawking radiation.","nearish","s1280ixz"],["Mayan Apocalypse: December 21, 2012 was the end of the Maya Long Count calendar.","nearish","sdknn7j"],["December 21, 2012 marked a restart of the Maya calendar, which contained no doomsday prophecy.","nearish","shy3pzm"],["Common traits of failed doomsday predictions: a specific date, an authority figure, a real problem misunderstood, and reinterpretation after failure.","nearish","s16w01c0"],["Which of these predictions was NOT revised after it failed? Mayan Apocalypse","nearish","q1r6lt0d"],["Y2K's feared results included cascading blackouts and frozen banks.","nearish","suj19w3"],["After midnight on Y2K there were only a few glitches.","nearish","s1djl439"],["Hon-Ming Chen's prophecy included devil spirits and flooding.","nearish","s1t22v5v"],["Which doomsday scare involved a chemical cousin to cyanide? Halley's Comet panic","nearish","qii9tvw"],["Which prediction came from credible astrophysicists whose book became a bestseller? The Jupiter Effect","nearish","qtfhqao"],["The Four Horsemen's white horse: Conquest. The rider is often crowned and holds a bow.","nearish","sazwdbc"],["The Four Horsemen's red horse: War. The rider carries a large sword.","nearish","swjky12"],["The Four Horsemen's black horse: Famine. The rider holds a pair of scales.","nearish","so3nzzr"],["The Four Horsemen's pale green horse: Death, who with Hades kills \"with sword, famine, and pestilence, and by the wild animals of the earth.\"","nearish","s1ubi7qb"],["The Four Horsemen come from the Book of Revelation.","nearish","skid6o1"],["Albrecht Dürer, The Four Horsemen of the Apocalypse (1498)","nearish","w19bbret"],["Sandro Botticelli, The Mystical Nativity (1500)","nearish","wph2551"],["Michelangelo, The Last Judgment (1536–1541)","nearish","wl1l8et"],["Pieter Bruegel the Four Horsemen of the Apocalypse: Woodcut, 15-page book The Apocalypse. Dürer self-published it, and his \"AD\" monogram sits at bottom center.","works","n1kub2ee","r"],["Sandro Botticelli, The Mystical Nativity (1500)","works"],["The Mystical Nativity: A Nativity with twelve dancing angels above, and angels embracing men below while demons flee into cracks in the earth.","works","ngyvuau","s"],["The Mystical Nativity: Painted while Florentines, stirred by the monk Savonarola, believed the end was near.","works","ngyvuau","y"],["The Mystical Nativity: Oil on canvas. His only surviving signed and dated painting. He used medieval \"hierarchical scale\", and a Greek inscription mentions the \"troubles of Italy\".","works","ngyvuau","r"],["Michelangelo, The Last Judgment (1536–1541)","works"],["The Last Judgment: The Second Coming on the Sistine Chapel altar wall. A beardless Christ casts judgment, the saved rise on the left and the damned fall on the right.","works","n1v3p86","s"],["The Last Judgment: Painted after the 1527 Sack of Rome, when the apocalypse felt like a near reality rather than a distant prophecy.","works","n1v3p86","y"],["The Last Judgment: Fresco. St. Bartholomew's flayed skin hides a self-portrait. Biagio da Cesena appears in hell as Minos. Volterra, \"Il Braghettone\", later painted loincloths over exposed genitals.","works","n1v3p86","r"],["Pieter Bruegel the Elder, The Triumph of Death (c. 1562)","works"],["The Triumph of Death: An army of skeletons slaughters the living in a burning wasteland. A king dies in the bottom left, and young lovers play music unaware in the bottom right.","works","n1n7k5hk","s"],["The Triumph of Death: For plague-hit, war-torn 16th-century Europe, the end felt near every day.","works","n1n7k5hk","y"],["The Triumph of Death: Oil on panel, Prado. Draws on the Danse Macabre. There are no angels or heaven, so the vision is secular. Skeletons use coffin lids as shields.","works","n1n7k5hk","r"],["Thomas Cole, The Course of Empire: Destruction (1836)","works"],["The Course of Empire: Destruction: A classical city is sacked by invaders. Palaces burn, a bridge collapses, and a headless warrior statue lunges in the foreground.","works","nyy64mc","s"],["The Course of Empire: Destruction: A civilizational warning to Jacksonian America that arrogant empires destroy themselves.","works","nyy64mc","y"],["The Course of Empire: Destruction: Oil on canvas, fourth of five paintings. Cole founded the Hudson River School. The same mountain peak appears in all five, because nature outlasts empires.","works","nyy64mc","r"],["John Martin, The Great Day of His Wrath (1851–1853)","works"],["The Great Day of His Wrath: The opening of the Sixth Seal. Mountains fold inward, a city tumbles into an abyss, and tiny humans look like insects.","works","n6mbw2w","s"],["The Great Day of His Wrath: It shows the exact second \"nearish\" becomes now.","works","n6mbw2w","y"],["The Great Day of His Wrath: Oil on canvas, Tate Britain, part of a Last Judgement triptych. Inspired by the polluted Black Country at night. Critics coined \"Martinesque\". The paintings toured like a 19th-century blockbuster.","works","n6mbw2w","r"],["Otto Dix, World War I prints (1924)","works"],["World War I prints: Der Krieg, 50 black-and-white prints of trench warfare: corpses in barbed wire, shell shock, shrapnel wounds and gas masks.","works","nfdopnq","s"],["World War I prints: For soldiers the end was no prophecy but daily reality, a man-made hell.","works","nfdopnq","y"],["World War I prints: Etching and aquatint, so acid bites the lines. Modeled on Goya's Disasters of War. Dix was a machine-gunner, called the prints a psychological purge, and was labeled \"degenerate\" by the Nazis.","works","nfdopnq","r"],["Viktor Schreckengost, Apocalypse '42 (1942)","works"],["Apocalypse '42: A cartoonish ceramic of Hitler, Mussolini, Hirohito and skeletal Death riding one black horse.","works","nr37vr9","s"],["Apocalypse '42: It says the apocalypse is happening now, driven by the Axis leaders, and mocks them to cut them down to size.","works","nr37vr9","y"],["Apocalypse '42: Glazed ceramic, a parody of Dürer. Cheerful pottery makes the horror jarring. Mussolini holds the fasces. Schreckengost was also a major industrial designer.","works","nr37vr9","r"],["Harry Louis Freund, Four Horsemen of the Apocalypse (1946)","works"],["Four Horsemen of the Apocalypse: The Horsemen, with Death holding a scythe, charge through clouds above a modern battlefield of tanks and rifles.","works","nlbce5b","s"],["Four Horsemen of the Apocalypse: After the Holocaust and atomic bombs, humanity had proven it could end the world itself.","works","nlbce5b","y"],["Four Horsemen of the Apocalypse: Lithograph, 1946. It blends ancient symbols with modern war: our tools changed, human nature didn't. Compare it with Dürer and Schreckengost. Freund also painted Depression-era public murals.","works","nlbce5b","r"],["Saby Menyhei, The Last of Us: Season 1 Concept Art (2025)","works"],["The Last of Us: Season 1 Concept Art: Digital paintings of cities like Boston two decades after a Cordyceps fungus outbreak, overrun by lush plants.","works","nz0nsim","s"],["The Last of Us: Season 1 Concept Art: Here the end already happened, and it is a slow, quiet decay, not an explosion.","works","nz0nsim","y"],["The Last of Us: Season 1 Concept Art: For HBO's 2023 series, arriving just after COVID-19 lockdowns. Menyhei works at ILM. Artists studied Chernobyl. The Earth heals without us.","works","nz0nsim","r"],["Kevin Sherwood & James McCawley, \"Where Are We Going?\" (2013)","works"],["\"Where Are We Going?\": Hidden Call of Duty song from \"Mob of the Dead\", about four dead 1930s mobsters forced to fight zombies in a hellish Alcatraz.","works","n1pnba39","s"],["\"Where Are We Going?\": The characters keep approaching an end that never comes, so suffering is prolonged forever.","works","n1pnba39","y"],["\"Where Are We Going?\": Vocals by Malukah. A slow crescendo with ghostly reverb. An Easter egg unlocked with the codes 115 and 935.","works","n1pnba39","r"],["Olivier Messiaen, Quartet for the End of Time: \"Abyss of the Birds\" (1940)","works"],["Quartet for the End of Time: \"Abyss of the Birds\": Movement III, a solo for clarinet. Very slow held notes are broken by frantic imitations of birdsong.","works","n1gbkil2","s"],["Quartet for the End of Time: \"Abyss of the Birds\": Written in a WWII prison camp. For Messiaen the end was hopeful, a moment when painful time stops.","works","n1gbkil2","y"],["Quartet for the End of Time: \"Abyss of the Birds\": Stalag VIII-A, premiered in January 1941 to about 400 prisoners and guards. \"Abyss\" is time and despair, \"Birds\" are joy and eternity. Messiaen had synesthesia.","works","n1gbkil2","r"],["Black Sabbath, \"Electric Funeral\" (1970)","works"],["\"Electric Funeral\": A nuclear wasteland after the bomb, with buildings falling and rivers turned to wood.","works","n1d6mf4f","s"],["\"Electric Funeral\": The end comes from human technology rather than divine judgment.","works","n1d6mf4f","y"],["\"Electric Funeral\": On the album Paranoid. Iommi's sludgy distorted riff breaks into a fast section for the blast. Lyrics by Geezer Butler.","works","n1d6mf4f","r"],["REM, \"It's the End of the World as We Know It\" (1987)","works"],["\"It's the End of the World as We Know It\": A breathless, stream-of-consciousness list of disasters and celebrities, followed by \"And I feel fine\".","works","nqksvk6","s"],["\"It's the End of the World as We Know It\": It treats the apocalypse as exhausting media bombardment, answered with joyful acceptance.","works","nqksvk6","y"],["\"It's the End of the World as We Know It\": On the album Document, at the dawn of 24-hour cable news. The \"L.B.\" names came from a dream. It surges back on the charts in every crisis.","works","nqksvk6","r"],["Leonardo da Vinci, Mona Lisa (Louvre) & Mona Lisa (Isleworth) (c. 16th century)","works"],["Mona Lisa (Louvre) & Mona Lisa (Isleworth): Lisa Gherardini in a relaxed three-quarter pose. The Isleworth version shows a younger sitter, with full columns and a simpler landscape.","works","nmcmlgf","s"],["Mona Lisa (Louvre) & Mona Lisa (Isleworth): The Isleworth version may be an earlier draft of the world's most famous painting.","works","nmcmlgf","y"],["Mona Lisa (Louvre) & Mona Lisa (Isleworth): Louvre: oil on poplar, sfumato, stolen in 1911 by a handyman. Isleworth: oil on canvas, which is why many reject it. Leonardo kept revising the Louvre version until he died.","works","nmcmlgf","r"],["Vincent van Gogh, Bedroom in Arles (three versions) (1888–1889)","works"],["Bedroom in Arles (three versions): Van Gogh's simple bedroom in the Yellow House, with paired chairs, pillows and portraits, and a bright yellow bed.","works","n1p48v","s"],["Bedroom in Arles (three versions): He painted the same room three times to recapture its emotional safety.","works","n1p48v","y"],["Bedroom in Arles (three versions): October 1888, then two in September 1889 from the asylum. The pairs show his loneliness. The walls were violet, but the red pigment faded, leaving them blue. Flattened like Japanese prints.","works","n1p48v","r"],["Edvard Munch, Despair & The Scream (1892 & 1893)","works"],["Despair & The Scream: The same bridge over the Oslofjord at sunset. A man in a hat leans on the rail in Despair, and a skeletal figure clutches its face in The Scream.","works","n1vk0miv","s"],["Despair & The Scream: Despair is the literal rough draft of The Scream.","works","n1vk0miv","y"],["Despair & The Scream: The figure isn't screaming. It covers its ears against a scream passing through nature. Krakatoa (1883) may explain the red skies. Versions of The Scream were stolen in 1994 and 2004.","works","n1vk0miv","r"],["Henri Matisse, Dance (I) & Dance (II) (1909 & 1910)","works"],["Dance (I) & Dance (II): Five nude figures dance in a circle on a green hill under a blue sky.","works","n18oikmc","s"],["Dance (I) & Dance (II): Dance (I) is a full-scale working draft for the final commission.","works","n18oikmc","y"],["Dance (I) & Dance (II): For Sergei Shchukin's Moscow mansion. Dance (I) has pale pink figures, Dance (II) fiery red ones. Matisse led the Fauves, and critics called it barbaric. The motif comes from The Joy of Life (1906).","works","n18oikmc","r"],["The Beatles, \"Strawberry Fields Forever (Home Demo Sequence)\" (1966)","works"],["\"Strawberry Fields Forever (Home Demo Sequence)\": Lennon alone on guitar, stumbling through chords and lyrics about a children's home near where he grew up.","works","ntlrjgq","s"],["\"Strawberry Fields Forever (Home Demo Sequence)\": We can hear a masterpiece being drafted in real time.","works","ntlrjgq","y"],["\"Strawberry Fields Forever (Home Demo Sequence)\": Written in Spain after the Beatles quit touring. The final version splices two takes, with George Martin matching their keys and tempos, and has a Mellotron intro.","works","ntlrjgq","r"],["Lin-Manuel Miranda, \"This One's Mine\" (2018)","works"],["\"This One's Mine\": First draft of \"Helpless\" from Hamilton, with Eliza fiercely claiming Hamilton. A simple R&B demo sung by Miranda.","works","n3fe7ea","s"],["\"This One's Mine\": It shows how honest feedback improves a draft.","works","n3fe7ea","y"],["\"This One's Mine\": His wife Vanessa Nadal said it didn't feel like his final draft. Released in \"Hamildemos\" in 2018. The phrase survives in \"Helpless\".","works","n3fe7ea","r"],["Sophia Anne Caruso, \"Dead Mom (Demo)\" (2019)","works"],["\"Dead Mom (Demo)\": Lydia Deetz from Beetlejuice angrily begs her dead mother for a sign, over a rock band.","works","n1jfmxwi","s"],["\"Dead Mom (Demo)\": A \"public draft\" that shows the song as raw pop-punk before its Broadway orchestration.","works","n1jfmxwi","y"],["\"Dead Mom (Demo)\": Written by Eddie Perfect, and Caruso was 17. Released as a promo. TikTok teens helped save the show.","works","n1jfmxwi","r"],["EJAE, \"Golden\" (various demos) (2025)","works"],["\"Golden\" (various demos): EJAE's raw demos of Rumi's \"I want\" song from K-Pop: Demon Hunters, about releasing perfection.","works","n31yslw","s"],["\"Golden\" (various demos): The film needed nearly 60 demos for some sequences, so it's a masterclass in drafting.","works","n31yslw","y"],["\"Golden\" (various demos): EJAE was an SM trainee for 10 years. Her guide vocals got her cast as Rumi's singing voice. It was the first K-pop song to win the Best Original Song Oscar.","works","n31yslw","r"],["Aladdin (cut song), \"Count on Me\" (1994)","works"],["\"Count on Me\": Aladdin promises his monkey Abu riches and adventure, in a bouncy piano showtune.","works","nkvdgzl","s"],["\"Count on Me\": A rejected draft written to replace \"Proud of Your Boy\" when Aladdin's mother was cut.","works","nkvdgzl","y"],["\"Count on Me\": Alan Menken sings and wrote the lyrics himself after Howard Ashman died in 1991. Its rejection led to \"A Whole New World\".","works","nkvdgzl","r"],["Pocahontas (cut song), \"First to Dance\" (1995)","works"],["\"First to Dance\": Grandmother Willow teaches Pocahontas and John Smith how to stop a war. Dancing stands for peace.","works","n1udk9hj","s"],["\"First to Dance\": A discarded draft cut because it disrupted the pacing.","works","n1udk9hj","y"],["\"First to Dance\": Menken and Stephen Schwartz. Menken sings all three parts. Released in 2015, after 20 years in the vault. The idea \"someone has to break the pattern\" survives in the climax.","works","n1udk9hj","r"],["Book of Mormon (cut song), \"Family Home Evening\" (2009)","works"],["\"Family Home Evening\": From The Book of Mormon workshops: a peppy satire of a \"perfect\" Mormon family's Monday night, like a 1950s sitcom theme.","works","n1wvwxoq","s"],["\"Family Home Evening\": A \"sacrificed draft\": a hit with test audiences, but it didn't advance the plot.","works","n1wvwxoq","y"],["\"Family Home Evening\": Parker, Stone and Lopez sing it. Parker once dated a Mormon girl. The idea became the opening number \"Hello!\".","works","n1wvwxoq","r"],["Dear Evan Hansen (cut song), \"In the Bedroom Down the Hall\" (2017)","works"],["\"In the Bedroom Down the Hall\": From Dear Evan Hansen: a duet of two mothers remembering their sons as little boys. \"I gave all I could... and I thought it was enough.\"","works","nnfvtm3","s"],["\"In the Bedroom Down the Hall\": A beautiful song cut because the show could not hold too many slow ballads.","works","nnfvtm3","y"],["\"In the Bedroom Down the Hall\": Pasek and Paul, sung by Rachel Bay Jones and Jennifer Laura Thompson. The cut made room for \"So Big / So Small\".","works","nnfvtm3","r"],["J.M.W. Turner, Rain, Steam, and Speed (1844)","works"],["Rain, Steam, and Speed: A steam train crosses Maidenhead Railway Bridge in a rainstorm. A small boat and a ploughing farmer represent the past.","works","nqhyvrx","s"],["Rain, Steam, and Speed: Society sits on the threshold between agrarian past and industrial future, and paint hovers between realism and abstraction.","works","nqhyvrx","y"],["Rain, Steam, and Speed: Oil on canvas, National Gallery, London. A tiny hare races the train. A legend says Turner stuck his head out of a train window in a downpour.","works","nqhyvrx","r"],["William Powell Frith, The Railway Station (1862)","works"],["The Railway Station: A crowded panorama of London's Paddington Station, with a bride, crying mothers and a criminal being arrested.","works","n10ysydt","s"],["The Railway Station: A station is a threshold where every class shares one fleeting moment.","works","n10ysydt","y"],["The Railway Station: Oil on canvas. Two real Scotland Yard detectives modeled. Huge paying crowds came to see it. The family on the left is Frith's own.","works","n10ysydt","r"],["Tsukioka Yoshitoshi, Picture of the Railroad at Takanawa (1871)","works"],["Picture of the Railroad at Takanawa: Japan's first railway, on an embankment through Tokyo Bay, passing wooden sailboats.","works","n4ex2sq","s"],["Picture of the Railroad at Takanawa: Japan stands between the feudal Edo period and the Meiji era, and tracks run between land and sea.","works","n4ex2sq","y"],["Picture of the Railroad at Takanawa: Woodblock triptych. \"Speculative journalism\": printed in 1871, before the line opened in 1872. The train cars look like Japanese buildings.","works","n4ex2sq","r"],["Claude Monet, Gare Saint-Lazare (1877)","works"],["Gare Saint-Lazare: A locomotive enters a Paris station in clouds of steam under an iron and glass canopy.","works","n1u0r5dj","s"],["Gare Saint-Lazare: A station is a hub of constant transition, caught in fleeting light and smoke.","works","n1u0r5dj","y"],["Gare Saint-Lazare: Oil on canvas, Musée d'Orsay, one of 12. Monet got the station master to halt trains and pack engines with coal for smoke.","works","n1u0r5dj","r"],["Steve McCurry, Train Station, Agra, 1983 (1983)","works"],["Train Station, Agra, 1983: Men work on a dark steam locomotive at Agra station, with the Taj Mahal in the mist behind.","works","n19z51k7","s"],["Train Station, Agra, 1983: Two worlds collide: India's majestic past and its industrial present.","works","n19z51k7","y"],["Train Station, Agra, 1983: Color photograph at golden hour, from a five-month train trip. McCurry later shot Afghan Girl. The tracks are gone now, so it can't be recreated.","works","n19z51k7","r"],["Richard Artschwager, Six in Four (2015)","works"],["Six in Four: The four passenger elevators of the Whitney Museum, designed around six domestic motifs: door, window, table, basket, mirror and rug.","works","n1sh6lxc","s"],["Six in Four: Elevators are the ultimate modern liminal space, and he turns \"dead time\" into the museum's first art experience.","works","n1sh6lxc","y"],["Six in Four: Artschwager's final major work, made with Otis. The only permanent art commission for the new Whitney building.","works","n1sh6lxc","r"],["Paul Gauguin, Where Do We Come From? What Are We? Where Are We Going? (1897–98)","works"],["Where Do We Come From? What Are We? Where Are We Going?: Read right to left: a baby, young adults at daily life, and an old woman near death, watched by a blue idol.","works","n1onk01p","s"],["Where Do We Come From? What Are We? Where Are We Going?: It explores life's great liminal crossings of birth, life and death.","works","n1onk01p","y"],["Where Do We Come From? What Are We? Where Are We Going?: Oil on canvas, Tahiti. Synthetist style. He claimed a suicide attempt after finishing it. The French title on the canvas has no question marks.","works","n1onk01p","r"],["Rene Magritte, The Treachery of Images (1929)","works"],["The Treachery of Images: A realistic pipe above the words \"Ceci n'est pas une pipe\" (This is not a pipe).","works","n1d0hyi0","s"],["The Treachery of Images: It explores the boundary between an object and the images and words that represent it.","works","n1d0hyi0","y"],["The Treachery of Images: Oil on canvas, LACMA. Painted like an advertisement. Magritte's reply: \"Just try to fill it with tobacco!\"","works","n1d0hyi0","r"],["Salvador Dali, The Persistence of Memory (1931)","works"],["The Persistence of Memory: Melting watches on a barren landscape, with a dead olive tree, ants on a gold watch and a strange sleeping creature.","works","ngd14lp","s"],["The Persistence of Memory: A psychological threshold between the waking world and dreams.","works","ngd14lp","y"],["The Persistence of Memory: Oil on canvas, MoMA, only 9.5 x 13 inches. Inspired by melting Camembert, not Einstein. The creature is a distorted self-portrait. Port Lligat landscape.","works","ngd14lp","r"],["Andrew Wyeth, Christina's World (1948)","works"],["Christina's World: A woman in a pink dress lies in a dry field, looking up at a distant gray farmhouse.","works","nz6qs18","s"],["Christina's World: She is suspended between where she is and where she wants to be.","works","nz6qs18","y"],["Christina's World: Egg tempera, MoMA. Anna Christina Olson refused a wheelchair and crawled. Wyeth's 26-year-old wife modeled the torso and head, but the arms and hands are Christina's.","works","nz6qs18","r"],["M. C. Escher, Ascending and Descending (1960)","works"],["Ascending and Descending: Hooded figures circle a square staircase forever, some always climbing and others always descending.","works","n4ud1nk","s"],["Ascending and Descending: An endless liminal space where the figures move but never arrive.","works","n4ud1nk","y"],["Ascending and Descending: Lithograph based on the Penrose stairs. Two \"recalcitrant\" figures sit out the rat race. Nolan used the paradox in Inception.","works","n4ud1nk","r"],["Gregory Crewdson, Beneath the Roses (2004)","works"],["Beneath the Roses: Staged, film-like photographs of isolated, motionless people in rundown American small towns.","works","nxagoyj","s"],["Beneath the Roses: Liminal on three levels: twilight in time, suburbs in space, frozen states of mind.","works","nxagoyj","y"],["Beneath the Roses: 49 photographs, Massachusetts Rust Belt towns, made with a crew of about 60. Crewdson doesn't press the shutter. An influence on Stranger Things.","works","nxagoyj","r"],["Camille Seaman, The Distant is Imminent (2020)","works"],["The Distant is Imminent: Video of melting polar icebergs projected onto coastal city buildings, with a waterline showing sea level by 2050.","works","n8eea20","s"],["The Distant is Imminent: It collapses the boundary between distant poles and local streets, and between a dry present and a flooded future.","works","n8eea20","y"],["The Distant is Imminent: Launched October 10, 2020, for TED's Countdown. Open-source: anyone could project it. Seaman is of Shinnecock and African American descent, and treats icebergs as portraits.","works","n8eea20","r"],["Yilan Folk Song, \"Drip, Drip, Drip\" (c. 1924)","works"],["\"Drip, Drip, Drip\": A coal train passes through a tunnel while water drips on its metal roof.","works","n1x0xk4","s"],["\"Drip, Drip, Drip\": A tunnel is a dark passage between A and B.","works","n1x0xk4","y"],["\"Drip, Drip, Drip\": Yilan folk song, also Diu Diu Dang Ah. \"Diu diu\" mimics both engine and drips. Tied to the Old Caoling Tunnel, now a bike path. Pentatonic scale.","works","n1x0xk4","r"],["Samuel Beckett, Waiting for Godot, Scene 2 (1953)","works"],["Waiting for Godot, Scene 2: Vladimir and Estragon wait again on a country road for Godot, who never comes. The tree has sprouted a few leaves.","works","na194do","s"],["Waiting for Godot, Scene 2: The ultimate story of being stuck: they can't move on and can't leave.","works","na194do","y"],["Waiting for Godot, Scene 2: The play ends each act with \"Yes, let's go.\" (They do not move.) Beckett: \"If I knew, I would have said so in the play.\" San Quentin inmates understood it.","works","na194do","r"],["Pablo Neruda, \"Keeping Still\" (1958)","works"],["\"Keeping Still\": Neruda asks everyone to count to twelve and stop moving and speaking for a moment.","works","ngtxae6","s"],["\"Keeping Still\": A plea to create a liminal space on purpose.","works","ngtxae6","y"],["\"Keeping Still\": Also \"Keeping Quiet\", from Estravagario. Free verse, with twelve standing for clock hours or months. He wrote in green ink. Stillness is not \"total inactivity\".","works","ngtxae6","r"],["Philippe Orreindy, I'll Wait for the Next One... (2002)","works"],["I'll Wait for the Next One...: A man on a metro train announces he's lonely and invites any woman to step off with him. One does, and learns it was a begging routine.","works","n13x72xt","s"],["I'll Wait for the Next One...: On a train strangers are forced together and normal social rules are suspended. She is left stranded in limbo.","works","n13x72xt","y"],["I'll Wait for the Next One...: French short film, about 4 minutes, Oscar-nominated. Actor Thomas Gaudin co-wrote it. The title's double meaning is the punchline.","works","n13x72xt","r"],["Marcel Ayme, \"The Man Who Could Walk through Walls\" (1941)","works"],["\"The Man Who Could Walk through Walls\": Dutilleul, a dull clerk, uses his power for revenge, robbery and an affair, then gets stuck inside a wall.","works","n11tosxq","s"],["\"The Man Who Could Walk through Walls\": A literal answer to what happens if you get stuck in a liminal space.","works","n11tosxq","y"],["\"The Man Who Could Walk through Walls\": Published under Nazi-occupied Paris, as an escape fantasy. A forgotten pill cures his power. A Jean Marais statue stands in Montmartre.","works","n11tosxq","r"],["Amor Towles, A Gentleman in Moscow (Excerpt) (2019)","works"],["A Gentleman in Moscow (Excerpt): In 1922 Count Rostov is sentenced to indefinite house arrest in the Metropol Hotel.","works","n1e5weoo","s"],["A Gentleman in Moscow (Excerpt): A hotel is built for temporary stays, and he must build a whole life in it.","works","n1e5weoo","y"],["A Gentleman in Moscow (Excerpt): \"If a man does not master his circumstances, he is bound to be mastered by them.\" Idea came from a Geneva hotel. Published 2016.","works","n1e5weoo","r"],["Brian Eno, Ambient 1: Music for Airports (1979)","works"],["Ambient 1: Music for Airports: Slow, drifting piano and wordless voices with no beat or set structure.","works","n1cv5ic2","s"],["Ambient 1: Music for Airports: Music made to calm airports, it asks whether sound should enhance a room rather than demand attention.","works","n1cv5ic2","y"],["Ambient 1: Music for Airports: Conceived at Cologne Bonn Airport. \"As ignorable as it is interesting.\" Uneven tape loops drift in and out of sync. Played at LaGuardia in 1980.","works","n1cv5ic2","r"],["Hiroshi Yoshimura, Music for Nine Postcards (1982)","works"],["Music for Nine Postcards: Sparse Fender Rhodes and synth notes, each track like a view from a window.","works","n9cedoi","s"],["Music for Nine Postcards: A Japanese counterpart to Eno, made for a calm museum instead of a stressful airport.","works","n9cedoi","y"],["Music for Nine Postcards: Composed for the Hara Museum, Tokyo. Silence counts as much as notes. The YouTube algorithm revived it during the pandemic.","works","n9cedoi","r"],["Max Richter, Sleep (2015)","works"],["Sleep: An 8.5-hour piece of very slow music, meant to be slept through.","works","ns8bj44","s"],["Sleep: Sleep is the human liminal space, and it takes Eno's passive listening to the extreme.","works","ns8bj44","y"],["Sleep: Piano, strings, electronics and Grace Davidson's voice. About 40 BPM. Richter consulted neuroscientist David Eagleman. Audiences get beds.","works","ns8bj44","r"],["Gwendolyn Brooks, \"We Real Cool\" (1963)","works"],["\"We Real Cool\": Seven young men at a pool hall list what they do, ending with \"Die soon.\"","works","nt71y6k","s"],["\"We Real Cool\": They wear a tough mask of adulthood, and this rushed maturity leads to a dead end.","works","nt71y6k","y"],["\"We Real Cool\": 24 words. Enjambment ends lines on \"We\", read softly. The hall is The Golden Shovel, which suggests digging a grave, and it inspired the Golden Shovel form. Brooks was the first African American Pulitzer winner.","works","nt71y6k","r"],["Virginia Driving Hawk Sneve, \"The Medicine Bag\" (1975)","works"],["\"The Medicine Bag\": Martin is embarrassed when his frail Lakota grandfather, Joe Iron Shell, visits, then accepts the sacred medicine bag.","works","n7bnuj6","s"],["\"The Medicine Bag\": A real rite of passage. Adulthood here means taking off the mask of cool.","works","n7bnuj6","y"],["\"The Medicine Bag\": First in Boys' Life magazine. The bag holds iron from a settler's kettle, a symbol of adaptation. Sneve won the National Humanities Medal in 2000.","works","n7bnuj6","r"],["Carol Ann Duffy, \"In Mrs. Tilscher's Class\" (1990)","works"],["\"In Mrs. Tilscher's Class\": A school year runs from cozy autumn to restless summer, as children start learning about growing up.","works","nxsdo96","s"],["\"In Mrs. Tilscher's Class\": The messy middle between childhood and adulthood, an unavoidable change.","works","nxsdo96","y"],["\"In Mrs. Tilscher's Class\": Tadpoles \"changed from commas into exclamation marks.\" The final thunderstorm stands for puberty. Duffy was the first female Poet Laureate of the UK.","works","nxsdo96","r"],["Joss Whedon, \"Where Do We Go From Here?\" (2001)","works"],["\"Where Do We Go From Here?\": Buffy's cast, freed from a singing spell, ask what comes after the battle.","works","n9uqko4","s"],["\"Where Do We Go From Here?\": Their masks are gone and there is no script for what's next.","works","n9uqko4","y"],["\"Where Do We Go From Here?\": From \"Once More, with Feeling\" (Season 6). The song cuts off mid-measure. Whedon wrote the score though he couldn't read music.","works","n9uqko4","r"],["Karen Russell, \"Lucy's Home for Girls Raised by Wolves\" (2006)","works"],["\"Lucy's Home for Girls Raised by Wolves\": Nuns civilize werewolf-born girls. Claudette watches her sisters Jeanette, who conforms, and Mirabella, who refuses.","works","n17wqxv0","s"],["\"Lucy's Home for Girls Raised by Wolves\": Becoming \"human\" here is a painful mask that has to be learned.","works","n17wqxv0","y"],["\"Lucy's Home for Girls Raised by Wolves\": Full title: \"St. Lucy's Home...\". An allegory of Indigenous boarding schools. Narration moves from \"we\" to \"I\". Ends with her first human lie: \"I'm home.\"","works","n17wqxv0","r"],["Ruth B, \"Lost Boy\" (2015)","works"],["\"Lost Boy\": The narrator escapes loneliness by joining Peter Pan in Neverland.","works","n1n1m9cr","s"],["\"Lost Boy\": She refuses adulthood and wears the mask of a Lost Boy forever.","works","n1n1m9cr","y"],["\"Lost Boy\": Began as a 6-second Vine in 2014. Solo voice and piano in 6/8 time. Ruth B is from Edmonton.","works","n1n1m9cr","r"],["Major Jackson, \"Let Me Begin Again\" (2021)","works"],["\"Let Me Begin Again\": An adult speaker pleads to be reborn as something small, like a thought or a bird's fresh senses.","works","n1e93qyh","s"],["\"Let Me Begin Again\": Adulthood may be a continuing cycle of starting over.","works","n1e93qyh","y"],["\"Let Me Begin Again\": Repeats \"Let me...\", a secular prayer. Major Jackson hosts The Slowdown. Influenced by Camus's Absurd Man.","works","n1e93qyh","r"],["Rumi, \"A stone I died\" (c. 13th century)","works"],["\"A stone I died\": The soul dies as mineral, plant, animal and human, each time rising to something higher, then to angel.","works","n1re1s6k","s"],["\"A stone I died\": Death is a temporary layover, and each \"death\" is a promotion.","works","n1re1s6k","y"],["\"A stone I died\": Also \"I died as a mineral\". Repeating \"I died\" turns death into growth. Rumi's grief over Shams of Tabriz fueled his poetry. Whirling Dervishes are the Mevlevi Order.","works","n1re1s6k","r"],["John Donne, \"Death Be not Proud\" (1633)","works"],["\"Death Be not Proud\": The speaker mocks Death as a slave to fate, kings and sickness: \"Death, thou shalt die.\"","works","ncroztl","s"],["\"Death Be not Proud\": Death is \"one short sleep\", a brief doorway to eternal life.","works","ncroztl","y"],["\"Death Be not Proud\": Holy Sonnet X, written about 1609. Donne became Dean of St Paul's and modeled in his shroud for his monument.","works","ncroztl","r"],["Alfred Lord Tennyson, \"Ulysses\" (1842)","works"],["\"Ulysses\": Aged Ulysses, bored as king of Ithaca, gives the crown to Telemachus and rallies his crew for one last voyage.","works","nlo9qbh","s"],["\"Ulysses\": He refuses home as the final port and sails toward death on his own terms.","works","nlo9qbh","y"],["\"Ulysses\": Dramatic monologue in blank verse. \"To strive, to seek, to find, and not to yield.\" Written after Arthur Hallam's death. M recites it in Skyfall.","works","nlo9qbh","r"],["Emily Dickinson, \"Because I could not stop for Death\" (1890)","works"],["\"Because I could not stop for Death\": Death, a polite gentleman, drives the speaker past children, grain and the sunset to a \"House\" (her grave).","works","n1uw2x1b","s"],["\"Because I could not stop for Death\": Death is a calm carriage ride, and the grave a temporary stop before Eternity.","works","n1uw2x1b","y"],["\"Because I could not stop for Death\": Poem 479, in common meter like hymns. Written about 1863. Lavinia found nearly 1,800 poems in a chest. Her original text returned in 1955.","works","n1uw2x1b","r"],["Rabindranath Tagore, \"Gitanjali 95\" (1913)","works"],["\"Gitanjali 95\": Birth and death compared: a baby cries when taken from the right breast and finds comfort at the left.","works","ng4fcrg","s"],["\"Gitanjali 95\": Death is the same as birth, with the universe as a mother on both sides.","works","ng4fcrg","y"],["\"Gitanjali 95\": Prose poem. Yeats wrote the introduction. Tagore was the first non-European Nobel Literature winner (1913). He returned his knighthood in 1919 after Amritsar.","works","ng4fcrg","r"],["Dmitri Shostakovich, 15th Symphony: Fourth Movement (1972)","works"],["15th Symphony: Fourth Movement: A slow repeating bass line and quoted melodies end in dry percussion clicks fading to silence.","works","n1gna2vz","s"],["15th Symphony: Fourth Movement: Death as a cold, mechanical fading away, like a hospital machine.","works","n1gna2vz","y"],["15th Symphony: Fourth Movement: Passacaglia. Quotes Wagner's Fate motif and the Tristan chord. Written in hospital, and his last symphony. The first movement quotes William Tell.","works","n1gna2vz","r"],["Thich Nhat Hanh, \"Please Call Me by My True Names\" (1976)","works"],["\"Please Call Me by My True Names\": The speaker says he is both victim and attacker: maybug and bird, a refugee girl and the sea pirate.","works","ngyqyhu","s"],["\"Please Call Me by My True Names\": There is no final port, only continuous transformation, so fear disappears.","works","ngyqyhu","y"],["\"Please Call Me by My True Names\": Written in exile about the Boat People. Anaphora on \"I am\". He coined \"Interbeing\". MLK nominated him for the Nobel Peace Prize in 1967. Founded Plum Village.","works","ngyqyhu","r"],["David Berman, \"A Letter from Isaac Asimov to his Wife Janet, Written on His Deathbed\" (1999)","works"],["\"A Letter from Isaac Asimov to his Wife Janet, Written on His Deathbed\": The science fiction giant's imagined last letter turns from cosmic ideas to small, intimate details.","works","niirkyb","s"],["\"A Letter from Isaac Asimov to his Wife Janet, Written on His Deathbed\": Death is a quiet, human layover rather than a journey across the universe.","works","niirkyb","y"],["\"A Letter from Isaac Asimov to his Wife Janet, Written on His Deathbed\": From Actual Air. Berman also led the band Silver Jews. Asimov died in 1992, from HIV contracted through a transfusion.","works","niirkyb","r"],["Linkin Park, \"In the End\" (2000)","works"],["\"In the End\": A narrator admits that despite all effort, \"in the end, it doesn't even matter.\"","works","n1erg0q","s"],["\"In the End\": A blunt answer: effort and achievement are temporary masks that time erases.","works","n1erg0q","y"],["\"In the End\": From Hybrid Theory. Shinoda's rap against Bennington's chorus, with a piano riff. Bennington first disliked it.","works","n1erg0q","r"],["Emma Lazarus, \"The New Colossus\" (1883)","works"],["\"The New Colossus\": It rejects the Colossus of Rhodes for a \"Mother of Exiles\" who says \"Give me your tired, your poor\".","works","n19t73bb","s"],["\"The New Colossus\": The Statue of Liberty stands at the \"golden door\", the threshold of refuge.","works","n19t73bb","y"],["\"The New Colossus\": Petrarchan sonnet with prosopopoeia. Lazarus wrote it for a pedestal fundraiser. She died at 38, and the plaque came in 1903 thanks to Georgina Schuyler.","works","n19t73bb","r"],["Adrienne Rich, \"Prospective Immigrants Please Note\" (1963)","works"],["\"Prospective Immigrants Please Note\": The reader stands at a door and must choose: go through, or stay unchanged.","works","n8qtrzi","s"],["\"Prospective Immigrants Please Note\": Migration here is a universal choice, with no borders named.","works","n8qtrzi","y"],["\"Prospective Immigrants Please Note\": \"The door itself makes no promises.\" Rich meant \"internal immigrants\". She refused the National Medal of Arts in 1997 and shared a 1974 prize with Lorde and Walker.","works","n8qtrzi","r"],["Marilyn Chin, \"We Are Americans Now, We Live in the Tundra\" (1987)","works"],["\"We Are Americans Now, We Live in the Tundra\": Assimilated speakers find their new life barren compared with a warm Chinese past.","works","ndb66m2","s"],["\"We Are Americans Now, We Live in the Tundra\": The border is crossed, but they find a new liminal space instead of a home.","works","ndb66m2","y"],["\"We Are Americans Now, We Live in the Tundra\": Debut collection Dwarf Bamboo. The tundra stops roots growing, a metaphor for cultural loss. Pushes back on the \"model minority\" myth.","works","ndb66m2","r"],["Adrian Castro, \"The Sound of One Immigrant Clapping\" (2005)","works"],["\"The Sound of One Immigrant Clapping\": Afro-Caribbean immigrants live half-seen, as in the Zen koan of one hand clapping.","works","n3r1y4c","s"],["\"The Sound of One Immigrant Clapping\": Immigrant liminality can be a permanent paradox rather than a crossing.","works","n3r1y4c","y"],["\"The Sound of One Immigrant Clapping\": From Wise Blood. Castro is a Cuban-Dominican poet and Babalawo. Mixes Spanish and Yoruba. Fernando Ortiz coined \"transculturation\".","works","n3r1y4c","r"],["Richard Blanco, \"Mother Country\" (2019)","works"],["\"Mother Country\": A son watches his exiled mother grieve for Cuba, and realizes she is his homeland.","works","ngyhafe","s"],["\"Mother Country\": Home may be a person rather than a place.","works","ngyhafe","y"],["\"Mother Country\": From How to Love a Country. Double meaning of \"mother country\". Blanco read at Obama's 2013 inauguration, and was born in Madrid while the family was in transit.","works","ngyhafe","r"],["Frida Kahlo, The Bus (1929)","works"],["The Bus: Mexican society on a bench: housewife, worker, Indigenous mother, boy, gringo with money bag, and modern woman.","works","nxgznjq","s"],["The Bus: A bus is a moving threshold where strangers sit together and ask who belongs.","works","nxgznjq","y"],["The Bus: Oil on canvas, in the style of retablos. Kahlo survived a 1925 bus crash. The gringo sits beside the young woman to show foreign wealth.","works","nxgznjq","r"],["Jacob Lawrence, Migration (1941)","works"],["Migration: 60 panels telling the Great Migration of African Americans from the rural South to the North.","works","n1oui3hj","s"],["Migration: You need not cross a national border to be treated as an alien. Stations are recurring thresholds.","works","n1oui3hj","y"],["Migration: Casein tempera in \"Dynamic Cubism\", applying one color at a time across all panels. Lawrence was 23. Phillips owns odd panels, MoMA even ones.","works","n1oui3hj","r"],["Led Zeppelin, \"Immigrant Song\" (1970)","works"],["\"Immigrant Song\": Viking invaders sail to new lands, singing of Valhalla and the \"hammer of the gods\".","works","nggy7ps","s"],["\"Immigrant Song\": It flips the idea: this migrant is a terrifying invader, not a refugee.","works","nggy7ps","y"],["\"Immigrant Song\": From Led Zeppelin III, inspired by a 1970 Iceland trip. Played as The Nobs in Denmark. Thor: Ragnarok used it.","works","nggy7ps","r"],["Fiddler on the Roof, \"Far From the Home I Love\" (1971)","works"],["\"Far From the Home I Love\": From Fiddler on the Roof: Hodel tells Tevye she is leaving to join her exiled fiancé Perchik in Siberia.","works","n1b7f1nr","s"],["\"Far From the Home I Love\": A heartbreaking chosen migration, sung at a railway station.","works","n1b7f1nr","y"],["\"Far From the Home I Love\": 1971 film by Norman Jewison, from the 1964 musical by Bock and Harnick. Minor key. Topol played Tevye.","works","n1b7f1nr","r"],["Genesis, \"Illegal Alien\" (1983)","works"],["\"Illegal Alien\": A cheerful pop song about a man trying to cross the US-Mexico border.","works","n14a69tu","s"],["\"Illegal Alien\": It shows the border being flattened into comedy and stereotype by Western pop.","works","n14a69tu","y"],["\"Illegal Alien\": On the album Genesis. Upbeat music against grim lyrics. Collins used a mock accent, widely seen today as offensive.","works","n14a69tu","r"],["Brendan Graham, \"Isle of Hope, Isle of Tears\" (1995)","works"],["\"Isle of Hope, Isle of Tears\": The story of Annie Moore, reported as 15, the first immigrant processed at Ellis Island on January 1, 1892.","works","n8m4eo4","s"],["\"Isle of Hope, Isle of Tears\": Ellis Island is both gateway and heartbreak.","works","n8m4eo4","y"],["\"Isle of Hope, Isle of Tears\": Graham also wrote \"You Raise Me Up\". Annie got a $10 gold piece. Her true grave was found in Queens in 2006, and she was really about 17.","works","n8m4eo4","r"],["Kovi Konowiecki, Borderlands (2016)","works"],["Borderlands: Empty landscapes with fences and tires, paired with portraits of people on society's edge.","works","nd1mzsj","s"],["Borderlands: The migrant's in-between state can be a permanent inner \"nowhere place\".","works","nd1mzsj","y"],["Borderlands: Later published as And In Its Place, Another. Mixes color and black-and-white. Konowiecki was a pro soccer player.","works","nd1mzsj","r"],["Los Tigres del Norte, \"Somos Mas Americanos\" (2013)","works"],["\"Somos Mas Americanos\": A danceable Norteño song: \"I didn't cross the border, the border crossed me.\"","works","nebhd17","s"],["\"Somos Mas Americanos\": It rejects \"alien\" status because the border itself is an arbitrary line.","works","nebhd17","y"],["\"Somos Mas Americanos\": A history lesson on the 1848 Treaty of Guadalupe Hidalgo. Accordion and bajo sexto. From Uniendo Fronteras (2001).","works","nebhd17","r"],["Du Fu, \"Travelling Again\" (761 CE)","works"],["\"Travelling Again\": Du Fu passes a temple and bridge, and feels the landscape waited for him, washing his sorrow away.","works","nwo1ecf","s"],["\"Travelling Again\": For a refugee, the road is a sanctuary and home was the danger.","works","nwo1ecf","y"],["\"Travelling Again\": An Lushan Rebellion, written in Chengdu. Pathetic fallacy. Known as the \"Poet-Historian\".","works","nwo1ecf","r"],["William Shakespeare, \"Sonnet 50\" (1609)","works"],["\"Sonnet 50\": A rider travels away from his beloved. Even his horse feels the weight and groans when spurred.","works","n1wrxu03","s"],["\"Sonnet 50\": The road is a place of plodding grief, and every step forward pulls him further from love.","works","n1wrxu03","y"],["\"Sonnet 50\": \"Fair Youth\" sequence, paired with Sonnet 51. Iambic pentameter mimics hoofbeats. The 1609 dedication to \"Mr. W.H.\" is a mystery.","works","n1wrxu03","r"],["John Masefield, \"Sea Fever\" (1902)","works"],["\"Sea Fever\": The speaker longs for the sea: a tall ship, a star, wind and spray.","works","n17vajdq","s"],["\"Sea Fever\": He flips Bilbo: staying home is the danger, and the journey makes him feel alive.","works","n17vajdq","y"],["\"Sea Fever\": From Salt-Water Ballads. Loping meter mimics waves. The \"long trick\" is a shift at the wheel, and life itself. Masefield became Poet Laureate in 1930.","works","n17vajdq","r"],["Carl Sandburg, \"Window\" (1914)","works"],["\"Window\": In three lines, a night train passes \"slashes of light\" through a \"great, dark, soft thing\".","works","n1agm9ev","s"],["\"Window\": The traveler sees others' homes but stays cut off from them.","works","n1agm9ev","y"],["\"Window\": From Chicago Poems. Darkness is soft and light is violent, flipping expectations. Sandburg won three Pulitzers and was once a hobo.","works","n1agm9ev","r"],["Robert Frost, \"The Road Not Taken\" (1915)","works"],["\"The Road Not Taken\": A traveler picks one of two equal roads, and later claims it made all the difference.","works","ni2u1je","s"],["\"The Road Not Taken\": The danger is the burden of an irreversible choice.","works","ni2u1je","y"],["\"The Road Not Taken\": Often misread: both roads are \"really about the same\". A joke on Edward Thomas, killed at Arras in 1917. ABAAB rhyme.","works","ni2u1je","r"],["William Butler Yeats, \"Sailing to Byzantium\" (1927)","works"],["\"Sailing to Byzantium\": An aging man leaves \"no country for old men\" to become an immortal golden work of art.","works","nw4l8y4","s"],["\"Sailing to Byzantium\": Travel by necessity: the body is decaying, so he seeks asylum in art.","works","nw4l8y4","y"],["\"Sailing to Byzantium\": Ottava rima, ABABABCC. Nobel Prize in 1923. Gyres. Cormac McCarthy took a title from it.","works","nw4l8y4","r"],["Rustu Onur, \"The Journey\" (c. early 20th century)","works"],["\"The Journey\": A speaker with no house or boat dreams of waters \"smelling of pineapples\", but the ship leaves without them.","works","n1af5joi","s"],["\"The Journey\": What if you long to travel but are trapped at home?","works","n1af5joi","y"],["\"The Journey\": Garip movement, free verse. Onur died of tuberculosis at 22. Zonguldak, a Black Sea coal city. The film The Butterfly's Dream (2013).","works","n1af5joi","r"],["Czeslaw Milosz, \"This Only\" (1988)","works"],["\"This Only\": A traveler reaches an autumn valley with pigeons, and accepts this moment as enough.","works","nj7xv4p","s"],["\"This Only\": Sometimes it really is better to stop. It shows the peace of ending a journey.","works","nj7xv4p","y"],["\"This Only\": Miłosz resisted the Nazis in Warsaw, defected in 1951, settled in Berkeley, and won the Nobel in 1980. Righteous Among the Nations.","works","nj7xv4p","r"],["Richard Russo, \"Just Drive\" (1992)","works"],["\"Just Drive\": Robert finds an armed woman in his borrowed Mazda RX7: \"Just drive.\" He speeds toward a washed-out bridge.","works","n1fffunz","s"],["\"Just Drive\": The open road becomes a trap, travel by violent necessity.","works","n1fffunz","y"],["\"Just Drive\": Full title \"Just Drive, She Said\", by Richard Paul Russo, published in Asimov's Science Fiction. A Philip K. Dick Award author. Title plays on Robert Creeley's \"I Know a Man\".","works","n1fffunz","r"],["Rita Dove, \"Vacation\" (1994)","works"],["\"Vacation\": A passenger enjoys the hour before takeoff, detached from past and future, watching baggage handlers.","works","n1vytama","s"],["\"Vacation\": Air travel turns the dangerous unknown into a routine waiting room.","works","n1vytama","y"],["\"Vacation\": Later in On the Bus with Rosa Parks. Heavy enjambment. Dove was the youngest and first African American Poet Laureate.","works","n1vytama","r"],["Nat Cole, \"Get Your Kicks on Route 66\" (1946)","works"],["\"Get Your Kicks on Route 66\": A cheerful map of towns from Chicago to LA.","works","n9m77xp","s"],["\"Get Your Kicks on Route 66\": It heavily over-idealizes the road as pure choice and freedom.","works","n9m77xp","y"],["\"Get Your Kicks on Route 66\": Written by Bobby Troup, whose wife Cynthia suggested the title. For Black drivers the route was dangerous, with sundown towns and the Green Book. Winona was added for the rhyme.","works","n9m77xp","r"],["Edward Hopper, Western Motel (1957)","works"],["Western Motel: A woman sits stiffly in a clean motel room with packed luggage, a green car and bare hills behind the window.","works","n6cjcu0","s"],["Western Motel: A sobering critique: mobility can bring alienation.","works","n6cjcu0","y"],["Western Motel: Oil on canvas, Yale. A year after the 1956 Highway Act. Model: his wife Jo Nivison.","works","n6cjcu0","r"],["Edward Ruscha, Standard Station (1966)","works"],["Standard Station: A gas station cuts diagonally across the frame, with the \"STANDARD\" sign and a sunset.","works","n1ucsu5m","s"],["Standard Station: America tamed the unknown road by branding it.","works","n1ucsu5m","y"],["Standard Station: Screenprint. \"Standard\" also means uniform. Ruscha made the book Twentysix Gasoline Stations (1963) and worked in advertising.","works","n1ucsu5m","r"],["Willie Nelson, \"On the Road Again\" (1980)","works"],["\"On the Road Again\": Willie Nelson can't wait to go back on tour with friends.","works","n19qedd7","s"],["\"On the Road Again\": The road is his true home, a joyful idealization.","works","n19qedd7","y"],["\"On the Road Again\": For the film Honeysuckle Rose, supposedly written on a barf bag. Train-beat rhythm. Grammy winner. Outlaw Country.","works","n19qedd7","r"],["David Hockney, Pearblossom Highway (1985)","works"],["Pearblossom Highway: A California desert crossroads with a \"Stop Ahead\" marking, signs, Joshua trees and beer cans.","works","nre6nhr","s"],["Pearblossom Highway: Travel is a fragmented series of glances stitched together by the mind.","works","nre6nhr","y"],["Pearblossom Highway: A \"joiner\" of over 700 photographs, at the Getty. Cubist-style. Right side shows a driver's view, left a passenger's.","works","nre6nhr","r"],["Tom Cochrane, \"Life is a Highway\" (1991)","works"],["\"Life is a Highway\": The road as a metaphor for life, an upbeat anthem to keep moving.","works","n1vjgdrr","s"],["\"Life is a Highway\": It strongly rejects Bilbo: the road is a playground.","works","n1vjgdrr","y"],["\"Life is a Highway\": Cochrane is Canadian, and it reached #1 in Canada. Rascal Flatts covered it for Cars in 2006.","works","n1vjgdrr","r"],["Bic Runga, \"Drive\" (1996)","works"],["\"Drive\": A quiet invitation to leave everything behind and focus on the person beside you.","works","n1xldnl3","s"],["\"Drive\": The car is a private bubble rather than a public stage.","works","n1xldnl3","y"],["\"Drive\": Runga's first solo single, from New Zealand. Used in American Pie (1999).","works","n1xldnl3","r"],["Norah Jones, \"Come Away with Me\" (2002)","works"],["\"Come Away with Me\": Soft piano and voice invite someone to escape to a mountaintop.","works","n3xda3v","s"],["\"Come Away with Me\": It over-idealizes the road as a safe, romantic sanctuary.","works","n3xda3v","y"],["\"Come Away with Me\": Title track of a debut that won eight Grammys. Daughter of Ravi Shankar.","wor
