const WORKS0=[{"w":"Surely the World is Growing Better","sec":"Progress, Not Regress","kind":"Art","s":"Satirical cartoon of a battle fought at once in the air, on the sea's surface and underwater, with planes, zeppelins, battleships, submarines and divers.","t":"Technological progress, warfare, irony","y":"It questions whether new technology brings moral progress. The title is ironic, because better tools just scale up our violence.","r":"Ink and watercolor, published in Puck magazine in 1909. Its \"multi-domain warfare\" joke came true in WWI, five years later.","m":"Will Crawford","d":"1909","x":"n9qsumr"},{"w":"The Four Horsemen of the Apocalypse","sec":"The End is Nearish","kind":"Art","s":"Four riders from the Book of Revelation trample humanity. A king and a bishop are among the victims, and a Hellmouth swallows a crowned ruler.","t":"Apocalypse, mortality, reckoning","y":"Made two years before 1500, when Europe feared the half-millennium would bring the literal end of the world.","r":"Woodcut, 15-page book The Apocalypse. Dürer self-published it, and his \"AD\" monogram sits at bottom center.","m":"Albrecht Dürer","d":"1498","x":"n1kub2ee"},{"w":"The Mystical Nativity","sec":"The End is Nearish","kind":"Art","s":"A Nativity with twelve dancing angels above, and angels embracing men below while demons flee into cracks in the earth.","t":"Millenarian panic, prophecy","y":"Painted while Florentines, stirred by the monk Savonarola, believed the end was near.","r":"Oil on canvas. His only surviving signed and dated painting. He used medieval \"hierarchical scale\", and a Greek inscription mentions the \"troubles of Italy\".","m":"Sandro Botticelli","d":"1500","x":"ngyvuau"},{"w":"The Last Judgment","sec":"The End is Nearish","kind":"Art","s":"The Second Coming on the Sistine Chapel altar wall. A beardless Christ casts judgment, the saved rise on the left and the damned fall on the right.","t":"Reckoning, controversy, terribilità","y":"Painted after the 1527 Sack of Rome, when the apocalypse felt like a near reality rather than a distant prophecy.","r":"Fresco. St. Bartholomew's flayed skin hides a self-portrait. Biagio da Cesena appears in hell as Minos. Volterra, \"Il Braghettone\", later painted loincloths over exposed genitals.","m":"Michelangelo","d":"1536–1541","x":"n1v3p86"},{"w":"The Triumph of Death","sec":"The End is Nearish","kind":"Art","s":"An army of skeletons slaughters the living in a burning wasteland. A king dies in the bottom left, and young lovers play music unaware in the bottom right.","t":"Macabre, Death as the great equalizer","y":"For plague-hit, war-torn 16th-century Europe, the end felt near every day.","r":"Oil on panel, Prado. Draws on the Danse Macabre. There are no angels or heaven, so the vision is secular. Skeletons use coffin lids as shields.","m":"Pieter Bruegel the Elder","d":"c. 1562","x":"n1n7k5hk"},{"w":"The Course of Empire: Destruction","sec":"The End is Nearish","kind":"Art","s":"A classical city is sacked by invaders. Palaces burn, a bridge collapses, and a headless warrior statue lunges in the foreground.","t":"Hubris, the downfall of empire","y":"A civilizational warning to Jacksonian America that arrogant empires destroy themselves.","r":"Oil on canvas, fourth of five paintings. Cole founded the Hudson River School. The same mountain peak appears in all five, because nature outlasts empires.","m":"Thomas Cole","d":"1836","x":"nyy64mc"},{"w":"The Great Day of His Wrath","sec":"The End is Nearish","kind":"Art","s":"The opening of the Sixth Seal. Mountains fold inward, a city tumbles into an abyss, and tiny humans look like insects.","t":"The Sublime, cataclysm, industrial anxiety","y":"It shows the exact second \"nearish\" becomes now.","r":"Oil on canvas, Tate Britain, part of a Last Judgement triptych. Inspired by the polluted Black Country at night. Critics coined \"Martinesque\". The paintings toured like a 19th-century blockbuster.","m":"John Martin","d":"1851–1853","x":"n6mbw2w"},{"w":"World War I prints","sec":"The End is Nearish","kind":"Art","s":"Der Krieg, 50 black-and-white prints of trench warfare: corpses in barbed wire, shell shock, shrapnel wounds and gas masks.","t":"Trauma, dehumanization, New Objectivity","y":"For soldiers the end was no prophecy but daily reality, a man-made hell.","r":"Etching and aquatint, so acid bites the lines. Modeled on Goya's Disasters of War. Dix was a machine-gunner, called the prints a psychological purge, and was labeled \"degenerate\" by the Nazis.","m":"Otto Dix","d":"1924","x":"nfdopnq"},{"w":"Apocalypse '42","sec":"The End is Nearish","kind":"Art","s":"A cartoonish ceramic of Hitler, Mussolini, Hirohito and skeletal Death riding one black horse.","t":"Propaganda, caricature, satire","y":"It says the apocalypse is happening now, driven by the Axis leaders, and mocks them to cut them down to size.","r":"Glazed ceramic, a parody of Dürer. Cheerful pottery makes the horror jarring. Mussolini holds the fasces. Schreckengost was also a major industrial designer.","m":"Viktor Schreckengost","d":"1942","x":"nr37vr9"},{"w":"Four Horsemen of the Apocalypse","sec":"The End is Nearish","kind":"Art","s":"The Horsemen, with Death holding a scythe, charge through clouds above a modern battlefield of tanks and rifles.","t":"Atomic Age, reckoning","y":"After the Holocaust and atomic bombs, humanity had proven it could end the world itself.","r":"Lithograph, 1946. It blends ancient symbols with modern war: our tools changed, human nature didn't. Compare it with Dürer and Schreckengost. Freund also painted Depression-era public murals.","m":"Harry Louis Freund","d":"1946","x":"nlbce5b"},{"w":"The Last of Us: Season 1 Concept Art","sec":"The End is Nearish","kind":"Art","s":"Digital paintings of cities like Boston two decades after a Cordyceps fungus outbreak, overrun by lush plants.","t":"Beautiful decay, reclamation, pandemic","y":"Here the end already happened, and it is a slow, quiet decay, not an explosion.","r":"For HBO's 2023 series, arriving just after COVID-19 lockdowns. Menyhei works at ILM. Artists studied Chernobyl. The Earth heals without us.","m":"Saby Menyhei","d":"2025","x":"nz0nsim"},{"w":"\"Where Are We Going?\"","sec":"The End is Nearish","kind":"Music","s":"Hidden Call of Duty song from \"Mob of the Dead\", about four dead 1930s mobsters forced to fight zombies in a hellish Alcatraz.","t":"Purgatory, the endless loop","y":"The characters keep approaching an end that never comes, so suffering is prolonged forever.","r":"Vocals by Malukah. A slow crescendo with ghostly reverb. An Easter egg unlocked with the codes 115 and 935.","m":"Kevin Sherwood & James McCawley","d":"2013","x":"n1pnba39"},{"w":"Quartet for the End of Time: \"Abyss of the Birds\"","sec":"The End is Nearish","kind":"Music","s":"Movement III, a solo for clarinet. Very slow held notes are broken by frantic imitations of birdsong.","t":"Time and eternity","y":"Written in a WWII prison camp. For Messiaen the end was hopeful, a moment when painful time stops.","r":"Stalag VIII-A, premiered in January 1941 to about 400 prisoners and guards. \"Abyss\" is time and despair, \"Birds\" are joy and eternity. Messiaen had synesthesia.","m":"Olivier Messiaen","d":"1940","x":"n1gbkil2"},{"w":"\"Electric Funeral\"","sec":"The End is Nearish","kind":"Music","s":"A nuclear wasteland after the bomb, with buildings falling and rivers turned to wood.","t":"Cold War, nuclear apocalypse, doom","y":"The end comes from human technology rather than divine judgment.","r":"On the album Paranoid. Iommi's sludgy distorted riff breaks into a fast section for the blast. Lyrics by Geezer Butler.","m":"Black Sabbath","d":"1970","x":"n1d6mf4f"},{"w":"\"It's the End of the World as We Know It\"","sec":"The End is Nearish","kind":"Music","s":"A breathless, stream-of-consciousness list of disasters and celebrities, followed by \"And I feel fine\".","t":"Information overload, acceptance","y":"It treats the apocalypse as exhausting media bombardment, answered with joyful acceptance.","r":"On the album Document, at the dawn of 24-hour cable news. The \"L.B.\" names came from a dream. It surges back on the charts in every crisis.","m":"REM","d":"1987","x":"nqksvk6"},{"w":"Mona Lisa (Louvre) & Mona Lisa (Isleworth)","sec":"There's a Draft in Here","kind":"Art","s":"Lisa Gherardini in a relaxed three-quarter pose. The Isleworth version shows a younger sitter, with full columns and a simpler landscape.","t":"Sfumato, authenticity, revision","y":"The Isleworth version may be an earlier draft of the world's most famous painting.","r":"Louvre: oil on poplar, sfumato, stolen in 1911 by a handyman. Isleworth: oil on canvas, which is why many reject it. Leonardo kept revising the Louvre version until he died.","m":"Leonardo da Vinci","d":"c. 16th century","x":"nmcmlgf"},{"w":"Bedroom in Arles (three versions)","sec":"There's a Draft in Here","kind":"Art","s":"Van Gogh's simple bedroom in the Yellow House, with paired chairs, pillows and portraits, and a bright yellow bed.","t":"Repetition, mental health, color","y":"He painted the same room three times to recapture its emotional safety.","r":"October 1888, then two in September 1889 from the asylum. The pairs show his loneliness. The walls were violet, but the red pigment faded, leaving them blue. Flattened like Japanese prints.","m":"Vincent van Gogh","d":"1888–1889","x":"n1p48v"},{"w":"Despair & The Scream","sec":"There's a Draft in Here","kind":"Art","s":"The same bridge over the Oslofjord at sunset. A man in a hat leans on the rail in Despair, and a skeletal figure clutches its face in The Scream.","t":"Existential dread, Expressionism","y":"Despair is the literal rough draft of The Scream.","r":"The figure isn't screaming. It covers its ears against a scream passing through nature. Krakatoa (1883) may explain the red skies. Versions of The Scream were stolen in 1994 and 2004.","m":"Edvard Munch","d":"1892 & 1893","x":"n1vk0miv"},{"w":"Dance (I) & Dance (II)","sec":"There's a Draft in Here","kind":"Art","s":"Five nude figures dance in a circle on a green hill under a blue sky.","t":"Fauvism, color, joy","y":"Dance (I) is a full-scale working draft for the final commission.","r":"For Sergei Shchukin's Moscow mansion. Dance (I) has pale pink figures, Dance (II) fiery red ones. Matisse led the Fauves, and critics called it barbaric. The motif comes from The Joy of Life (1906).","m":"Henri Matisse","d":"1909 & 1910","x":"n18oikmc"},{"w":"\"Strawberry Fields Forever (Home Demo Sequence)\"","sec":"There's a Draft in Here","kind":"Music","s":"Lennon alone on guitar, stumbling through chords and lyrics about a children's home near where he grew up.","t":"Creative process, alienation, nostalgia","y":"We can hear a masterpiece being drafted in real time.","r":"Written in Spain after the Beatles quit touring. The final version splices two takes, with George Martin matching their keys and tempos, and has a Mellotron intro.","m":"The Beatles","d":"1966","x":"ntlrjgq"},{"w":"\"This One's Mine\"","sec":"There's a Draft in Here","kind":"Music","s":"First draft of \"Helpless\" from Hamilton, with Eliza fiercely claiming Hamilton. A simple R&B demo sung by Miranda.","t":"Feedback, first drafts","y":"It shows how honest feedback improves a draft.","r":"His wife Vanessa Nadal said it didn't feel like his final draft. Released in \"Hamildemos\" in 2018. The phrase survives in \"Helpless\".","m":"Lin-Manuel Miranda","d":"2018","x":"n3fe7ea"},{"w":"\"Dead Mom (Demo)\"","sec":"There's a Draft in Here","kind":"Music","s":"Lydia Deetz from Beetlejuice angrily begs her dead mother for a sign, over a rock band.","t":"Public draft, grief","y":"A \"public draft\" that shows the song as raw pop-punk before its Broadway orchestration.","r":"Written by Eddie Perfect, and Caruso was 17. Released as a promo. TikTok teens helped save the show.","m":"Sophia Anne Caruso","d":"2019","x":"n1jfmxwi"},{"w":"\"Golden\" (various demos)","sec":"There's a Draft in Here","kind":"Music","s":"EJAE's raw demos of Rumi's \"I want\" song from K-Pop: Demon Hunters, about releasing perfection.","t":"Perfectionism, identity, work in progress","y":"The film needed nearly 60 demos for some sequences, so it's a masterclass in drafting.","r":"EJAE was an SM trainee for 10 years. Her guide vocals got her cast as Rumi's singing voice. It was the first K-pop song to win the Best Original Song Oscar.","m":"EJAE","d":"2025","x":"n31yslw"},{"w":"\"Count on Me\"","sec":"There's a Draft in Here","kind":"Music","s":"Aladdin promises his monkey Abu riches and adventure, in a bouncy piano showtune.","t":"Cut song, replacement draft","y":"A rejected draft written to replace \"Proud of Your Boy\" when Aladdin's mother was cut.","r":"Alan Menken sings and wrote the lyrics himself after Howard Ashman died in 1991. Its rejection led to \"A Whole New World\".","m":"Aladdin (cut song)","d":"1994","x":"nkvdgzl"},{"w":"\"First to Dance\"","sec":"There's a Draft in Here","kind":"Music","s":"Grandmother Willow teaches Pocahontas and John Smith how to stop a war. Dancing stands for peace.","t":"Cut song, metaphor","y":"A discarded draft cut because it disrupted the pacing.","r":"Menken and Stephen Schwartz. Menken sings all three parts. Released in 2015, after 20 years in the vault. The idea \"someone has to break the pattern\" survives in the climax.","m":"Pocahontas (cut song)","d":"1995","x":"n1udk9hj"},{"w":"\"Family Home Evening\"","sec":"There's a Draft in Here","kind":"Music","s":"From The Book of Mormon workshops: a peppy satire of a \"perfect\" Mormon family's Monday night, like a 1950s sitcom theme.","t":"Satire, narrative pacing","y":"A \"sacrificed draft\": a hit with test audiences, but it didn't advance the plot.","r":"Parker, Stone and Lopez sing it. Parker once dated a Mormon girl. The idea became the opening number \"Hello!\".","m":"Book of Mormon (cut song)","d":"2009","x":"n1wvwxoq"},{"w":"\"In the Bedroom Down the Hall\"","sec":"There's a Draft in Here","kind":"Music","s":"From Dear Evan Hansen: a duet of two mothers remembering their sons as little boys. \"I gave all I could... and I thought it was enough.\"","t":"Motherhood, theatrical pacing","y":"A beautiful song cut because the show could not hold too many slow ballads.","r":"Pasek and Paul, sung by Rachel Bay Jones and Jennifer Laura Thompson. The cut made room for \"So Big / So Small\".","m":"Dear Evan Hansen (cut song)","d":"2017","x":"nnfvtm3"},{"w":"Rain, Steam, and Speed","sec":"The Lovely and the Liminal","kind":"Art","s":"A steam train crosses Maidenhead Railway Bridge in a rainstorm. A small boat and a ploughing farmer represent the past.","t":"Industrialization, nature vs. machine","y":"Society sits on the threshold between agrarian past and industrial future, and paint hovers between realism and abstraction.","r":"Oil on canvas, National Gallery, London. A tiny hare races the train. A legend says Turner stuck his head out of a train window in a downpour.","m":"J.M.W. Turner","d":"1844","x":"nqhyvrx"},{"w":"The Railway Station","sec":"The Lovely and the Liminal","kind":"Art","s":"A crowded panorama of London's Paddington Station, with a bride, crying mothers and a criminal being arrested.","t":"Victorian modernity, social class","y":"A station is a threshold where every class shares one fleeting moment.","r":"Oil on canvas. Two real Scotland Yard detectives modeled. Huge paying crowds came to see it. The family on the left is Frith's own.","m":"William Powell Frith","d":"1862","x":"n10ysydt"},{"w":"Picture of the Railroad at Takanawa","sec":"The Lovely and the Liminal","kind":"Art","s":"Japan's first railway, on an embankment through Tokyo Bay, passing wooden sailboats.","t":"Meiji Restoration, cultural threshold","y":"Japan stands between the feudal Edo period and the Meiji era, and tracks run between land and sea.","r":"Woodblock triptych. \"Speculative journalism\": printed in 1871, before the line opened in 1872. The train cars look like Japanese buildings.","m":"Tsukioka Yoshitoshi","d":"1871","x":"n4ex2sq"},{"w":"Gare Saint-Lazare","sec":"The Lovely and the Liminal","kind":"Art","s":"A locomotive enters a Paris station in clouds of steam under an iron and glass canopy.","t":"Impressionism, the ephemeral","y":"A station is a hub of constant transition, caught in fleeting light and smoke.","r":"Oil on canvas, Musée d'Orsay, one of 12. Monet got the station master to halt trains and pack engines with coal for smoke.","m":"Claude Monet","d":"1877","x":"n1u0r5dj"},{"w":"Train Station, Agra, 1983","sec":"The Lovely and the Liminal","kind":"Art","s":"Men work on a dark steam locomotive at Agra station, with the Taj Mahal in the mist behind.","t":"Contrast, transition","y":"Two worlds collide: India's majestic past and its industrial present.","r":"Color photograph at golden hour, from a five-month train trip. McCurry later shot Afghan Girl. The tracks are gone now, so it can't be recreated.","m":"Steve McCurry","d":"1983","x":"n19z51k7"},{"w":"Six in Four","sec":"The Lovely and the Liminal","kind":"Art","s":"The four passenger elevators of the Whitney Museum, designed around six domestic motifs: door, window, table, basket, mirror and rug.","t":"Installation, mundane spaces","y":"Elevators are the ultimate modern liminal space, and he turns \"dead time\" into the museum's first art experience.","r":"Artschwager's final major work, made with Otis. The only permanent art commission for the new Whitney building.","m":"Richard Artschwager","d":"2015","x":"n1sh6lxc"},{"w":"Where Do We Come From? What Are We? Where Are We Going?","sec":"The Lovely and the Liminal","kind":"Art","s":"Read right to left: a baby, young adults at daily life, and an old woman near death, watched by a blue idol.","t":"Existentialism, cycle of life","y":"It explores life's great liminal crossings of birth, life and death.","r":"Oil on canvas, Tahiti. Synthetist style. He claimed a suicide attempt after finishing it. The French title on the canvas has no question marks.","m":"Paul Gauguin","d":"1897–98","x":"n1onk01p"},{"w":"The Treachery of Images","sec":"The Lovely and the Liminal","kind":"Art","s":"A realistic pipe above the words \"Ceci n'est pas une pipe\" (This is not a pipe).","t":"Surrealism, semiotics, paradox","y":"It explores the boundary between an object and the images and words that represent it.","r":"Oil on canvas, LACMA. Painted like an advertisement. Magritte's reply: \"Just try to fill it with tobacco!\"","m":"Rene Magritte","d":"1929","x":"n1d0hyi0"},{"w":"The Persistence of Memory","sec":"The Lovely and the Liminal","kind":"Art","s":"Melting watches on a barren landscape, with a dead olive tree, ants on a gold watch and a strange sleeping creature.","t":"Surrealism, the subconscious, time","y":"A psychological threshold between the waking world and dreams.","r":"Oil on canvas, MoMA, only 9.5 x 13 inches. Inspired by melting Camembert, not Einstein. The creature is a distorted self-portrait. Port Lligat landscape.","m":"Salvador Dali","d":"1931","x":"ngd14lp"},{"w":"Christina's World","sec":"The Lovely and the Liminal","kind":"Art","s":"A woman in a pink dress lies in a dry field, looking up at a distant gray farmhouse.","t":"Isolation, resilience, Magic Realism","y":"She is suspended between where she is and where she wants to be.","r":"Egg tempera, MoMA. Anna Christina Olson refused a wheelchair and crawled. Wyeth's 26-year-old wife modeled the torso and head, but the arms and hands are Christina's.","m":"Andrew Wyeth","d":"1948","x":"nz6qs18"},{"w":"Ascending and Descending","sec":"The Lovely and the Liminal","kind":"Art","s":"Hooded figures circle a square staircase forever, some always climbing and others always descending.","t":"Paradox, infinity, futility","y":"An endless liminal space where the figures move but never arrive.","r":"Lithograph based on the Penrose stairs. Two \"recalcitrant\" figures sit out the rat race. Nolan used the paradox in Inception.","m":"M. C. Escher","d":"1960","x":"n4ud1nk"},{"w":"Beneath the Roses","sec":"The Lovely and the Liminal","kind":"Art","s":"Staged, film-like photographs of isolated, motionless people in rundown American small towns.","t":"Alienation, suburbia, twilight","y":"Liminal on three levels: twilight in time, suburbs in space, frozen states of mind.","r":"49 photographs, Massachusetts Rust Belt towns, made with a crew of about 60. Crewdson doesn't press the shutter. An influence on Stranger Things.","m":"Gregory Crewdson","d":"2004","x":"nxagoyj"},{"w":"The Distant is Imminent","sec":"The Lovely and the Liminal","kind":"Art","s":"Video of melting polar icebergs projected onto coastal city buildings, with a waterline showing sea level by 2050.","t":"Climate change, projection art","y":"It collapses the boundary between distant poles and local streets, and between a dry present and a flooded future.","r":"Launched October 10, 2020, for TED's Countdown. Open-source: anyone could project it. Seaman is of Shinnecock and African American descent, and treats icebergs as portraits.","m":"Camille Seaman","d":"2020","x":"n8eea20"},{"w":"\"Drip, Drip, Drip\"","sec":"The Lovely and the Liminal","kind":"Music","s":"A coal train passes through a tunnel while water drips on its metal roof.","t":"Onomatopoeia, journey","y":"A tunnel is a dark passage between A and B.","r":"Yilan folk song, also Diu Diu Dang Ah. \"Diu diu\" mimics both engine and drips. Tied to the Old Caoling Tunnel, now a bike path. Pentatonic scale.","m":"Yilan Folk Song","d":"c. 1924","x":"n1x0xk4"},{"w":"Waiting for Godot, Scene 2","sec":"The Lovely and the Liminal","kind":"Literature","s":"Vladimir and Estragon wait again on a country road for Godot, who never comes. The tree has sprouted a few leaves.","t":"Theater of the Absurd, stasis","y":"The ultimate story of being stuck: they can't move on and can't leave.","r":"The play ends each act with \"Yes, let's go.\" (They do not move.) Beckett: \"If I knew, I would have said so in the play.\" San Quentin inmates understood it.","m":"Samuel Beckett","d":"1953","x":"na194do"},{"w":"\"Keeping Still\"","sec":"The Lovely and the Liminal","kind":"Literature","s":"Neruda asks everyone to count to twelve and stop moving and speaking for a moment.","t":"Stillness, global pause","y":"A plea to create a liminal space on purpose.","r":"Also \"Keeping Quiet\", from Estravagario. Free verse, with twelve standing for clock hours or months. He wrote in green ink. Stillness is not \"total inactivity\".","m":"Pablo Neruda","d":"1958","x":"ngtxae6"},{"w":"I'll Wait for the Next One...","sec":"The Lovely and the Liminal","kind":"Film","s":"A man on a metro train announces he's lonely and invites any woman to step off with him. One does, and learns it was a begging routine.","t":"Urban loneliness, cruel twist","y":"On a train strangers are forced together and normal social rules are suspended. She is left stranded in limbo.","r":"French short film, about 4 minutes, Oscar-nominated. Actor Thomas Gaudin co-wrote it. The title's double meaning is the punchline.","m":"Philippe Orreindy","d":"2002","x":"n13x72xt"},{"w":"\"The Man Who Could Walk through Walls\"","sec":"The Lovely and the Liminal","kind":"Literature","s":"Dutilleul, a dull clerk, uses his power for revenge, robbery and an affair, then gets stuck inside a wall.","t":"Rebellion, entrapment, Magical Realism","y":"A literal answer to what happens if you get stuck in a liminal space.","r":"Published under Nazi-occupied Paris, as an escape fantasy. A forgotten pill cures his power. A Jean Marais statue stands in Montmartre.","m":"Marcel Ayme","d":"1941","x":"n11tosxq"},{"w":"A Gentleman in Moscow (Excerpt)","sec":"The Lovely and the Liminal","kind":"Literature","s":"In 1922 Count Rostov is sentenced to indefinite house arrest in the Metropol Hotel.","t":"Confinement, resilience","y":"A hotel is built for temporary stays, and he must build a whole life in it.","r":"\"If a man does not master his circumstances, he is bound to be mastered by them.\" Idea came from a Geneva hotel. Published 2016.","m":"Amor Towles","d":"2019","x":"n1e5weoo"},{"w":"Ambient 1: Music for Airports","sec":"The Lovely and the Liminal","kind":"Music","s":"Slow, drifting piano and wordless voices with no beat or set structure.","t":"Ambient music, passive listening","y":"Music made to calm airports, it asks whether sound should enhance a room rather than demand attention.","r":"Conceived at Cologne Bonn Airport. \"As ignorable as it is interesting.\" Uneven tape loops drift in and out of sync. Played at LaGuardia in 1980.","m":"Brian Eno","d":"1979","x":"n1cv5ic2"},{"w":"Music for Nine Postcards","sec":"The Lovely and the Liminal","kind":"Music","s":"Sparse Fender Rhodes and synth notes, each track like a view from a window.","t":"Kankyō ongaku, environmental music","y":"A Japanese counterpart to Eno, made for a calm museum instead of a stressful airport.","r":"Composed for the Hara Museum, Tokyo. Silence counts as much as notes. The YouTube algorithm revived it during the pandemic.","m":"Hiroshi Yoshimura","d":"1982","x":"n9cedoi"},{"w":"Sleep","sec":"The Lovely and the Liminal","kind":"Music","s":"An 8.5-hour piece of very slow music, meant to be slept through.","t":"Durational music, rest as rebellion","y":"Sleep is the human liminal space, and it takes Eno's passive listening to the extreme.","r":"Piano, strings, electronics and Grace Davidson's voice. About 40 BPM. Richter consulted neuroscientist David Eagleman. Audiences get beds.","m":"Max Richter","d":"2015","x":"ns8bj44"},{"w":"\"We Real Cool\"","sec":"Going Pains","kind":"Literature","s":"Seven young men at a pool hall list what they do, ending with \"Die soon.\"","t":"Youth rebellion, identity","y":"They wear a tough mask of adulthood, and this rushed maturity leads to a dead end.","r":"24 words. Enjambment ends lines on \"We\", read softly. The hall is The Golden Shovel, which suggests digging a grave, and it inspired the Golden Shovel form. Brooks was the first African American Pulitzer winner.","m":"Gwendolyn Brooks","d":"1963","x":"nt71y6k"},{"w":"\"The Medicine Bag\"","sec":"Going Pains","kind":"Literature","s":"Martin is embarrassed when his frail Lakota grandfather, Joe Iron Shell, visits, then accepts the sacred medicine bag.","t":"Heritage, coming of age","y":"A real rite of passage. Adulthood here means taking off the mask of cool.","r":"First in Boys' Life magazine. The bag holds iron from a settler's kettle, a symbol of adaptation. Sneve won the National Humanities Medal in 2000.","m":"Virginia Driving Hawk Sneve","d":"1975","x":"n7bnuj6"},{"w":"\"In Mrs. Tilscher's Class\"","sec":"Going Pains","kind":"Literature","s":"A school year runs from cozy autumn to restless summer, as children start learning about growing up.","t":"Loss of innocence, puberty","y":"The messy middle between childhood and adulthood, an unavoidable change.","r":"Tadpoles \"changed from commas into exclamation marks.\" The final thunderstorm stands for puberty. Duffy was the first female Poet Laureate of the UK.","m":"Carol Ann Duffy","d":"1990","x":"nxsdo96"},{"w":"\"Where Do We Go From Here?\"","sec":"Going Pains","kind":"Music","s":"Buffy's cast, freed from a singing spell, ask what comes after the battle.","t":"Early adulthood, existential dread","y":"Their masks are gone and there is no script for what's next.","r":"From \"Once More, with Feeling\" (Season 6). The song cuts off mid-measure. Whedon wrote the score though he couldn't read music.","m":"Joss Whedon","d":"2001","x":"n9uqko4"},{"w":"\"Lucy's Home for Girls Raised by Wolves\"","sec":"Going Pains","kind":"Literature","s":"Nuns civilize werewolf-born girls. Claudette watches her sisters Jeanette, who conforms, and Mirabella, who refuses.","t":"Forced assimilation, Magical Realism","y":"Becoming \"human\" here is a painful mask that has to be learned.","r":"Full title: \"St. Lucy's Home...\". An allegory of Indigenous boarding schools. Narration moves from \"we\" to \"I\". Ends with her first human lie: \"I'm home.\"","m":"Karen Russell","d":"2006","x":"n17wqxv0"},{"w":"\"Lost Boy\"","sec":"Going Pains","kind":"Music","s":"The narrator escapes loneliness by joining Peter Pan in Neverland.","t":"Escapism, found family","y":"She refuses adulthood and wears the mask of a Lost Boy forever.","r":"Began as a 6-second Vine in 2014. Solo voice and piano in 6/8 time. Ruth B is from Edmonton.","m":"Ruth B","d":"2015","x":"n1n1m9cr"},{"w":"\"Let Me Begin Again\"","sec":"Going Pains","kind":"Literature","s":"An adult speaker pleads to be reborn as something small, like a thought or a bird's fresh senses.","t":"Rebirth, vulnerability","y":"Adulthood may be a continuing cycle of starting over.","r":"Repeats \"Let me...\", a secular prayer. Major Jackson hosts The Slowdown. Influenced by Camus's Absurd Man.","m":"Major Jackson","d":"2021","x":"n1e93qyh"},{"w":"\"A stone I died\"","sec":"Going Pains","kind":"Literature","s":"The soul dies as mineral, plant, animal and human, each time rising to something higher, then to angel.","t":"Sufism, spiritual evolution","y":"Death is a temporary layover, and each \"death\" is a promotion.","r":"Also \"I died as a mineral\". Repeating \"I died\" turns death into growth. Rumi's grief over Shams of Tabriz fueled his poetry. Whirling Dervishes are the Mevlevi Order.","m":"Rumi","d":"c. 13th century","x":"n1re1s6k"},{"w":"\"Death Be not Proud\"","sec":"Going Pains","kind":"Literature","s":"The speaker mocks Death as a slave to fate, kings and sickness: \"Death, thou shalt die.\"","t":"Paradox, defiance","y":"Death is \"one short sleep\", a brief doorway to eternal life.","r":"Holy Sonnet X, written about 1609. Donne became Dean of St Paul's and modeled in his shroud for his monument.","m":"John Donne","d":"1633","x":"ncroztl"},{"w":"\"Ulysses\"","sec":"Going Pains","kind":"Literature","s":"Aged Ulysses, bored as king of Ithaca, gives the crown to Telemachus and rallies his crew for one last voyage.","t":"Aging, defiance, exploration","y":"He refuses home as the final port and sails toward death on his own terms.","r":"Dramatic monologue in blank verse. \"To strive, to seek, to find, and not to yield.\" Written after Arthur Hallam's death. M recites it in Skyfall.","m":"Alfred Lord Tennyson","d":"1842","x":"nlo9qbh"},{"w":"\"Because I could not stop for Death\"","sec":"Going Pains","kind":"Literature","s":"Death, a polite gentleman, drives the speaker past children, grain and the sunset to a \"House\" (her grave).","t":"Mortality, immortality","y":"Death is a calm carriage ride, and the grave a temporary stop before Eternity.","r":"Poem 479, in common meter like hymns. Written about 1863. Lavinia found nearly 1,800 poems in a chest. Her original text returned in 1955.","m":"Emily Dickinson","d":"1890","x":"n1uw2x1b"},{"w":"\"Gitanjali 95\"","sec":"Going Pains","kind":"Literature","s":"Birth and death compared: a baby cries when taken from the right breast and finds comfort at the left.","t":"Mysticism, rebirth","y":"Death is the same as birth, with the universe as a mother on both sides.","r":"Prose poem. Yeats wrote the introduction. Tagore was the first non-European Nobel Literature winner (1913). He returned his knighthood in 1919 after Amritsar.","m":"Rabindranath Tagore","d":"1913","x":"ng4fcrg"},{"w":"15th Symphony: Fourth Movement","sec":"Going Pains","kind":"Music","s":"A slow repeating bass line and quoted melodies end in dry percussion clicks fading to silence.","t":"Mortality, musical quotation","y":"Death as a cold, mechanical fading away, like a hospital machine.","r":"Passacaglia. Quotes Wagner's Fate motif and the Tristan chord. Written in hospital, and his last symphony. The first movement quotes William Tell.","m":"Dmitri Shostakovich","d":"1972","x":"n1gna2vz"},{"w":"\"Please Call Me by My True Names\"","sec":"Going Pains","kind":"Literature","s":"The speaker says he is both victim and attacker: maybug and bird, a refugee girl and the sea pirate.","t":"Interbeing, compassion","y":"There is no final port, only continuous transformation, so fear disappears.","r":"Written in exile about the Boat People. Anaphora on \"I am\". He coined \"Interbeing\". MLK nominated him for the Nobel Peace Prize in 1967. Founded Plum Village.","m":"Thich Nhat Hanh","d":"1976","x":"ngyqyhu"},{"w":"\"A Letter from Isaac Asimov to his Wife Janet, Written on His Deathbed\"","sec":"Going Pains","kind":"Literature","s":"The science fiction giant's imagined last letter turns from cosmic ideas to small, intimate details.","t":"Intimacy, mundane vs. cosmic","y":"Death is a quiet, human layover rather than a journey across the universe.","r":"From Actual Air. Berman also led the band Silver Jews. Asimov died in 1992, from HIV contracted through a transfusion.","m":"David Berman","d":"1999","x":"niirkyb"},{"w":"\"In the End\"","sec":"Going Pains","kind":"Music","s":"A narrator admits that despite all effort, \"in the end, it doesn't even matter.\"","t":"Futility, catharsis","y":"A blunt answer: effort and achievement are temporary masks that time erases.","r":"From Hybrid Theory. Shinoda's rap against Bennington's chorus, with a piano riff. Bennington first disliked it.","m":"Linkin Park","d":"2000","x":"n1erg0q"},{"w":"\"The New Colossus\"","sec":"Home and Wandering","kind":"Literature","s":"It rejects the Colossus of Rhodes for a \"Mother of Exiles\" who says \"Give me your tired, your poor\".","t":"Immigration, welcome, threshold","y":"The Statue of Liberty stands at the \"golden door\", the threshold of refuge.","r":"Petrarchan sonnet with prosopopoeia. Lazarus wrote it for a pedestal fundraiser. She died at 38, and the plaque came in 1903 thanks to Georgina Schuyler.","m":"Emma Lazarus","d":"1883","x":"n19t73bb"},{"w":"\"Prospective Immigrants Please Note\"","sec":"Home and Wandering","kind":"Literature","s":"The reader stands at a door and must choose: go through, or stay unchanged.","t":"Internal migration, double consciousness","y":"Migration here is a universal choice, with no borders named.","r":"\"The door itself makes no promises.\" Rich meant \"internal immigrants\". She refused the National Medal of Arts in 1997 and shared a 1974 prize with Lorde and Walker.","m":"Adrienne Rich","d":"1963","x":"n8qtrzi"},{"w":"\"We Are Americans Now, We Live in the Tundra\"","sec":"Home and Wandering","kind":"Literature","s":"Assimilated speakers find their new life barren compared with a warm Chinese past.","t":"Assimilation, cultural erasure","y":"The border is crossed, but they find a new liminal space instead of a home.","r":"Debut collection Dwarf Bamboo. The tundra stops roots growing, a metaphor for cultural loss. Pushes back on the \"model minority\" myth.","m":"Marilyn Chin","d":"1987","x":"ndb66m2"},{"w":"\"The Sound of One Immigrant Clapping\"","sec":"Home and Wandering","kind":"Literature","s":"Afro-Caribbean immigrants live half-seen, as in the Zen koan of one hand clapping.","t":"Invisibility, transculturation","y":"Immigrant liminality can be a permanent paradox rather than a crossing.","r":"From Wise Blood. Castro is a Cuban-Dominican poet and Babalawo. Mixes Spanish and Yoruba. Fernando Ortiz coined \"transculturation\".","m":"Adrian Castro","d":"2005","x":"n3r1y4c"},{"w":"\"Mother Country\"","sec":"Home and Wandering","kind":"Literature","s":"A son watches his exiled mother grieve for Cuba, and realizes she is his homeland.","t":"Exile, inherited nostalgia","y":"Home may be a person rather than a place.","r":"From How to Love a Country. Double meaning of \"mother country\". Blanco read at Obama's 2013 inauguration, and was born in Madrid while the family was in transit.","m":"Richard Blanco","d":"2019","x":"ngyhafe"},{"w":"The Bus","sec":"Home and Wandering","kind":"Art","s":"Mexican society on a bench: housewife, worker, Indigenous mother, boy, gringo with money bag, and modern woman.","t":"Social Realism, class, Indigenismo","y":"A bus is a moving threshold where strangers sit together and ask who belongs.","r":"Oil on canvas, in the style of retablos. Kahlo survived a 1925 bus crash. The gringo sits beside the young woman to show foreign wealth.","m":"Frida Kahlo","d":"1929","x":"nxgznjq"},{"w":"Migration","sec":"Home and Wandering","kind":"Art","s":"60 panels telling the Great Migration of African Americans from the rural South to the North.","t":"Great Migration, thresholds","y":"You need not cross a national border to be treated as an alien. Stations are recurring thresholds.","r":"Casein tempera in \"Dynamic Cubism\", applying one color at a time across all panels. Lawrence was 23. Phillips owns odd panels, MoMA even ones.","m":"Jacob Lawrence","d":"1941","x":"n1oui3hj"},{"w":"\"Immigrant Song\"","sec":"Home and Wandering","kind":"Music","s":"Viking invaders sail to new lands, singing of Valhalla and the \"hammer of the gods\".","t":"Conquest, aggression","y":"It flips the idea: this migrant is a terrifying invader, not a refugee.","r":"From Led Zeppelin III, inspired by a 1970 Iceland trip. Played as The Nobs in Denmark. Thor: Ragnarok used it.","m":"Led Zeppelin","d":"1970","x":"nggy7ps"},{"w":"\"Far From the Home I Love\"","sec":"Home and Wandering","kind":"Music","s":"From Fiddler on the Roof: Hodel tells Tevye she is leaving to join her exiled fiancé Perchik in Siberia.","t":"Exile, sacrifice","y":"A heartbreaking chosen migration, sung at a railway station.","r":"1971 film by Norman Jewison, from the 1964 musical by Bock and Harnick. Minor key. Topol played Tevye.","m":"Fiddler on the Roof","d":"1971","x":"n1b7f1nr"},{"w":"\"Illegal Alien\"","sec":"Home and Wandering","kind":"Music","s":"A cheerful pop song about a man trying to cross the US-Mexico border.","t":"Satire, stereotypes","y":"It shows the border being flattened into comedy and stereotype by Western pop.","r":"On the album Genesis. Upbeat music against grim lyrics. Collins used a mock accent, widely seen today as offensive.","m":"Genesis","d":"1983","x":"n14a69tu"},{"w":"\"Isle of Hope, Isle of Tears\"","sec":"Home and Wandering","kind":"Music","s":"The story of Annie Moore, reported as 15, the first immigrant processed at Ellis Island on January 1, 1892.","t":"Irish diaspora, threshold","y":"Ellis Island is both gateway and heartbreak.","r":"Graham also wrote \"You Raise Me Up\". Annie got a $10 gold piece. Her true grave was found in Queens in 2006, and she was really about 17.","m":"Brendan Graham","d":"1995","x":"n8m4eo4"},{"w":"Borderlands","sec":"Home and Wandering","kind":"Art","s":"Empty landscapes with fences and tires, paired with portraits of people on society's edge.","t":"Psychological borders, belonging","y":"The migrant's in-between state can be a permanent inner \"nowhere place\".","r":"Later published as And In Its Place, Another. Mixes color and black-and-white. Konowiecki was a pro soccer player.","m":"Kovi Konowiecki","d":"2016","x":"nd1mzsj"},{"w":"\"Somos Mas Americanos\"","sec":"Home and Wandering","kind":"Music","s":"A danceable Norteño song: \"I didn't cross the border, the border crossed me.\"","t":"Decolonization, Indigenous roots","y":"It rejects \"alien\" status because the border itself is an arbitrary line.","r":"A history lesson on the 1848 Treaty of Guadalupe Hidalgo. Accordion and bajo sexto. From Uniendo Fronteras (2001).","m":"Los Tigres del Norte","d":"2013","x":"nebhd17"},{"w":"\"Travelling Again\"","sec":"Where We're Going, We'll Still Need Them","kind":"Literature","s":"Du Fu passes a temple and bridge, and feels the landscape waited for him, washing his sorrow away.","t":"Necessity, nature as sanctuary","y":"For a refugee, the road is a sanctuary and home was the danger.","r":"An Lushan Rebellion, written in Chengdu. Pathetic fallacy. Known as the \"Poet-Historian\".","m":"Du Fu","d":"761 CE","x":"nwo1ecf"},{"w":"\"Sonnet 50\"","sec":"Where We're Going, We'll Still Need Them","kind":"Literature","s":"A rider travels away from his beloved. Even his horse feels the weight and groans when spurred.","t":"Grief, travel by necessity","y":"The road is a place of plodding grief, and every step forward pulls him further from love.","r":"\"Fair Youth\" sequence, paired with Sonnet 51. Iambic pentameter mimics hoofbeats. The 1609 dedication to \"Mr. W.H.\" is a mystery.","m":"William Shakespeare","d":"1609","x":"n1wrxu03"},{"w":"\"Sea Fever\"","sec":"Where We're Going, We'll Still Need Them","kind":"Literature","s":"The speaker longs for the sea: a tall ship, a star, wind and spray.","t":"Choice, compulsion, wanderlust","y":"He flips Bilbo: staying home is the danger, and the journey makes him feel alive.","r":"From Salt-Water Ballads. Loping meter mimics waves. The \"long trick\" is a shift at the wheel, and life itself. Masefield became Poet Laureate in 1930.","m":"John Masefield","d":"1902","x":"n17vajdq"},{"w":"\"Window\"","sec":"Where We're Going, We'll Still Need Them","kind":"Literature","s":"In three lines, a night train passes \"slashes of light\" through a \"great, dark, soft thing\".","t":"Isolation, Imagism","y":"The traveler sees others' homes but stays cut off from them.","r":"From Chicago Poems. Darkness is soft and light is violent, flipping expectations. Sandburg won three Pulitzers and was once a hobo.","m":"Carl Sandburg","d":"1914","x":"n1agm9ev"},{"w":"\"The Road Not Taken\"","sec":"Where We're Going, We'll Still Need Them","kind":"Literature","s":"A traveler picks one of two equal roads, and later claims it made all the difference.","t":"Choice, regret, self-deception","y":"The danger is the burden of an irreversible choice.","r":"Often misread: both roads are \"really about the same\". A joke on Edward Thomas, killed at Arras in 1917. ABAAB rhyme.","m":"Robert Frost","d":"1915","x":"ni2u1je"},{"w":"\"Sailing to Byzantium\"","sec":"Where We're Going, We'll Still Need Them","kind":"Literature","s":"An aging man leaves \"no country for old men\" to become an immortal golden work of art.","t":"Mortality, artifice","y":"Travel by necessity: the body is decaying, so he seeks asylum in art.","r":"Ottava rima, ABABABCC. Nobel Prize in 1923. Gyres. Cormac McCarthy took a title from it.","m":"William Butler Yeats","d":"1927","x":"nw4l8y4"},{"w":"\"The Journey\"","sec":"Where We're Going, We'll Still Need Them","kind":"Literature","s":"A speaker with no house or boat dreams of waters \"smelling of pineapples\", but the ship leaves without them.","t":"Unfulfilled wanderlust, mortality","y":"What if you long to travel but are trapped at home?","r":"Garip movement, free verse. Onur died of tuberculosis at 22. Zonguldak, a Black Sea coal city. The film The Butterfly's Dream (2013).","m":"Rustu Onur","d":"c. early 20th century","x":"n1af5joi"},{"w":"\"This Only\"","sec":"Where We're Going, We'll Still Need Them","kind":"Literature","s":"A traveler reaches an autumn valley with pigeons, and accepts this moment as enough.","t":"Arrival, acceptance","y":"Sometimes it really is better to stop. It shows the peace of ending a journey.","r":"Miłosz resisted the Nazis in Warsaw, defected in 1951, settled in Berkeley, and won the Nobel in 1980. Righteous Among the Nations.","m":"Czeslaw Milosz","d":"1988","x":"nj7xv4p"},{"w":"\"Just Drive\"","sec":"Where We're Going, We'll Still Need Them","kind":"Literature","s":"Robert finds an armed woman in his borrowed Mazda RX7: \"Just drive.\" He speeds toward a washed-out bridge.","t":"Forced transit, tech-noir","y":"The open road becomes a trap, travel by violent necessity.","r":"Full title \"Just Drive, She Said\", by Richard Paul Russo, published in Asimov's Science Fiction. A Philip K. Dick Award author. Title plays on Robert Creeley's \"I Know a Man\".","m":"Richard Russo","d":"1992","x":"n1fffunz"},{"w":"\"Vacation\"","sec":"Where We're Going, We'll Still Need Them","kind":"Literature","s":"A passenger enjoys the hour before takeoff, detached from past and future, watching baggage handlers.","t":"Modern transit, suspended reality","y":"Air travel turns the dangerous unknown into a routine waiting room.","r":"Later in On the Bus with Rosa Parks. Heavy enjambment. Dove was the youngest and first African American Poet Laureate.","m":"Rita Dove","d":"1994","x":"n1vytama"},{"w":"\"Get Your Kicks on Route 66\"","sec":"Where We're Going, We'll Still Need Them","kind":"Music","s":"A cheerful map of towns from Chicago to LA.","t":"Idealization, car culture","y":"It heavily over-idealizes the road as pure choice and freedom.","r":"Written by Bobby Troup, whose wife Cynthia suggested the title. For Black drivers the route was dangerous, with sundown towns and the Green Book. Winona was added for the rhyme.","m":"Nat Cole","d":"1946","x":"n9m77xp"},{"w":"Western Motel","sec":"Where We're Going, We'll Still Need Them","kind":"Art","s":"A woman sits stiffly in a clean motel room with packed luggage, a green car and bare hills behind the window.","t":"Isolation, transience","y":"A sobering critique: mobility can bring alienation.","r":"Oil on canvas, Yale. A year after the 1956 Highway Act. Model: his wife Jo Nivison.","m":"Edward Hopper","d":"1957","x":"n6cjcu0"},{"w":"Standard Station","sec":"Where We're Going, We'll Still Need Them","kind":"Art","s":"A gas station cuts diagonally across the frame, with the \"STANDARD\" sign and a sunset.","t":"Pop Art, commercialism","y":"America tamed the unknown road by branding it.","r":"Screenprint. \"Standard\" also means uniform. Ruscha made the book Twentysix Gasoline Stations (1963) and worked in advertising.","m":"Edward Ruscha","d":"1966","x":"n1ucsu5m"},{"w":"\"On the Road Again\"","sec":"Where We're Going, We'll Still Need Them","kind":"Music","s":"Willie Nelson can't wait to go back on tour with friends.","t":"Nomadic life, camaraderie","y":"The road is his true home, a joyful idealization.","r":"For the film Honeysuckle Rose, supposedly written on a barf bag. Train-beat rhythm. Grammy winner. Outlaw Country.","m":"Willie Nelson","d":"1980","x":"n19qedd7"},{"w":"Pearblossom Highway","sec":"Where We're Going, We'll Still Need Them","kind":"Art","s":"A California desert crossroads with a \"Stop Ahead\" marking, signs, Joshua trees and beer cans.","t":"Perspective, observation","y":"Travel is a fragmented series of glances stitched together by the mind.","r":"A \"joiner\" of over 700 photographs, at the Getty. Cubist-style. Right side shows a driver's view, left a passenger's.","m":"David Hockney","d":"1985","x":"nre6nhr"},{"w":"\"Life is a Highway\"","sec":"Where We're Going, We'll Still Need Them","kind":"Music","s":"The road as a metaphor for life, an upbeat anthem to keep moving.","t":"Optimism, resilience","y":"It strongly rejects Bilbo: the road is a playground.","r":"Cochrane is Canadian, and it reached #1 in Canada. Rascal Flatts covered it for Cars in 2006.","m":"Tom Cochrane","d":"1991","x":"n1vjgdrr"},{"w":"\"Drive\"","sec":"Where We're Going, We'll Still Need Them","kind":"Music","s":"A quiet invitation to leave everything behind and focus on the person beside you.","t":"Intimacy, sanctuary","y":"The car is a private bubble rather than a public stage.","r":"Runga's first solo single, from New Zealand. Used in American Pie (1999).","m":"Bic Runga","d":"1996","x":"n1xldnl3"},{"w":"\"Come Away with Me\"","sec":"Where We're Going, We'll Still Need Them","kind":"Music","s":"Soft piano and voice invite someone to escape to a mountaintop.","t":"Intimacy, escape","y":"It over-idealizes the road as a safe, romantic sanctuary.","r":"Title track of a debut that won eight Grammys. Daughter of Ravi Shankar.","m":"Norah Jones","d":"2002","x":"n3xda3v"}];

function bowl(){tab('bowl');V.innerHTML=`<h1>Scholar's Bowl</h1><p class="lede">Practice rounds against the clock. Faster right answers score more. This is a drill for speed, not the official Bowl scoring.</p>
 <div class="panel filters"><label class="field">Players<select id="bp"><option value="1"${BW.p==1?' selected':''}>Solo</option><option value="2"${BW.p==2?' selected':''}>Two teams, one screen</option></select></label>

function startBowl(){const pool=BW.sec?BYSEC[BW.sec]:CARDS;const qs=shuffle(pool).slice(0,BW.n);let i=0,sc=[0,0],right=0,streak=0,best=0,tick=null,wait=null,miss=[],times=[];
 focusMode(true);scrollTo(0,0);const stop=()=>{clearInterval(tick);clearTimeout(wait);document.onkeydown=null};CLEAN.push(stop);
 const clock=(secs,onEnd)=>{clearInterval(tick);const t0=performance.now(),ms=secs*1e3;const f=()=>{const left=Math.max(0,ms-(performance.now()-t0)),e=$('#ck');if(e){e.style.width=left/ms*100+'%';e.classList.toggle('low',left/ms<.3)}if(left<=0){clearInterval(tick);onEnd()}};f();tick=setInterval(f,100);return()=>Math.max(0,ms-(performance.now()-t0))/ms};
 const say=(t)=>{$('#br').innerHTML=`<p class="fb-h" style="margin-top:12px">${esc(t)}</p>`};
 const show=()=>{if(i>=qs.length)return results();const c=qs[i],ops=opts(c);let phase=BW.p==1?'answer':'buzz',who=0,tried=[],remain;
  V.innerHTML=`<div class="board"><div><span>${BW.p==1?'Score':'Team A'}</span><b>${sc[0]}</b></div><div class="mid">${i+1} of ${qs.length}${BW.p==1&&streak>1?`<br>Streak ${streak}`:''}</div><div class="r">${BW.p==1?'':`<span>Team B</span><b>${sc[1]}</b>`}</div></div>
  <div class="clock"><i id="ck"></i></div><div class="card"><p class="small muted" style="margin-bottom:6px">${esc(BANK[c.si].title)}</p><div class="q">${c.html}</div>
  <div class="opts">${ops.map((o,k)=>`<button class="opt" data-o="${esc(o)}" ${phase==='buzz'?'disabled':''}><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="br"></div></div>
  ${BW.p==2?`<div class="buzz"><button id="ba">Team A (A)</button><button id="bb">Team B (L)</button></div>`:''}<div class="row afterq"><button class="btn quiet" id="bq">End round</button></div>`;
  const bs=[...V.querySelectorAll('.opt')];$('#bq').onclick=()=>{stop();results()};
  const reveal=(msg,ok)=>{phase='done';clearInterval(tick);bs.forEach(x=>{x.disabled=true;if(x.dataset.o===c.a)x.classList.add('right')});say(msg);

  bs.forEach(b=>b.onclick=()=>pick(b));

  else head=`<p class="big">${sc[0]===sc[1]?'A tie':sc[0]>sc[1]?'Team A wins':'Team B wins'}</p><div class="res"><div><b>${sc[0]}</b><span>Team A</span></div><div><b>${sc[1]}</b><span>Team B</span></div></div>`;
  V.innerHTML=head+`<div class="row" style="margin-top:14px"><button class="btn go" id="again">Play again</button><a class="btn" href="#home">Back to today</a></div><h2 class="sec">Missed this round</h2>${miss.map(c=>`<div class="fact">${factLine(c)}${askB(c.full,BANK[c.si].title,c.note)}</div>`).join('')||'<p style="margin-top:10px">None.</p>'}`;$('#again').onclick=()=>{cleanup();bowl()}};

const T={status:'loading',list:[],me:null,id:null,db:null,can:null,owner:false,noWrite:false,lb:'today',ask:null,err:'',hold:false,chain:Promise.resolve(),sent:''};
const CH_N=15,CH_SECS=480;
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const myCh=()=>{const d=dayKey();if(T.me&&T.me.challenge&&T.me.challenge.day===d)return T.me.challenge;return S.ch&&S.ch.day===d?S.ch:null};
function cleanMember(s){const d=s.data()||{},name=String(d.name||'').trim().slice(0,24);if(!name)return null;
 const c=d.challenge,pct={};if(d.pct&&typeof d.pct==='object')BANK.forEach(x=>{pct[x.id]=Math.min(100,Math.max(0,Math.round(+d.pct[x.id]||0)))});
 return{id:s.id,name,topics:Array.isArray(d.topics)?[...new Set(d.topics.map(x=>Object.hasOwn(LEGACY,x)?LEGACY[x]:x))].filter(x=>Object.hasOwn(BYSEC,x)):[],mastered:Math.max(0,Math.round(+d.mastered||0)),pct,updated:+d.updated||0,retryAt:+d.retryAt||0,
  challenge:c&&typeof c==='object'&&c.day?{day:String(c.day),score:Math.max(0,+c.score||0),total:+c.total||CH_N,secs:Math.max(0,+c.secs||0)}:null}}
async function teamStart(db,user){T.db=db;if(user){const [o,i,c]=await Promise.all([user.isOwner(),user.id(),user.can('data.write')]);T.owner=!!o;T.id=i||null;T.can=c}

  try{db.collection('team').onSnapshot(s=>{clearTimeout(slow);T.list=s.docs.map(cleanMember).filter(Boolean);T.me=T.list.find(m=>m.id===T.id)||null;if(S.ch&&T.me&&T.me.retryAt>(S.ch.at||0)){S.ch=null;put()}T.status='ready';teamChanged()},

/* A fixed random sequence from the date, so everyone gets the same questions and answer order. */
function seeded(seed,fn){const old=RND;let a=seed;RND=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};try{return fn()}finally{RND=old}}
const seedOf=s=>{let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0};
function challengeSet(day){return seeded(seedOf('wsc-'+day),()=>{const seen=new Set(),out=[];for(const c of shuffle(CARDS)){if(seen.has(c.full))continue;seen.add(c.full);out.push(c);if(out.length===CH_N)break}return out.map(c=>({c,o:opts(c),a:[]}))})}
const rankBy=(l,val,tie)=>{let r=0,prev=null;return l.map((m,i)=>{const k=val(m)+'|'+(tie?tie(m):'');if(k!==prev){r=i+1;prev=k}return{m,r}})};

function startChallenge(){if(myCh())return;const day=dayKey();T.hold=true;CLEAN.push(()=>{T.hold=false});

  after:()=>`<div class="row" style="margin-top:16px"><a class="btn go" href="#team">See the leaderboard</a></div>`})}
const nameH=m=>`<span class="who-n"><span>${esc(m.name)}</span>${m===T.me?'<span class="pill you">You</span>':''}</span>`;
function lbHtml(){if(T.lb==='today'){const {pl,rest}=boardToday();return pl.map(({m,r})=>`<li class="lb"><span class="rk${r===1?' first':''}">${r}</span>${nameH(m)}<span class="sc">${fm(m.challenge.score)}<small>of ${m.challenge.total}, ${fmtT(m.challenge.secs)}</small></span></li>`).join('')+rest.map(m=>`<li class="lb"><span class="rk off">–</span>${nameH(m)}<span class="sc off">Not played yet</span></li>`).join('')}
 const l=T.list.slice().sort((a,b)=>b.mastered-a.mastered||a.name.localeCompare(b.name));

 <div class="panel filters"><label class="field">Topic<select id="at"><option value="">All topics</option>${secs.map(s=>`<option value="${s.id}"${s.id===AC.sec?' selected':''}>${esc(s.title)}</option>`).join('')}</select></label>
 <label class="field">Questions<select id="an">${[[10,'10'],[20,'20'],[0,'All']].map(([v,l])=>`<option value="${v}"${v===AC.n?' selected':''}>${l}</option>`).join('')}</select></label></div>
 <div class="row startrow"><button class="btn go" id="ago">Start quiz</button><span class="small muted" id="acn"></span></div>
 <p class="small muted" style="margin-top:10px">${t.m} of ${t.n} acronyms mastered.</p>`;
 const cnt=()=>{const n=pool().length;$('#acn').textContent=`${AC.n?Math.min(AC.n,n):n} of ${n} acronyms`};cnt();
 $('#at').onchange=e=>{AC.sec=e.target.value;cnt()};$('#an').onchange=e=>{AC.n=+e.target.value;cnt()};
 $('#ago').onclick=()=>{const l=pool();run(shuffle(AC.n?l.slice(0,AC.n):l),'Acronyms')}}

/* Put it in order */
let OR={sec:'',n:5};
function orderPage(){tab('order');const secs=BANK.filter(s=>ORDERS.some(o=>o.s===s.id)),pick=()=>ORDERS.filter(o=>!OR.sec||o.s===OR.sec);
 V.innerHTML=`<h1>Put it in order</h1><p class="lede">Steps, layers, routes and timelines from the curriculum. Drag each item by its handle, or use the arrows, then check your order.</p>
 <div class="panel filters"><label class="field">Topic<select id="ot"><option value="">All topics</option>${secs.map(s=>`<option value="${s.id}"${s.id===OR.sec?' selected':''}>${esc(s.title)}</option>`).join('')}</select></label>
 <label class="field">Puzzles<select id="on">${[[5,'5'],[10,'10'],[0,'All']].map(([v,l])=>`<option value="${v}"${v===OR.n?' selected':''}>${l}</option>`).join('')}</select></label></div>
 <div class="row startrow"><button class="btn go" id="ogo">Start</button><span class="small muted" id="ocn"></span></div>`;
 const cnt=()=>{const n=pick().length;$('#ocn').textContent=`${OR.n?Math.min(OR.n,n):n} of ${n} puzzles`};cnt();
 $('#ot').onchange=e=>{OR.sec=e.target.value;cnt()};$('#on').onchange=e=>{OR.n=+e.target.value;cnt()};
 $('#ogo').onclick=()=>{const l=shuffle(pick());startOrder(OR.n?l.slice(0,OR.n):l)}}
function sortable(ol,onMove){let drag=null,ph=null,offY=0;
 const end=()=>{if(!drag)return;drag.classList.remove('lift');drag.style.cssText='';ph.replaceWith(drag);drag=null;ph=null;onMove()};
 ol.addEventListener('pointerdown',e=>{const g=e.target.closest('.grip');if(!g||ol.classList.contains('done'))return;const li=g.closest('li');e.preventDefault();
  const r=li.getBoundingClientRect();offY=e.clientY-r.top;drag=li;ph=document.createElement('li');ph.className='ord-ph';ph.style.height=r.height+'px';li.after(ph);
  li.classList.add('lift');Object.assign(li.style,{width:r.width+'px',left:r.left+'px',top:r.top+'px'});try{g.setPointerCapture(e.pointerId)}catch(er){}});
 ol.addEventListener('pointermove',e=>{if(!drag)return;drag.style.top=(e.clientY-offY)+'px';let before=null;
  for(const x of ol.children){if(x===drag||x===ph)continue;const r=x.getBoundingClientRect();if(e.clientY<r.top+r.height/2){before=x;break}}
  if(before)ol.insertBefore(ph,before);else ol.appendChild(ph);
  if(e.clientY<60)scrollBy(0,-12);else if(e.clientY>innerHeight-60)scrollBy(0,12)});
 ol.addEventListener('pointerup',end);ol.addEventListener('pointercancel',end);ol.addEventListener('lostpointercapture',end)}
function startOrder(list){focusMode(true);scrollTo(0,0);let i=0;const res=[];
 const show=()=>{if(i>=list.length)return done();const o=list[i],n=o.items.length;let cur=o.items.map((x,k)=>k);
  do{cur=shuffle(cur)}while(cur.every((k,j)=>k===j));let checked=false;
  const li=k=>`<li data-k="${k}"><span class="grip" title="Drag to move" aria-hidden="true"></span><span class="pos"></span><span class="lab">${esc(o.items[k][0])}<span class="det"></span></span><span class="mv"><button type="button" data-d="-1" aria-label="Move up">↑</button><button type="button" data-d="1" aria-label="Move down">↓</button></span></li>`;
  V.innerHTML=`<div class="runbar"><b>${esc(SEC[o.s].title)}</b><span>${i+1} of ${list.length}</span></div><div class="thin"><i style="width:${i/list.length*100}%"></i></div>
  <div class="card"><div class="q">${esc(o.t)}</div><p class="hint" style="margin-top:6px">${esc(o.dir)}.</p><ol class="ord" id="ord">${cur.map(li).join('')}</ol><div id="ofb"></div></div>
  <div class="row afterq"><button class="btn go" id="ochk">Check order</button><button class="btn quiet" id="oend">End</button></div>`;
  const ol=$('#ord'),num=()=>[...ol.children].forEach((x,j)=>{const p=x.querySelector('.pos');if(p)p.textContent=j+1;const b=x.querySelectorAll('.mv button');if(b.length){b[0].disabled=j===0||checked;b[1].disabled=j===n-1||checked}});num();
  sortable(ol,num);
  ol.onclick=e=>{const b=e.target.closest('.mv button');if(!b||checked)return;const x=b.closest('li'),d=+b.dataset.d;if(d<0&&x.previousElementSibling)ol.insertBefore(x,x.previousElementSibling);else if(d>0&&x.nextElementSibling)ol.insertBefore(x.nextElementSibling,x);num();const nb=x.querySelector(`.mv button[data-d="${d}"]`);if(nb&&!nb.disabled)nb.focus();else x.querySelector('.mv button:not(:disabled)')?.focus()};
  const check=()=>{if(checked){i++;return show()}checked=true;ol.classList.add('done');const ks=[...ol.children].map(x=>+x.dataset.k);let right=0;
   [...ol.children].forEach((x,j)=>{const k=+x.dataset.k,ok=k===j;if(ok)right++;x.classList.add(ok?'right':'wrong');const d=o.items[k][1];x.querySelector('.det').textContent=[d,ok?'':`Belongs at ${k+1}`].filter(Boolean).join('. ')});num();
   res.push({o,right,n});const all=right===n;
   $('#ofb').innerHTML=`<div class="fb"><p class="fb-h ${all?'ok':right>=n/2?'':'no'}">${all?'All in the right order.':`${right} of ${n} in the right place.`}</p>${all?'':`<p class="small muted">The right order:</p><ol class="ord-ans">${o.items.map((x,k)=>`<li><b>${esc(x[0])}</b>${x[1]?` <span class="muted">${esc(x[1])}</span>`:''}</li>`).join('')}</ol>`}</div>`;
   const b=$('#ochk');b.textContent=i<list.length-1?'Next':'See results';b.focus()};
  $('#ochk').onclick=check;$('#oend').onclick=done;document.onkeydown=e=>{if(e.key==='Enter'&&!e.target.closest('.mv')){e.preventDefault();check()}}};
 const done=()=>{document.onkeydown=null;focusMode(false);scrollTo(0,0);const p=res.filter(r=>r.right===r.n).length,items=res.reduce((a,r)=>a+r.n,0),ok=res.reduce((a,r)=>a+r.right,0);
  V.innerHTML=`<p class="small muted">Put it in order</p><p class="big">${p} of ${res.length}</p><p class="lede">Puzzles in perfect order. ${items?Math.round(ok/items*100):0}% of items were in the right place.</p>
  <div class="row" style="margin-top:14px"><button class="btn go" id="oagain">Play again</button></div>
  <h2 class="sec">Worth another look</h2>${res.filter(r=>r.right<r.n).map(r=>`<div class="fact"><b>${esc(r.o.t)}</b><ol class="ord-ans">${r.o.items.map(x=>`<li>${esc(x[0])}${x[1]?` <span class="muted">${esc(x[1])}</span>`:''}</li>`).join('')}</ol></div>`).join('')||`<p style="margin-top:10px">${res.length?'None. Every puzzle was in perfect order.':'No puzzles finished.'}</p>`}`;
  $('#oagain').onclick=()=>orderPage()};
 CLEAN.push(()=>{document.onkeydown=null});show()}

/* Must-know sheets: the facts that matter most in each topic, chosen by hand. */
let MKC=false;
const mkItems=id=>(MUST[id]||[]).map(k=>ITEMS[k]&&eff(ITEMS[k].it)).filter(Boolean);
const mkCards=id=>{const ks=new Set(MUST[id]||[]);return BYSEC[id].filter(c=>ks.has(c.x))};
const shaky=id=>{const ks=new Set(MUST[id]||[]);return BYSEC[id].filter(c=>{const x=st(c);return x&&x[3]>0&&x[0]<MASTER&&!ks.has(c.x)}).sort((a,b)=>st(b)[3]-st(a)[3])};
const dotOf=k=>{const l=CARDS.filter(c=>c.x===k);if(!l.length)return '';const s=l.map(st);return s.every(x=>x&&x[0]>=MASTER)?'done':s.some(Boolean)?'part':''};
function sheets(){tab('sheets');const T2=TOP(),CR=CROSS(),WK2=BANK.filter(s=>s.wk);
 const row=(s,n)=>{const wk=s.wk,cs=wk?BYSEC[s.id]:mkCards(s.id),t=stats(cs),sk=wk?0:shaky(s.id).length,cnt=wk?WORKS.filter(w=>secForWork(w)===s.id).length:mkItems(s.id).length;
  return `<li><a class="stop" href="#sheet-${s.id}"><span class="mm${t.p===100?' done':''}">${n}</span><span class="st"><b>${esc(shortT(s))}</b><span class="small muted">${wk?plural(cnt,'work'):cnt+' must-knows'}${sk?`, ${sk} still shaky for you`:''}</span></span><span class="pct">${t.p}%<small>mastered</small></span></a></li>`};
 V.innerHTML=`<h1>Must-know</h1><p class="lede">One page per topic with the facts that matter most, the dates, and anything still shaky for you. Made for a quick review the night before.</p>
 <h2 class="sec">Topics</h2><ol class="route">${T2.map((s,i)=>row(s,i+1)).join('')}</ol><h2 class="sec">Across the curriculum</h2><ol class="route">${CR.map((s,i)=>row(s,T2.length+i+1)).join('')}</ol><h2 class="sec">Works</h2><ol class="route">${WK2.map((s,i)=>row(s,T2.length+CR.length+i+1)).join('')}</ol>`}
function sheet(id){tab('sheets');if(Object.hasOwn(LEGACY,id)&&!SEC[id])id=LEGACY[id];const L=BANK,i=L.findIndex(s=>s.id===id);if(i<0)return sheets();const s=L[i],wk=s.wk;
 const draw=()=>{const cov=MKC?'c':'',mk=t=>`<mark class="${cov}">${t}</mark>`;let body='';
  if(!wk){body+=`<h2 class="sec">Know these cold</h2>`+mkItems(id).map(it=>`<div class="fact mk"><i class="dot ${dotOf(it.x)}" aria-hidden="true"></i><div>${it.k==='s'?factHtml(it.t,MKC):`${esc(it.q)} ${mk(esc(it.a))}`}${askB(itemText(it),s.title,it.note)}${edB(it.x)}${it.note?`<div class="note"><b>Correction:</b> ${esc(it.note)}</div>`:''}</div></div>`).join('')+`<p class="tiny muted" style="margin-top:8px">Green dot: mastered. Amber: in progress. Grey: not started yet.</p>`;
   const dates=TL.filter(e=>e.s===id);if(dates.length)body+=`<h2 class="sec">Dates in this topic</h2>`+dates.map(e=>`<div class="dl">${mk(esc(e.y<0?-e.y+' BCE':e.l))}<span>${esc(e.t)}</span></div>`).join('');
   const works=s.subs.flatMap(u=>u.items.filter(x=>x.k==='w'));if(works.length)body+=`<h2 class="sec">Works in this topic</h2>`+works.map(w=>`<div class="dl">${mk(esc(w.y))}<span><b>${esc(w.w)}</b>, ${esc(w.m)}</span></div>`).join('')}
  else{body+=`<h2 class="sec">Works in this section</h2>`+WORKS.filter(w=>secForWork(w)===id).map(w=>`<div class="fact mk"><i class="dot" aria-hidden="true"></i><div><b>${esc(w.w)}</b>, ${mk(esc(w.m)+', '+esc(w.d))}<div class="small muted">Theme: ${esc(w.t)}</div><div class="small">${esc(w.r)}${askB(wkText(w),w.sec)}${edB(w.x)}</div></div></div>`).join('')}
  const sk=shaky(id).slice(0,10);body+=`<h2 class="sec">Still shaky for you</h2>`+(sk.map(c=>`<div class="fact"><span class="pill">Missed ${st(c)[3]}×</span> ${factLine(c)}${askB(c.full,s.title,c.note)}</div>`).join('')||'<p class="small muted" style="margin-top:10px">Nothing shaky yet. Questions you miss here will show up in this list.</p>');
  const grp=L.filter(x=>!!x.wk===!!wk&&!!x.cross===!!s.cross);V.innerHTML=`<p class="small muted">Must-know, ${wk?`works section ${grp.indexOf(s)+1} of ${grp.length}`:s.cross?'across the curriculum':`topic ${grp.indexOf(s)+1} of ${grp.length}`}</p><h1>${esc(s.title)}</h1>
  <div class="row" style="margin-top:14px"><button class="btn go" id="mkq">Quiz me on these</button><button class="btn" id="mkc">${MKC?'Show answers':'Cover answers'}</button></div>${body}
  <nav class="pager" aria-label="Must-know sheets">${i>0?`<a href="#sheet-${L[i-1].id}"><span>Previous</span><b>${esc(L[i-1].title)}</b></a>`:''}${i<L.length-1?`<a href="#sheet-${L[i+1].id}"><span>Next</span><b>${esc(L[i+1].title)}</b></a>`:''}</nav>`;
  $('#mkq').onclick=()=>{const l=wk?shuffle(BYSEC[id]).slice(0,20):mkCards(id).concat(shaky(id).slice(0,10));run(shuffle(l),'Must-know: '+s.title)};
  $('#mkc').onclick=()=>{MKC=!MKC;draw()};V.querySelectorAll('mark.c').forEach(m=>m.onclick=()=>m.classList.remove('c'))};draw()}

const VIEWS={weak:weakSpots,admin:adminView,works:worksView,years,sheets,order:orderPage,acronyms,which,compare,ask:askPage,drill,timeline,bowl,notes:notesIndex,exam,missed,fixes,indexes,team:teamView};

 if(h.startsWith('notes-')){VIEW='notes';notes(h.slice(6))}else if(h.startsWith('sheet-')){VIEW='sheets';sheet(h.slice(6))}else if(Object.hasOwn(VIEWS,h)){VIEW=h;VIEWS[h]()}else{VIEW='home';home()}foot();if(soft!==true)scrollTo(0,0)}
