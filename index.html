<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WSC Memory Route</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout concept: a highway. An overhead gantry carries the navigation, today's plan is a roadside distance sign, and the topics run down a road with numbered mile markers. */
:root{
  --bg:#EEF0EA;--surface:#FBFBF7;--ink:#17211C;--muted:#55625A;--line:#D3D9D0;--line-strong:#AEB8AD;
  --sign:#0B5D43;--sign-deep:#084A35;--sign-ink:#FFFFFF;--sign-soft:#C4E6D6;
  --green:#0A6245;--green-ink:#FFFFFF;--green-soft:#DCEFE4;
  --amber:#E8A80C;--amber-soft:#FBEBC2;--amber-ink:#553D00;--on-amber:#241A00;
  --red:#B3362A;--red-soft:#F9E2DE;--ok:#14764F;--ok-soft:#DCF0E5;
  --road:#2C3331;--road-ink:#FFFFFF;
  --sans:"Overpass","Trebuchet MS",Verdana,sans-serif;--mono:"Overpass Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131718;--surface:#1C2224;--ink:#E8EDE9;--muted:#A0ACA5;--line:#323B38;--line-strong:#515C57;
  --sign:#0C5A41;--sign-deep:#08432F;--sign-ink:#FFFFFF;--sign-soft:#B3E0CB;
  --green:#45C394;--green-ink:#06241A;--green-soft:#15352A;
  --amber:#F2B632;--amber-soft:#3B2F12;--amber-ink:#F6DA94;--on-amber:#241A00;
  --red:#F08E7C;--red-soft:#43231E;--ok:#62D6A6;--ok-soft:#163428;
  --road:#49534F;--road-ink:#FFFFFF;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131718;--surface:#1C2224;--ink:#E8EDE9;--muted:#A0ACA5;--line:#323B38;--line-strong:#515C57;
  --sign:#0C5A41;--sign-deep:#08432F;--sign-ink:#FFFFFF;--sign-soft:#B3E0CB;
  --green:#45C394;--green-ink:#06241A;--green-soft:#15352A;
  --amber:#F2B632;--amber-soft:#3B2F12;--amber-ink:#F6DA94;--on-amber:#241A00;
  --red:#F08E7C;--red-soft:#43231E;--ok:#62D6A6;--ok-soft:#163428;
  --road:#49534F;--road-ink:#FFFFFF;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sign)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin-inline:auto}
a{color:var(--green)}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:-1px}

/* Type scale: 13, 14.5, 16, 19, 22, then the display sizes */
h1{font:900 clamp(30px,5.4vw,42px)/1.08 var(--sans);letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
h2{font:800 19px/1.25 var(--sans);margin:0;text-wrap:balance}
.sec{margin:32px 0 2px;padding-bottom:7px;border-bottom:2px solid var(--ink)}
.lede{color:var(--muted);max-width:64ch}
.grp{font:900 clamp(22px,3.6vw,26px)/1.2 var(--sans);letter-spacing:-.01em;margin:44px 0 0;padding-top:12px;border-top:6px solid var(--sign);text-wrap:balance}
h3.sec{font:800 18px/1.3 var(--sans)}
.grp+h3.sec{margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.tiny{font-size:13px}
.num{font-weight:800}
.err{color:var(--red);font-weight:600;font-size:14.5px}
.err:empty{display:none}

/* Gantry */
.gantry{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--sign);color:var(--sign-ink);box-shadow:inset 0 -3px 0 var(--sign-deep)}
.gantry .wrap{display:flex;align-items:stretch;justify-content:space-between;gap:20px;min-height:60px}
.brand{align-self:center;color:inherit;text-decoration:none;font-weight:900;font-size:19px;letter-spacing:-.01em;white-space:nowrap;padding-top:2px}
nav.main{display:flex;gap:2px}
nav.main a{display:flex;align-items:center;padding:6px 12px 2px;color:var(--sign-soft);text-decoration:none;font-weight:800;font-size:15.5px;border-bottom:4px solid transparent;white-space:nowrap}
nav.main a:hover{color:var(--sign-ink)}
nav.main a.on{color:var(--sign-ink);border-bottom-color:var(--amber)}
nav.main svg{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Section tabs */
.lanes{border-bottom:1px solid var(--line)}
.sub{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-6px}
.sub::-webkit-scrollbar{display:none}
.sub a{flex:none;padding:12px 10px 7px;font-weight:700;font-size:15px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent}
.sub a:hover{color:var(--ink)}
.sub a.on{color:var(--ink);border-bottom-color:var(--green)}

main{padding-block:26px 0}
footer{padding-block:36px 40px;font-size:13px;color:var(--muted)}
body.focus .lanes,body.focus footer{display:none}
body.focus main{padding-bottom:40px}

/* Controls */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:800 15px/1.1 var(--sans);padding:13px 16px 10px;border-radius:7px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.go{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.btn.go:hover:not(:disabled){filter:brightness(1.08);border-color:var(--green)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.btn.amber:hover:not(:disabled){filter:brightness(1.06);border-color:var(--amber)}
.btn.quiet{background:none;border-color:transparent;color:var(--muted);padding-inline:6px}
.btn.quiet:hover:not(:disabled){color:var(--ink);border-color:transparent}
.btn.sm{font-size:14px;padding:9px 11px 7px}
.btn.on{background:var(--green-soft);border-color:var(--green);color:var(--ink)}
.btn.danger{color:var(--red);border-color:var(--red);background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:16px 0}
.field{display:grid;gap:4px;font-size:14.5px;font-weight:600;color:var(--muted);min-width:0}
.field input,.field select,.search{font:400 16px var(--sans);color:var(--ink);padding:10px 11px 9px;border-radius:7px;border:1.5px solid var(--line);background:var(--bg);min-width:0;width:100%}
.panel .search{background:var(--bg)}
.search:hover,.field input:hover,.field select:hover{border-color:var(--line-strong)}
.check{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:14.5px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--green)}
.startrow{margin-top:4px}
.seg{display:inline-flex;margin:14px 0;background:var(--line);border-radius:9px;padding:3px;max-width:100%}
.seg button{flex:1 1 auto;font:800 14.5px/1.15 var(--sans);padding:10px 14px 7px;background:transparent;color:var(--muted);border:0;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink)}
.pill{display:inline-block;font:700 13px/1.2 var(--sans);padding:4px 8px 2px;border-radius:5px;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.you{background:var(--green-soft);color:var(--ink)}
details.set{padding:0}
details.set summary{cursor:pointer;font-weight:800;padding:13px 16px 10px}
details.set[open] summary{padding-bottom:4px}
details.set .filters{padding:0 16px 16px;margin:8px 0 0}

/* The roadside sign */
.sign{position:relative;background:var(--sign);color:var(--sign-ink);border-radius:14px;padding:7px}
.sign.tabbed{margin-top:32px}
.sign-in{border:2.5px solid var(--sign-ink);border-radius:9px;padding:20px 22px 20px;display:grid;gap:12px}
.exit{position:absolute;right:26px;bottom:100%;margin-bottom:-2px;background:var(--sign);padding:6px 6px 0;border-radius:9px 9px 0 0}
.exit span{display:block;border:2.5px solid var(--sign-ink);border-bottom:0;border-radius:5px 5px 0 0;padding:5px 12px 1px;font-weight:800;font-size:15px;line-height:1.2;white-space:nowrap}
.sign h1,.sign h2{color:inherit;margin:0}
.sign h1{font-size:clamp(28px,5.6vw,36px)}
.sign h2{font-weight:900;font-size:clamp(24px,5vw,30px);letter-spacing:-.015em}
.dist{margin:0;display:grid;gap:1px}
.dist div{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.dist dt{font-weight:600;font-size:clamp(19px,4.2vw,24px);min-width:0}
.dist dd{margin:0;font-weight:900;font-size:clamp(23px,5vw,30px);white-space:nowrap}
.dist dd small{font-weight:600;font-size:.62em}
.signfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.nextup{display:flex;gap:8px;align-items:center;font-weight:600;min-width:0;flex:1 1 220px;overflow-wrap:anywhere}
.nextup svg{flex:none;width:22px;height:22px;fill:currentColor}
.signnote{color:var(--sign-soft);font-size:14.5px}
.sign a{color:inherit}

/* The road you have built so far */
.prog{display:grid;gap:7px;margin-top:18px}
.prog-h{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.prog-h b{font-weight:800}
.roadbar{position:relative;height:14px;border-radius:3px;background:var(--line);overflow:hidden}
.roadbar i{position:absolute;inset:0 auto 0 0;display:block;background:var(--road)}
.roadbar i::after{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:repeating-linear-gradient(90deg,var(--amber) 0 14px,transparent 14px 28px)}
.strip{display:flex;justify-content:space-between;align-items:center;gap:0 12px;flex-wrap:wrap;margin-top:16px;padding:12px 14px 9px;border-radius:9px;background:var(--amber-soft);color:var(--amber-ink);text-decoration:none;font-size:15px}
.strip b{font-weight:800}
.strip:empty{display:none}
#tstrip:empty{display:none}

/* The route */
.route{position:relative;margin-top:6px}
.route::before{content:"";position:absolute;left:18px;top:18px;bottom:18px;width:8px;background:var(--road)}
.route::after{content:"";position:absolute;left:21px;top:18px;bottom:18px;width:2px;background:repeating-linear-gradient(180deg,var(--amber) 0 7px,transparent 7px 14px)}
.stop{position:relative;z-index:1;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 8px 9px 0;color:inherit;text-decoration:none;border-radius:8px}
.stop:hover b{color:var(--green)}
.mm{display:block;width:44px;height:32px;border-radius:6px;background:var(--sign);color:var(--sign-ink);font:600 14px/33px var(--mono);text-align:center;box-shadow:inset 0 0 0 1.5px var(--sign),inset 0 0 0 2.5px var(--sign-soft)}
.mm.done{background:var(--amber);color:var(--on-amber);box-shadow:none}
.mm.sm{width:36px;height:28px;font-size:13px;line-height:29px}
.st{display:grid;gap:6px;min-width:0}
.st b{font-weight:800;overflow-wrap:anywhere;line-height:1.25}
.bar{display:flex;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.bar i.b{background:var(--amber)}
.pct{font:800 15px/1.2 var(--sans);text-align:right}
.pct small{display:block;font:400 13px/1.3 var(--sans);color:var(--muted)}

/* Notes */
.fact{padding:9px 0 8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.fact b{font-weight:700}
.fact mark{background:var(--amber-soft);color:var(--ink);font-weight:600;padding:1px 4px 0;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.fact mark.c{background:var(--line-strong);color:transparent;cursor:pointer;user-select:none}
.src{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
a.src:hover{color:var(--green);text-decoration:underline}
.note{background:var(--amber-soft);color:var(--amber-ink);border-radius:7px;padding:10px 12px 8px;font-size:14.5px;margin-top:8px}
.note b{font-weight:800}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:4px 12px;padding:9px 0 8px;border-bottom:1px solid var(--line);font-size:15px}
.work>span:nth-child(2){font-weight:600}
.work>span:nth-child(3){color:var(--muted);font-size:14px}
.work details{grid-column:1/-1}
.work summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--green)}
.pager{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:24px}
.pager a{display:grid;gap:1px;padding:12px 14px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);text-decoration:none}
.pager a:hover{border-color:var(--ink)}
.pager a:last-child:nth-child(2){text-align:right}
.pager span{font-size:13px;color:var(--muted)}
.pager b{font-weight:800;overflow-wrap:anywhere}

/* Quiz */
.runbar{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;color:var(--muted);margin-bottom:8px}
.runbar b{font-weight:700;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.runbar span{flex:none}
.thin{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:14px}
.thin i{display:block;height:100%;background:var(--green)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.q{font-size:clamp(19px,3.4vw,22px);line-height:1.38;font-weight:600;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:76px;border-bottom:3px solid var(--amber);height:.95em;vertical-align:baseline}
.opts{display:grid;gap:8px;margin-top:18px}
.opt{font:400 16px/1.35 var(--sans);text-align:left;padding:12px 12px 10px;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;color:var(--ink);cursor:pointer;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;overflow-wrap:anywhere}
.opt .k{display:block;width:26px;height:24px;border-radius:5px;background:var(--line);color:var(--muted);font:600 13px/25px var(--mono);text-align:center}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green);background:var(--green-soft)}
.opt.sel .k{background:var(--green);color:var(--green-ink)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);font-weight:600}
.opt.right .k{background:var(--ok);color:var(--green-ink);font-size:0}
.opt.right .k::after{content:"\2713";font-size:15px}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.opt.wrong .k{background:var(--red);color:var(--green-ink);font-size:0}
.opt.wrong .k::after{content:"\2715";font-size:13px}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:10px}
.fb-h{font-weight:800}
.fb-h.ok{color:var(--ok)}.fb-h.no{color:var(--red)}
.why{border-left:4px solid var(--amber);padding:1px 0 1px 12px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.why b{display:block;font-weight:800;font-size:14.5px}
.hint{font-size:14px;color:var(--muted)}
.afterq{margin-top:10px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:18px}
.pick{display:grid;gap:2px;text-align:left;padding:15px 16px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;font:400 15px/1.3 var(--sans)}
.pick b{font-weight:900;font-size:22px;letter-spacing:-.01em}
.pick span{color:var(--muted)}
.pick:hover{border-color:var(--ink)}
.pick.main{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.clk{font:600 18px var(--mono);color:var(--ink)}
.clk.low{color:var(--red)}
.big{font:900 clamp(38px,8vw,56px)/1 var(--sans);letter-spacing:-.02em;margin:0 0 8px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:14px 0}
.res div{display:grid;gap:1px}
.res b{font:900 28px/1.15 var(--sans)}
.res span{font-size:14px;color:var(--muted)}
.rows a{display:flex;justify-content:space-between;gap:12px;padding:10px 0 8px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.rows a:hover b{color:var(--green)}
.rows b{font-weight:700;min-width:0;overflow-wrap:anywhere}
.rows span{font-weight:800;flex:none}

/* Works and comparing */
.wk{padding:16px 0 14px;border-bottom:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 260px}
.wk .who-line{font-weight:600;margin-top:1px}
.wk .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
dl.w{display:grid;grid-template-columns:104px minmax(0,1fr);gap:6px 14px;margin:10px 0 0}
dl.w dt{font-size:14px;font-weight:700;color:var(--muted);padding-top:1px}
dl.w dd{margin:0;overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;margin:12px 0}
.cols .card{padding:16px}
.cols dl{margin:8px 0 0}
.cols dt{font-size:14px;font-weight:700;color:var(--muted);margin-top:10px}
.cols dd{margin:0;font-size:15px;overflow-wrap:anywhere}
.link{display:grid;gap:12px;background:var(--amber-soft);color:var(--ink);border:0}
.link b{display:block;font-weight:800}

/* Timeline */
.yr{display:grid;grid-template-columns:88px minmax(0,1fr);content-visibility:auto;contain-intrinsic-size:auto 70px}
.yr .y{font:800 15px/1.3 var(--sans);padding:11px 12px 0 0;text-align:right}
.yr.clash .y span{background:var(--amber-soft);color:var(--amber-ink);border-radius:4px;padding:2px 5px 0}
.evs{position:relative;border-left:2px solid var(--line-strong);padding:9px 0 9px 16px;min-width:0}
.evs::before{content:"";position:absolute;left:-7px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--road);box-shadow:0 0 0 3px var(--bg)}
.yr.clash .evs::before{background:var(--amber)}
.ev{padding:1px 0 6px;overflow-wrap:anywhere}
.ev .evf{display:block;line-height:1.4}

/* Indexes */
.ix{padding:13px 0 11px;border-bottom:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 120px}
.ix ul{margin-top:6px;display:grid;gap:5px}
.ix li{padding-left:14px;position:relative}
.ix li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
.nm{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:9px 0 8px;border-bottom:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 56px}
.nm .v{font-weight:800;color:var(--green);overflow-wrap:anywhere}
.gl{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:14px;padding:10px 0 9px;border-bottom:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 64px}
.gl b{display:block;font-weight:800}
.say{font-size:13.5px;color:var(--muted)}

/* Bowl */
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--road);color:var(--road-ink);border-radius:10px;padding:10px 16px 8px}
.board span{font-size:13px;display:block}
.board b{font:600 26px/1.15 var(--mono);color:var(--amber);display:block}
.board .mid{text-align:center;font-size:14px}
.board .r{text-align:right}
.clock{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0 12px}
.clock i{display:block;height:100%;background:var(--amber)}
.clock i.low{background:var(--red)}

<script>
const BANK0=[{"id":"progress","title":"Progress, Not Regress","subs":[{"t":"History of the progress bar","g":"Progress bars and waiting","items":[{"k":"s","t":"Before progress bars, users had no way to know whether a machine had [crashed|been hacked|lost power|overheated] or was simply taking longer to load.","i":"18tmhly","x":"s18tmhly"},{"k":"s","t":"1950–1960: users sat on a screen during loading, with no idea of the time needed or [whether it was loading at all|which program was running|who was logged in|how much memory remained].","i":"1i2b210","x":"s1i2b210"},{"k":"s","t":"1960–1970: screens said \"Loading…\" or \"[Please Wait|Stand By|Processing Now|Hold On]\", with no bar and no percentage.","i":"16zjkvl","x":"s16zjkvl"},{"k":"s","t":"1979: [Mitchell Model|Brad Myers|Alan Kay|Douglas Engelbart] introduced the first graphical progress indicator.","i":"omaup5","x":"somaup5"},{"k":"s","t":"Mitchell Model built that first progress indicator during his work at [Xerox PARC|Bell Labs|IBM Research|MIT Media Lab], on monitoring complex computational systems.","note":"Brad Myers is often credited, but the first progress bar came from Mitchell Model in 1979. Myers published the famous study.","i":"1o9sw5b","x":"s1o9sw5b"},{"k":"s","t":"1985: Brad A. Myers published \"The Importance of [Percent-Done Progress Indicators|Loading Screen Animations|Graphical User Displays|Computer Wait Times] for Computer-Human Interfaces.\"","i":"2wam1x","x":"s2wam1x"},{"k":"s","t":"Myers's study found people preferred progress indicators even when the work itself was [not any faster|twice as fast|slightly slower|done in the background].","i":"1dctgt9","x":"s1dctgt9"},{"k":"s","t":"Myers asked [48|24|36|100] students to search on 2 computers, one with and one without a progress bar.","i":"x0lvqd","x":"sx0lvqd"},{"k":"s","t":"In Myers's study, [41|28|36|44] of the students preferred the bar, around 85–86%.","i":"hhbz2t","x":"shhbz2t"},{"k":"s","t":"Myers on progress bars: \"People didn't mind so much if it was [inaccurate|slow|ugly|small]. They still preferred the progress bar to not having anything at all.\"","i":"7yzsx4","x":"s7yzsx4"},{"k":"s","t":"1986–1992: there were 2 types of bar: [indeterminate and determinate|linear and circular|graphical and text|local and remote].","i":"pz6n0d","x":"spz6n0d"},{"k":"s","t":"An indeterminate bar [cannot estimate total work|always shows a percentage|only appears on crashes|runs only in text windows]; it only shows that something is progressing.","i":"44mtyc","x":"s44mtyc"},{"k":"s","t":"A determinate bar's percentage implies [actual completion|time remaining in seconds|network speed|file size].","i":"1q0jds4","x":"s1q0jds4"},{"k":"s","t":"Installers and iOS updates sometimes sit at [99|50|75|90] percent because the difficult work happens at the end.","i":"edvzkw","x":"sedvzkw"},{"k":"s","t":"When a progress bar sits at 99%, users have invested too much to cancel. This is the [sunk cost fallacy|planning fallacy|Zeigarnik effect|Hawthorne effect].","i":"1qe3nv4","x":"s1qe3nv4"}]},{"t":"Alternatives to the bar","g":"Progress bars and waiting","items":[{"k":"s","t":"The indeterminate bar loops or pulses with [no percentage|a countdown|a logo|text logs], so you can't tell if it will take 1 minute or 1 hour.","i":"10x3xpi","x":"s10x3xpi"},{"k":"s","t":"Indeterminate bar advantages: reassurance, [visual continuity|exact timing|brand advertising|detailed logs], and ease of implementation.","i":"xwuuen","x":"sxwuuen"},{"k":"s","t":"Indeterminate bar disadvantages: more anxiety, since there is no end point, and [lack of control|double loading|too much text|high coding cost].","i":"1q0z88","x":"s1q0z88"},{"k":"s","t":"A splash screen shows a [logo or brand image|blurred page outline|spinning wheel|text log] when an app opens.","i":"1f3jstv","x":"s1f3jstv"},{"k":"s","t":"Splash screen advantages: system relief and [brand advertisement|exact timing|debugging|lower coding effort].","i":"nv1qsv","x":"snv1qsv"},{"k":"s","t":"A splash screen's disadvantage is [double loading|data loss|too much text|misleading layouts]: a splash screen followed by a throbber feels even worse.","i":"1mun6m","x":"s1mun6m"},{"k":"s","t":"Console output runs in a [text-based window|blurred placeholder|pop-up logo|moving bar].","i":"1141jzo","x":"s1141jzo"},{"k":"s","t":"Data input through a keyboard is called console [input|output|code|logging].","i":"ti9hs4","x":"sti9hs4"},{"k":"s","t":"Console inputs can also come from files, microphones and [barcode readers|progress bars|splash screens|throbbers].","i":"1qvs0kq","x":"s1qvs0kq"},{"k":"s","t":"A console program's output may be displayed on the screen or sent to a [file|keyboard|microphone|barcode reader].","i":"7ihvkz","x":"s7ihvkz"},{"k":"s","t":"Console output is widely used for [debugging and testing|branding|advertising|payment].","i":"1nqtvs2","x":"s1nqtvs2"},{"k":"s","t":"A progress bar answers \"How long until this is done?\"; console output answers \"[What exactly is happening right now, and is it working?|How much will this cost?|Who started this process?|Why was this program built?]\"","i":"rm1i16","x":"srm1i16"},{"k":"s","t":"Console advantages: it captures the exact process, shows when it fails, and needs no complex [front-end UI|hard drive|microphone|server].","i":"wv1rgv","x":"swv1rgv"},{"k":"s","t":"Console disadvantage: a fast-moving [wall of text|logo|loop|blank screen] can overwhelm users.","i":"1rndot0","x":"s1rndot0"},{"k":"s","t":"A skeleton screen mimics the [layout of the final page|company logo|file structure|system clock], with content blurred or shown as outlines.","i":"1anzrrl","x":"s1anzrrl"},{"k":"s","t":"Skeleton screens make apps feel faster because users see something immediately instead of a [blank screen|logo|text log|progress bar].","i":"zqfiff","x":"szqfiff"},{"k":"s","t":"A skeleton screen's disadvantage: it can be [misleading|too loud|too wordy|hard to code]; if loading takes too long, users may feel tricked.","i":"lgy278","x":"slgy278"},{"k":"s","t":"A throbber is also known as a [loading icon|splash icon|skeleton|pulse bar].","i":"119z0fw","x":"s119z0fw"},{"k":"s","t":"The throbber was first introduced in the [NCSA Mosaic|Netscape Navigator|Internet Explorer|Lynx] web browser in the early 1990s.","i":"kyg6dk","x":"skyg6dk"},{"k":"s","t":"A throbber's advantage is simplicity. Its disadvantage is that it shows no [progress|logo|animation|color].","i":"1t6k3wt","x":"s1t6k3wt"},{"k":"s","t":"Skeleton screens are said to reduce confusion by giving a [visual structure|exact percentage|brand message|sound cue] of what's coming.","i":"1lbspj2","x":"s1lbspj2"},{"k":"q","q":"Which alternative to the progress bar is used widely for debugging code?","a":"Console output","d":["Throbber","Splash screen","Skeleton screen"],"i":"44gqi9","x":"q44gqi9"},{"k":"q","q":"Which of these first appeared in the NCSA Mosaic browser?","a":"Throbber","d":["Skeleton screen","Splash screen","Determinate bar"],"i":"1eabpbu","x":"q1eabpbu"}]},{"t":"Placebo buttons and tricked patience","g":"Progress bars and waiting","items":[{"k":"s","t":"A placebo button looks real but is not connected to any function, giving a sense of [false control|real urgency|true progress|free choice].","i":"1tt1rxy","x":"s1tt1rxy"},{"k":"s","t":"Many pedestrian crossing buttons do nothing because lights are now run by [computers and timers|police officers|traffic wardens|road sensors alone].","i":"srxmzy","x":"ssrxmzy"},{"k":"s","t":"Most disabled crosswalk buttons were left in place because [replacing them was too big a task|they are protected by law|people like pressing them|they power the lights].","i":"1j3jce2","x":"s1j3jce2"},{"k":"s","t":"Elevator \"close door\" buttons in the US have not actually closed doors in elevators built since the [1990s|1950s|1970s|2010s].","i":"uj52k8","x":"suj52k8"},{"k":"s","t":"In lots of offices, false [thermostats|light switches|fire alarms|door locks] stop people from costing companies money.","i":"wji2fu","x":"swji2fu"},{"k":"s","t":"Airport story: passengers at [Houston|Dallas|Atlanta|Chicago O'Hare] complained about long waits at baggage claim.","i":"9wpsgl","x":"s9wpsgl"},{"k":"s","t":"At Houston's airport, executives first added more [baggage handlers|gates|carousels|shuttle buses], bringing the average wait to eight minutes, but complaints continued.","i":"19tjpao","x":"s19tjpao"},{"k":"s","t":"At Houston's airport, passengers took [1 minute|3 minutes|6 minutes|8 minutes] to walk to baggage claim and seven more to get their bags.","i":"1ot2w0y","x":"s1ot2w0y"},{"k":"s","t":"At Houston's baggage claim, roughly [88%|72%|50%|95%] of the time was spent standing around waiting.","i":"5stkiq","x":"s5stkiq"},{"k":"s","t":"Houston's fix moved arrival gates farther away and routed bags to the [farthest|nearest|highest|busiest] point in the terminal.","i":"1ag3p67","x":"s1ag3p67"},{"k":"s","t":"After Houston's change, passengers walked [six|two|four|eight] minutes and waited only [two|one|four|six] minutes. Complaints dropped.","i":"19tyoh0","x":"s19tyoh0"},{"k":"s","t":"The lesson from Houston's baggage claim: [active|passive|shared|paid] waiting (walking) is less boring than standing.","i":"kfik6z","x":"skfik6z"}]},{"t":"Do bars change behavior?","g":"Progress bars and waiting","items":[{"k":"s","t":"A survey study tested 3 progress bars: fast-to-slow, [stationary|invisible|random|reversing], and slow-to-fast.","i":"1ucl62v","x":"s1ucl62v"},{"k":"s","t":"Slow-to-fast bars had the highest quitting rate at [21.8%|14.4%|11.3%|31.8%] of people quitting halfway.","i":"dmr756","x":"sdmr756"},{"k":"s","t":"Fast-to-slow bars had the lowest quitting rate at [11.3%|14.4%|21.8%|8.3%].","i":"5yea1f","x":"s5yea1f"},{"k":"s","t":"A steady bar had an average break-off rate of [14.4%|11.3%|21.8%|18.4%].","i":"1188xbi","x":"s1188xbi"},{"k":"s","t":"The progress bar study's conclusion: the [faster|slower|smoother|longer] the bar starts, the less likely a user is to quit.","i":"1oxltm3","x":"s1oxltm3"}]},{"t":"Auxiliary games","g":"Progress bars and waiting","items":[{"k":"s","t":"In 1994, the makers of [Ridge Racer|Pac-Man|Gran Turismo|Tekken] added an Easter egg to its loading screens.","i":"kljdk","x":"skljdk"},{"k":"s","t":"Ridge Racer's loading-screen Easter egg was a version of the classic game [Galaxian|Space Invaders|Asteroids|Pong].","i":"14guylg","x":"s14guylg"},{"k":"s","t":"Ridge Racer's minigame ran on the [PlayStation|Super Nintendo|Sega Saturn|Game Boy].","i":"uu4qmt","x":"suu4qmt"},{"k":"s","t":"Video game specialist [David Hoppe|David Crane|Will Wright|Eric Barone] writes about Bandai Namco's \"dubious patent\" on auxiliary games.","note":"Some sources say 2005, but the patent expired in late 2015.","i":"1il92iu","x":"s1il92iu"},{"k":"s","t":"Some games have no pause button on purpose, so you don't stop the \"[run|level|match|quest]\".","i":"juq1c9","x":"sjuq1c9"},{"k":"s","t":"Google's Dino Game appears when your device goes [offline|out of battery|into sleep mode|out of storage].","i":"8n8lec","x":"s8n8lec"},{"k":"s","t":"The Dino Game is an \"[endless runner|tower defense|puzzle|racing]\" game, replacing a boring offline page.","i":"eeb1n6","x":"seeb1n6"},{"k":"s","t":"Restaurants like Chili's and Olive Garden have added [$1.99|$0.99|$2.99|$4.99] entertainment fees to bills when children play on tabletop tablets.","i":"pf9s2b","x":"spf9s2b"},{"k":"s","t":"The tabletop game tablets at Chili's and Olive Garden lack [age verification|internet access|touch screens|parental speakers].","i":"1kot2ec","x":"s1kot2ec"},{"k":"s","t":"Chili's says the fee covers unlimited games and requires the user to opt in and confirm [twice|once|three times|by email].","i":"11hxtey","x":"s11hxtey"},{"k":"s","t":"[California|Texas|Florida|Ohio] has laws protecting against unauthorized purchases by minors; [Illinois|New York|Oregon|Maine] does not.","i":"16b7h5p","x":"s16b7h5p"}]},{"t":"GDP and GNI","g":"Measuring societies","items":[{"k":"s","t":"GDP is the total market value of all goods and services produced [within a country's borders|by a country's citizens anywhere|by exporting firms only|by the government] in a period.","i":"1h9ug1j","x":"s1h9ug1j"},{"k":"s","t":"GDP formula: GDP = C + I + G + [(X − M)|(M − X)|(X + M)|(X × M)].","i":"1npczdw","x":"s1npczdw"},{"k":"s","t":"In the GDP formula, C stands for [consumption|capital|currency|credit], the largest part of GDP.","i":"1gytxwi","x":"s1gytxwi"},{"k":"s","t":"In the GDP formula, I is [investment|income|imports|interest]: business spending on tools, factories, buildings and new houses.","i":"hxle8t","x":"shxle8t"},{"k":"s","t":"In the GDP formula, G is [government spending|gross profit|goods|growth]: roads, schools, defense, public pay.","i":"1o8wtsf","x":"s1o8wtsf"},{"k":"s","t":"In the GDP formula, X is [exports|taxes|debt|inflation] and M is [imports|money supply|manufacturing|markets].","i":"1s6qrvn","x":"s1s6qrvn"},{"k":"s","t":"GDP measures [volume, not value|value, not volume|happiness, not income|debt, not growth].","i":"19pdkwf","x":"s19pdkwf"},{"k":"s","t":"After a massive natural disaster, GDP can [go up|always fall|stay frozen|turn negative] because rebuilding is economic activity.","i":"oecge9","x":"soecge9"},{"k":"s","t":"GNI is the total domestic and foreign income claimed by a country's [residents|government|exporters|banks].","i":"1o8qut8","x":"s1o8qut8"},{"k":"s","t":"GNI formula: GNI = GDP + [net income from abroad|net exports|government spending|foreign aid only].","i":"80jlsd","x":"s80jlsd"},{"k":"s","t":"Net income from abroad = foreign income [inflow − foreign income outflow|outflow − foreign income inflow|inflow + foreign income outflow|inflow × foreign income outflow].","i":"17dbba2","x":"s17dbba2"},{"k":"s","t":"GNI per capita PPP adjusts for differences in [cost of living and price levels|population growth|life expectancy|exchange-rate history].","i":"1loq4ts","x":"s1loq4ts"},{"k":"s","t":"GNI per capita Atlas uses a [3-year|1-year|5-year|10-year] average of exchange rates to reduce currency fluctuations.","i":"1jtxh5s","x":"s1jtxh5s"},{"k":"s","t":"GDP growth is the [yearly percentage increase|monthly price rise|export share|tax rate] in GDP.","i":"o83uke","x":"so83uke"},{"k":"s","t":"GDP per capita is the average [income for each person|tax for each worker|output of each firm|debt of each household].","i":"1xa0xw5","x":"s1xa0xw5"},{"k":"s","t":"GNI adds net receipts of primary income, meaning [compensation and property income|tariffs and fines|aid and loans|sales taxes].","i":"v738mx","x":"sv738mx"}]},{"t":"Inequality and development","g":"Measuring societies","items":[{"k":"s","t":"The Gini coefficient was developed by Corrado Gini in [1912|1886|1934|1950].","i":"u5ssj9","x":"su5ssj9"},{"k":"s","t":"The Gini coefficient ranges from 0, meaning [perfect equality|perfect inequality|no data|no income], to 1.","i":"1kimr3o","x":"s1kimr3o"},{"k":"s","t":"The Gini is commonly visualized with the [Lorenz curve|Laffer curve|Phillips curve|bell curve].","i":"1wcrxg5","x":"s1wcrxg5"},{"k":"s","t":"On a Lorenz curve chart, the 45-degree line is the line of [equality|poverty|growth|income].","i":"zwplhy","x":"szwplhy"},{"k":"s","t":"A Lorenz curve chart plots cumulative % of income against cumulative % of [households|countries|workers' hours|taxes].","i":"k4nblc","x":"sk4nblc"},{"k":"s","t":"The farther the Lorenz curve sits from the line of equality, the [less equal|more equal|richer|poorer] a country is.","i":"gmqe3","x":"sgmqe3"},{"k":"s","t":"HDI is used by the [United Nations|World Bank|IMF|OECD] to assess long-term progress in human development.","i":"1nhtx00","x":"s1nhtx00"},{"k":"s","t":"HDI's 3 dimensions: a long and healthy life, access to knowledge, and a [decent standard of living|fair justice system|free press|clean environment].","i":"h4m05q","x":"sh4m05q"},{"k":"s","t":"HDI is measured on a scale of [0–1|0–10|0–100|1–5].","i":"1wxef1p","x":"s1wxef1p"},{"k":"s","t":"HDI inputs: [GNI per capita|GDP growth|the Gini coefficient|labor productivity], life expectancy at birth, expected years of schooling, and mean years of schooling.","note":"Some sources say GDP per capita, but the UN switched to GNI per capita in 2010.","i":"181v48s","x":"s181v48s"},{"k":"s","t":"Expected years of schooling is how long a child is expected to study. Mean years of schooling is the [actual average|legal minimum|government target|highest level].","i":"5se3e7","x":"s5se3e7"}]},{"t":"Poverty and productivity","g":"Measuring societies","items":[{"k":"s","t":"The MPI measures [acute, non-monetary poverty|income inequality|national debt|unemployment] across over 100 developing countries.","i":"18e8bu0","x":"s18e8bu0"},{"k":"s","t":"The MPI assesses overlapping deprivations in health, education and [living standards|income tax|employment|housing prices].","i":"1mttpf2","x":"s1mttpf2"},{"k":"s","t":"The global MPI uses [10|6|3|12] indicators across 3 dimensions.","note":"A similar World Bank measure uses 6 indicators (consumption or income, educational attainment, educational enrollment, drinking water, sanitation, electricity). The UN and Oxford global MPI has 10: nutrition, child mortality, years of schooling, school attendance, cooking fuel, sanitation, drinking water, electricity, housing, assets. Know both lists.","i":"1h608hz","x":"s1h608hz"},{"k":"s","t":"A person counts as poor under the MPI if deprived in at least [⅓|¼|½|⅔] of the weighted indicators.","i":"10b4uwz","x":"s10b4uwz"},{"k":"s","t":"The final MPI score runs from 0 to 1, calculated by [multiplying|adding|dividing|averaging] the share of people in poverty and the average share of deprivations they experience.","i":"1pcr0sa","x":"s1pcr0sa"},{"k":"s","t":"Labor productivity measures [output per unit of labor|hours worked per person|wages per worker|profit per company].","i":"porsld","x":"sporsld"},{"k":"s","t":"If 10 workers produce 100 chairs in a week, labor productivity is [10|100|1,000|1] items per worker per week.","i":"1uja4ks","x":"s1uja4ks"},{"k":"s","t":"GDP $10 trillion ÷ 300 billion labor hours is about [$33|$3|$300|$57] per labor hour.","i":"17nbbng","x":"s17nbbng"},{"k":"s","t":"If GDP grows to $20 trillion and hours to 350 billion, productivity is about $57 per hour, growth of [72%|100%|50%|24%], using the rounded $33 and $57.","i":"1anhidg","x":"s1anhidg"},{"k":"s","t":"Growth in labor productivity can be read as improved [standards of living|tax revenue|birth rates|exchange rates].","i":"nlhlzy","x":"snlhlzy"}]},{"t":"Happiness, passports, burgers","g":"Measuring societies","items":[{"k":"s","t":"The Happiness Index is an annual international survey of citizens' [subjective life satisfaction|average income|health records|voting behavior].","i":"ce4mmu","x":"sce4mmu"},{"k":"s","t":"The Happiness Index's factors: GDP per capita, social support, life expectancy, freedom, generosity, and low [corruption|inflation|crime|unemployment].","i":"1h43dde","x":"s1h43dde"},{"k":"s","t":"The Happiness Index's core score comes from a single question: people imagine a [ladder|staircase|thermometer|mountain] with steps from 0 (worst life) to 10 (best life).","i":"ec8z04","x":"sec8z04"},{"k":"s","t":"Happiness Index samples are collected in nearly [150|50|100|195] countries.","note":"Don't confuse this with the MPI. The score uses a 0–10 ladder, not a percentage scale.","i":"3hhke9","x":"s3hhke9"},{"k":"s","t":"The Passport Index ranks passports by travel freedom. Its mobility score counts countries accessible without a [traditional visa|return ticket|vaccine record|work permit].","i":"rc5s1z","x":"src5s1z"},{"k":"s","t":"If mobility scores tie, the Passport Index decides using [HDI|GDP|population|alphabetical order].","i":"1n86aex","x":"s1n86aex"},{"k":"s","t":"Visa-free, visa-on-arrival and [electronic travel authorisation|embassy-approved visa|work permit|student visa] count toward a Passport Index score.","i":"1uimd4w","x":"s1uimd4w"},{"k":"s","t":"[No points|Half a point|One point|Two points] are given in the Passport Index if a visa must be approved before departure.","i":"2q9vbf","x":"s2q9vbf"},{"k":"s","t":"The Big Mac Index was introduced by [The Economist|The Financial Times|McDonald's|The World Bank] in [1986|1976|1996|2001].","i":"1rxprrz","x":"s1rxprrz"},{"k":"s","t":"The Big Mac Index measures [purchasing power parity|minimum wages|food inflation|obesity] between nations.","i":"13ykozi","x":"s13ykozi"},{"k":"s","t":"The Big Mac Index shows whether a currency is over- or undervalued relative to the [U.S. dollar|euro|Japanese yen|gold].","i":"1i8ou9o","x":"s1i8ou9o"},{"k":"s","t":"The Big Mac Index compares the local price of a Big Mac converted to [U.S. dollars|euros|gold ounces|local wages].","i":"ju13f3","x":"sju13f3"},{"k":"q","q":"Which index below uses a Lorenz curve?","a":"Gini coefficient","d":["Human Development Index","Big Mac Index","Passport Index"],"i":"1bjeh3g","x":"q1bjeh3g"},{"k":"q","q":"Which index below breaks ties using HDI?","a":"Passport Index","d":["Big Mac Index","Gini coefficient","Happiness Index"],"i":"1sg55e6","x":"q1sg55e6"},{"k":"q","q":"A country spends billions rebuilding after an earthquake. What happens to GDP?","a":"It rises","d":["It falls","It is unchanged","It cannot be calculated"],"i":"1djpnka","x":"q1djpnka"}]},{"t":"Is the world getting better?","g":"Measuring societies","items":[{"k":"s","t":"The Second Law of Thermodynamics: the total disorder of an isolated system can never [decrease|increase|stay constant|be measured] over time.","i":"1huzs6w","x":"s1huzs6w"},{"k":"s","t":"Under the Second Law of Thermodynamics, disorder stays constant only if all processes are [reversible|closed|frozen|electrical].","i":"1t67knt","x":"s1t67knt"},{"k":"s","t":"\"The arc of the moral universe is long, but it bends toward justice\" is credited to [Martin Luther King, Jr.|Abraham Lincoln|Nelson Mandela|Mahatma Gandhi].","i":"1u2p4hr","x":"s1u2p4hr"},{"k":"s","t":"A 1909 painting on whether the world is getting better is by the artist [Will Crawford|Otto Dix|John Martin|Thomas Cole].","i":"1o652yx","x":"s1o652yx"},{"k":"s","t":"In 1820, [84%|64%|44%|94%] of the world's population lived in extreme poverty.","i":"s72nvz","x":"ss72nvz"},{"k":"s","t":"By 2018, [less than 10%|about 25%|about 40%|under 1%] of the world's population lived in extreme poverty.","i":"1jwjmmc","x":"s1jwjmmc"},{"k":"s","t":"Global life expectancy in 1900 was [32|42|52|25] years.","i":"c32ku5","x":"sc32ku5"},{"k":"s","t":"Global life expectancy in 2000 was [67|57|73|77] years; by April 2026 it was [73.8|67.4|79.2|70.1].","i":"sk4s9n","x":"ssk4s9n"},{"k":"s","t":"Violence has been [decreasing|increasing|unchanged|impossible to measure] for centuries despite current wars.","i":"11bsoly","x":"s11bsoly"},{"k":"s","t":"Evidence the world is getting worse: technological progress brought climate change, biodiversity loss and [resource depletion|lower life expectancy|more extreme poverty|fewer languages].","i":"hqixw5","x":"shqixw5"},{"k":"s","t":"Evidence the world is getting worse: while poverty has decreased, [wealth inequality|violence|child mortality|illiteracy] has significantly increased.","i":"tp6xx7","x":"stp6xx7"},{"k":"s","t":"Global life expectancy rose about [36|12|50|75] years in a century.","i":"mat0bz","x":"smat0bz"}]}]},{"id":"todo","title":"More To Do Than Can Ever Be Listed","subs":[{"t":"History of the list","g":"","items":[{"k":"s","t":"The earliest lists were for [survival|self-improvement|religion|entertainment], tracking whether a city had enough grain.","i":"1bk5mku","x":"s1bk5mku"},{"k":"s","t":"Sumerian clay tablets and Egyptian papyrus scrolls date to [2500 BCE|500 BCE|4500 BCE|1200 BCE].","i":"1yxouqd","x":"s1yxouqd"},{"k":"s","t":"During the Renaissance and Enlightenment, to-do lists shifted from tracking things to tracking [ideas|money|people|armies].","i":"15v5jld","x":"s15v5jld"},{"k":"s","t":"One of Leonardo da Vinci's to-do items: \"Describe the tongue of the [woodpecker|snake|giraffe|lizard].\"","i":"1y9fl0","x":"s1y9fl0"},{"k":"s","t":"Other items on Leonardo da Vinci's to-do list: \"Calculate the measurement of [Milan|Rome|Florence|Venice]\" and \"Discover how the eye sees.\"","i":"16r151w","x":"s16r151w"},{"k":"s","t":"Benjamin Franklin made a chart of [13|7|10|12] virtues, with a goal for each.","i":"ofnjl","x":"sofnjl"},{"k":"s","t":"During the Industrial Revolution, workers got checklists stating the exact [seconds|hours|days|wages] a task should take.","i":"fz91g","x":"sfz91g"},{"k":"s","t":"To-do apps like Notion and [OmniFocus|Excel|Photoshop|Zoom] use algorithms, dates and gamification.","i":"de6z9j","x":"sde6z9j"},{"k":"s","t":"Digital lists have a flaw called [The Bottomless Pit|The Infinite Loop|The Black Hole|The Open Door]: infinite storage allows infinite tasks.","i":"1cp3vmv","x":"s1cp3vmv"},{"k":"s","t":"John Tierney and psychologist [Roy F. Baumeister|Daniel Kahneman|Bluma Zeigarnik|B.F. Skinner] argue that the list may have birthed happiness and dissatisfaction.","i":"1rktdyd","x":"s1rktdyd"},{"k":"s","t":"John Tierney is a writer for [The New York Times|The Economist|The Guardian|Time].","i":"1otpefp","x":"s1otpefp"}]},{"t":"Methods","g":"","items":[{"k":"s","t":"The Eisenhower Method is named after the [34th|32nd|35th|33rd] US President.","i":"1k68gsn","x":"s1k68gsn"},{"k":"s","t":"Eisenhower sorts tasks by [urgency and importance|time and skillset|cost and scope|energy and mood] into 4 quadrants.","i":"1ahumcv","x":"s1ahumcv"},{"k":"s","t":"Eisenhower: urgent and important means [do it now|schedule it|delegate it|ignore it].","i":"1ukj1j6","x":"s1ukj1j6"},{"k":"s","t":"Eisenhower: urgent but not important means [get someone else to do it|do it now|schedule it|ignore it].","i":"4a4a8b","x":"s4a4a8b"},{"k":"s","t":"Eisenhower: important but not urgent means [schedule a time|do it now|delegate it|ignore it].","i":"js4pvy","x":"sjs4pvy"},{"k":"s","t":"In the 1-2-3 Method, the tasks are 1 major, 2 [big|medium|urgent|delegated] and 3 small.","i":"1xz8a66","x":"s1xz8a66"},{"k":"s","t":"The Ivy Lee Method began in [1918|1898|1928|1948], when Charles Schwab hired Ivy Lee to improve efficiency.","i":"1dgf7yo","x":"s1dgf7yo"},{"k":"s","t":"Ivy Lee: at the end of each day, write down the [six|three|ten|five] most important tasks for tomorrow, ranked.","i":"a2ts9s","x":"sa2ts9s"},{"k":"s","t":"In Ivy Lee, unfinished tasks [move to the next day's list|are deleted|are delegated|go to a backlog].","i":"yx8jyd","x":"syx8jyd"},{"k":"s","t":"The 4-D Method stands for Do, Delegate, Defer, [Delete|Decide|Design|Delay].","i":"97kf1f","x":"s97kf1f"},{"k":"s","t":"Unlike Eisenhower, the 4-D Method is based on [time and skillset|urgency and importance|cost and scope|energy and mood].","i":"19bi82m","x":"s19bi82m"},{"k":"s","t":"In 4-D, \"Do\" is something that takes [2 minutes|10 minutes|30 seconds|an hour].","i":"uxjh2k","x":"suxjh2k"},{"k":"s","t":"In 4-D, \"Delegate\" hands off tasks that are urgent for others but need no specific personal [skillset|budget|approval|deadline].","i":"1ldrduy","x":"s1ldrduy"},{"k":"s","t":"Eat That Frog is a book by [Brian Tracy|Stephen Covey|David Allen|Cal Newport].","i":"nqrdnu","x":"snqrdnu"},{"k":"s","t":"Eat That Frog says to do your hardest task [first thing in the morning|right before bed|after lunch|last of all].","i":"13aor1j","x":"s13aor1j"},{"k":"s","t":"Eat That Frog discusses the [Amygdala Hijack|Dopamine Loop|Cortex Reset|Limbic Freeze], where the brain treats a hard task like a predator.","i":"19f1fdn","x":"s19f1fdn"},{"k":"s","t":"The name Eat That Frog comes from a line by [Mark Twain|Benjamin Franklin|Oscar Wilde|Winston Churchill].","i":"18g1s8a","x":"s18g1s8a"},{"k":"s","t":"Must-Do's 1-3-5 rule gives 1 must-do, 3 should-do and 5 [nice-to-do|delegate|someday|won't-do] tasks.","i":"1eg5sgu","x":"s1eg5sgu"},{"k":"s","t":"The Bullet Journal was developed by [Ryder Carroll|Brian Tracy|Ivy Lee|Marie Kondo].","i":"1uvq9ug","x":"s1uvq9ug"},{"k":"s","t":"The Bullet Journal aims to \"track the past, order the present, and [design the future|forget the rest|plan the week|free the mind]\".","i":"1v1gmrr","x":"s1v1gmrr"},{"k":"s","t":"The Bullet Journal's method is called Rapid [Logging|Listing|Noting|Journaling].","i":"6do4zs","x":"s6do4zs"},{"k":"s","t":"Rapid Logging symbols: tasks •, events O, notes —, priority [*|!|#|+], inspiration [!|*|?|~].","i":"1wcd9ex","x":"s1wcd9ex"},{"k":"s","t":"The Ivy Lee Method is about [100|50|25|200] years old.","i":"5dqosc","x":"s5dqosc"},{"k":"s","t":"Must-Do means naming the one or few [non-negotiable|easiest|delegated|optional] tasks for the day.","i":"qsgokg","x":"sqsgokg"},{"k":"q","q":"Which method limits you to six tasks but splits them by size?","a":"1-2-3 Method","d":["Ivy Lee Method","Must-Do","4-D Method"],"i":"1gfy62a","x":"q1gfy62a"},{"k":"q","q":"Which method is most similar to Eisenhower?","a":"4-D Method","d":["Bullet Journal","Eat That Frog","Ivy Lee Method"],"i":"91wj34","x":"q91wj34"},{"k":"s","t":"Eisenhower: not important and not urgent means [no need to worry about it|do it now|schedule it|delegate it].","i":"giehfn","x":"sgiehfn"},{"k":"s","t":"In 4-D, \"Defer\" moves [bigger tasks to a specific later time|small tasks to today|tasks to a colleague|tasks to the bin].","i":"1rpo7m2","x":"s1rpo7m2"},{"k":"s","t":"In 4-D, \"Delete\" removes [unnecessary tasks|hard tasks|urgent tasks|shared tasks].","i":"62e4k5","x":"s62e4k5"},{"k":"s","t":"BuJo combines a planner, to-do list and [diary|calendar app|budget|sketchbook].","i":"ro41cp","x":"sro41cp"}]},{"t":"The Zeigarnik effect","g":"","items":[{"k":"s","t":"The Zeigarnik effect: people remember [uncompleted or interrupted tasks|completed tasks|pleasant events|recent faces] better.","i":"1yb63dc","x":"s1yb63dc"},{"k":"s","t":"Bluma Zeigarnik noticed the effect in the [1920s|1890s|1950s|1970s].","i":"h3q1lv","x":"sh3q1lv"},{"k":"s","t":"Bluma Zeigarnik saw that [waiters|teachers|doctors|bus drivers] could recall unpaid orders in detail but forgot them once the bill was settled.","i":"8ld5mr","x":"s8ld5mr"},{"k":"s","t":"An unfinished task leaves an open [loop|door|file|circuit] that keeps it live in memory.","i":"7boimd","x":"s7boimd"},{"k":"s","t":"Students who interrupt study with unrelated activities will [remember material better|forget more|finish faster|score the same].","i":"zgj46o","x":"szgj46o"},{"k":"s","t":"A later view of the Zeigarnik effect: the subconscious is asking the conscious brain to [make a plan|finish immediately|forget the task|take a nap].","i":"xycicu","x":"sxycicu"},{"k":"s","t":"Under that later view of the Zeigarnik effect, once a plan is made, the subconscious [stops asking|asks more loudly|forgets the task|repeats it nightly].","i":"aqj0v2","x":"saqj0v2"},{"k":"s","t":"Best to keep both a to-do list and a [done list|shopping list|wish list|contact list], which closes open items.","i":"13cj6ng","x":"s13cj6ng"},{"k":"s","t":"Unfinished work creates cognitive [tension|dissonance|overload|decline].","i":"16l6ltg","x":"s16l6ltg"}]},{"t":"Eco's lists","g":"","items":[{"k":"s","t":"\"The list is the origin of culture\" was said by [Umberto Eco|Italo Calvino|Jorge Luis Borges|Roland Barthes].","i":"10g0522","x":"s10g0522"},{"k":"s","t":"Eco held an exhibit of lists at the [Louvre|Prado|Uffizi|British Museum].","i":"u0b3ta","x":"su0b3ta"},{"k":"s","t":"Eco wrote the 1980 historical murder mystery [The Name of the Rose|Foucault's Pendulum|The Da Vinci Code|Baudolino].","i":"1oxlzwb","x":"s1oxlzwb"},{"k":"s","t":"Eco was an Italian intellectual, philosopher, novelist and [semiotician|physicist|architect|composer].","i":"mma16j","x":"smma16j"},{"k":"s","t":"Practical lists are finite and [aim at completeness|gesture at infinity|are always poetic|have no purpose].","i":"1fm1055","x":"s1fm1055"},{"k":"s","t":"Poetic lists are artistic and gesture at [infinity|shopping|accuracy|completion].","i":"m44n12","x":"sm44n12"},{"k":"s","t":"A to-do list is a [practical|poetic|sacred|infinite] list.","i":"1i4rwe1","x":"s1i4rwe1"},{"k":"s","t":"Eco suggests lists help us confront the \"humiliation\" of our [mortality|poverty|ignorance|pride].","i":"srn5nm","x":"ssrn5nm"}]}]},{"id":"nearish","title":"The End is Nearish","subs":[{"t":"Caretaker governments","g":"Caretakers, lame ducks, successors","items":[{"k":"s","t":"In November 2025, the Supreme Court of [Bangladesh|Pakistan|Nepal|Sri Lanka] restored caretaker governments.","i":"15za8qs","x":"s15za8qs"},{"k":"s","t":"A caretaker government takes over between the end of one government and the [election of the next|death of a monarch|end of a war|passing of a budget].","i":"1dot7m9","x":"s1dot7m9"},{"k":"s","t":"In caretaker mode, a government can keep running the country but cannot make [big, life-changing decisions|any payments|public statements|routine decisions].","i":"klh6xr","x":"sklh6xr"},{"k":"s","t":"Belgium's caretaker period lasted [652|541|312|1,000] days.","i":"ka7qg8","x":"ska7qg8"},{"k":"s","t":"Belgium's coalition collapsed over [immigration|taxes|language laws|nuclear power].","i":"1gwjleh","x":"s1gwjleh"},{"k":"s","t":"Belgium's caretaker period ended in October 2020 with [Alexander De Croo|Charles Michel|Elio Di Rupo|Sophie Wilmès].","i":"vbbb10","x":"svbbb10"},{"k":"s","t":"Pro of caretaker governments: they provide stability and prevent [power vacuums|elections|taxation|protests], and they ensure neutrality in campaigns.","i":"1w3gg51","x":"s1w3gg51"},{"k":"s","t":"Con of caretaker governments: they lack a full democratic [mandate|budget|army|constitution], which weakens accountability.","i":"1kk8qi3","x":"s1kk8qi3"},{"k":"s","t":"Bangladesh's caretaker government once lasted two years instead of the usual [90|30|60|180] days.","i":"9qyixl","x":"s9qyixl"},{"k":"s","t":"In Myanmar, General [Min Aung Hlaing|Than Shwe|Ne Win|Thein Sein] took the role of Prime Minister in a self-appointed caretaker government.","i":"9q8j2m","x":"s9q8j2m"}]},{"t":"Lame ducks and term limits","g":"Caretakers, lame ducks, successors","items":[{"k":"s","t":"The US has no caretaker governments. Neither does [Venezuela|Bangladesh|Belgium|Australia].","i":"1wge5di","x":"s1wge5di"},{"k":"s","t":"US presidents are limited to two [four-year|five-year|six-year|three-year] terms.","i":"13ddo8q","x":"s13ddo8q"},{"k":"s","t":"A lame duck is an elected person nearing the end of a term after a [successor has been elected|scandal has broken|budget has failed|war has ended].","i":"uh9nat","x":"suh9nat"},{"k":"s","t":"For removing term limits: experienced leaders give stability, voters keep their choice, and long projects aren't [changed mid-project|cancelled by courts|taxed twice|delayed by polls].","i":"1ma09la","x":"s1ma09la"},{"k":"s","t":"Against removing term limits: organizations become prone to [corruption|bankruptcy|strikes|mergers], younger ideas get blocked, and a leader may die in office.","i":"1oorijo","x":"s1oorijo"},{"k":"s","t":"A way for a leader to hold power: keep the [military|press|courts|banks] personally loyal, and frame yourself as the only thing preventing catastrophe.","i":"f6xqvl","x":"sf6xqvl"}]},{"t":"Successors","g":"Caretakers, lame ducks, successors","items":[{"k":"s","t":"[Elizabeth I|Victoria|Mary I|Elizabeth II] delayed naming her successor.","i":"xulblf","x":"sxulblf"},{"k":"s","t":"Elizabeth I told the [Scottish|French|Spanish|Dutch] ambassador that the people \"have their eyes fixed upon the person who is next to succeed.\"","i":"r2e9xk","x":"sr2e9xk"},{"k":"s","t":"Pro of an unknown successor: it prevents the [lame duck|Hawthorne|placebo|Zeigarnik] effect and limits opposing camps.","i":"og8s3u","x":"sog8s3u"},{"k":"s","t":"Con of an unknown successor: panic, leadership crises after sudden deaths, and a [rushed selection|longer reign|lower tax|foreign invasion].","i":"8p6945","x":"s8p6945"},{"k":"s","t":"An example of an unknown successor: the Pope is elected by the [College of Cardinals|Council of Bishops|Vatican Senate|Roman Curia] only after a death or resignation.","i":"1rjezbx","x":"s1rjezbx"}]},{"t":"Doomsday Clock","g":"Doomsday and apocalypse","items":[{"k":"s","t":"The Doomsday Clock was debuted in [1947|1945|1953|1962] by the Bulletin of the [Atomic Scientists|Concerned Scientists|Nuclear Age|Peace Institute].","i":"1vboe4j","x":"s1vboe4j"},{"k":"s","t":"The Doomsday Clock is adjusted every [January|December|March|October].","i":"1kdaa7x","x":"s1kdaa7x"},{"k":"s","t":"The Doomsday Clock first focused on nuclear warfare; now it also weighs [climate change and disruptive technologies|asteroids and volcanoes|pandemics only|economic crashes only].","i":"1hz96p3","x":"s1hz96p3"},{"k":"s","t":"During the 1962 [Cuban Missile Crisis|Berlin Blockade|Korean War|Suez Crisis], the Doomsday Clock was further from midnight than in less dangerous times.","i":"1panplw","x":"s1panplw"},{"k":"s","t":"The Doomsday Clock's time comes from [expert opinions on current events|a mathematical formula|satellite data|a public vote].","i":"1unyl96","x":"s1unyl96"},{"k":"s","t":"As of 2026 the Doomsday Clock is [85|89|90|100] seconds to midnight.","i":"yyi6qa","x":"syyi6qa"},{"k":"s","t":"The Doomsday Clock was set to 85 seconds on [27 January 2026|1 January 2026|23 January 2026|14 February 2026].","i":"5e5r7z","x":"s5e5r7z"},{"k":"s","t":"The Doomsday Clock's usefulness: it focuses media attention and works as a [diplomatic tool|legal treaty|scientific instrument|military alarm].","i":"vxtoge","x":"svxtoge"},{"k":"s","t":"Londoners feared the end of the world in [1666|1605|1700|1588], with fire and illness all around.","i":"1g92t0s","x":"s1g92t0s"}]},{"t":"Predictions of doom","g":"Doomsday and apocalypse","items":[{"k":"s","t":"Millerites: New England preacher William Miller calculated [2,300|1,260|1,000|666] years from 457 BCE using the Book of [Daniel|Revelation|Isaiah|Ezekiel].","i":"1g31yy5","x":"s1g31yy5"},{"k":"s","t":"Miller's first window for Christ's return ran from March 1843 to March [1844|1845|1846|1843].","i":"5eeuxl","x":"s5eeuxl"},{"k":"s","t":"Miller attracted an estimated [100,000+|10,000|1,000,000 baptized|2,000] followers, with as many as a million attending meetings.","i":"1hwdphk","x":"s1hwdphk"},{"k":"s","t":"William Miller's date was reset to [October 22, 1844|March 21, 1844|December 25, 1844|January 1, 1845].","i":"zwhv2k","x":"szwhv2k"},{"k":"s","t":"When Miller's reset date passed too, the event became known as the [Great Disappointment|Great Awakening|Long Silence|Failed Rapture].","i":"5089co","x":"s5089co"},{"k":"s","t":"Wodziwob's visions came in [1869|1844|1890|1910], from a prophet in [Nevada|Ohio|Oregon|Montana].","i":"155p1lj","x":"s155p1lj"},{"k":"s","t":"Wodziwob's visions followed a [typhoid|smallpox|cholera|influenza] epidemic and colonial catastrophe in 1867.","i":"1mygzh2","x":"s1mygzh2"},{"k":"s","t":"Wodziwob saw white people swallowed up while [Native peoples were restored|the land froze|the sun went dark|all rivers dried].","i":"vbmcjr","x":"svbmcjr"},{"k":"s","t":"Wodziwob's prophecy was revised: an earthquake would take everyone, then later destruction was dropped for [universal eternal life|a new flood|a second prophet|a five-year delay].","i":"d33nch","x":"sd33nch"},{"k":"s","t":"Halley's Comet panic: [spectroscopy|radar|X-ray imaging|carbon dating] revealed [cyanogen|methane|ammonia|hydrogen sulfide] in comet tails.","i":"zk5cw5","x":"szk5cw5"},{"k":"s","t":"Halley panic year: [1910|1886|1924|1986].","i":"19ac441","x":"s19ac441"},{"k":"s","t":"Astronomer [Camille Flammarion|Edwin Hubble|Percival Lowell|Annie Jump Cannon] said the cyanogen gas in Halley's Comet's tail might \"snuff out all life on the planet.\"","i":"10d2iw9","x":"s10d2iw9"},{"k":"s","t":"The Jupiter Effect (1974) was by John Gribbin and [Stephen Plagemann|Carl Sagan|Fred Hoyle|Stephen Hawking].","i":"1jwho03","x":"s1jwho03"},{"k":"s","t":"The Jupiter Effect said a planetary alignment in [1982|1974|1999|2000] would trigger a ,410,000|$75,000,000|$2,870,000].","i":"nntrie","x":"snntrie"}]}]},{"id":"draft","title":"There's a Draft in Here","subs":[{"t":"Artists' drafts","g":"","items":[{"k":"s","t":"Artist drafting order: concept and composition, values and color, refinement, then [product|sketching|framing|signing].","i":"5gdeft","x":"s5gdeft"},{"k":"s","t":"Early drafts such as [thumbnail sketches|oil washes|varnish tests|final glazes] focus on layout, perspective and proportion.","i":"10x5jhb","x":"s10x5jhb"},{"k":"s","t":"Artists use [four|three|five|two] main transfer methods from sketch to canvas.","i":"7wx4sx","x":"s7wx4sx"},{"k":"s","t":"The grid method draws a [3x3|2x2|5x5|10x10] grid over sketch and canvas, then redraws box by box.","i":"185k8yy","x":"s185k8yy"},{"k":"s","t":"Graphite transfer: coat the back of the draft with graphite, tape it down, and [trace with a pencil|press with an iron|wash with water|paint over it].","i":"oeo26z","x":"soeo26z"},{"k":"s","t":"Pounce wheels and powder were used mainly by [Renaissance|Impressionist|Baroque|Cubist] painters.","i":"nux0py","x":"snux0py"},{"k":"s","t":"A pounce wheel [perforates the outline|mixes paint|smooths canvas|grinds pigment], then charcoal is dabbed through the holes.","i":"1pmoc8o","x":"s1pmoc8o"},{"k":"s","t":"Digital or optical projection uses a [projector|lightbox|microscope|camera obscura only] for accurate tracing.","i":"5qjg17","x":"s5qjg17"},{"k":"w","m":"Leonardo da Vinci","w":"Mona Lisa (Louvre) & Mona Lisa (Isleworth)","y":"c. 16th century","x":"w15ubdjw"},{"k":"w","m":"Vincent van Gogh","w":"Bedroom in Arles (three versions)","y":"1888–1889","x":"wlek6n0"},{"k":"w","m":"Edvard Munch","w":"Despair & The Scream","y":"1892 & 1893","x":"w11rnrlw"},{"k":"w","m":"Henri Matisse","w":"Dance (I) & Dance (II)","y":"1909 & 1910","x":"w1ixc84n"},{"k":"s","t":"An artist's middle drafts often introduce [shading or colors|layouts|frames|signatures].","i":"1j2q59w","x":"s1j2q59w"},{"k":"s","t":"The grid method is the most const CMP=[{"t": "Three Four Horsemen", "k": ["The Four Horsemen of the Apocalypse", "Apocalypse '42", "Four Horsemen of the Apocalypse"], "same": "All three retell the riders of the Book of Revelation for their own moment of fear.", "diff": "Dürer is religious and terrifying, a 1498 fear of the half-millennium. Schreckengost is a bright 1942 parody that mocks real dictators. Freund is dark and grim, showing after 1946 that humans can end the world themselves.", "use": "How the apocalypse moves from divine prophecy, to political joke, to a human capability."}, {"t": "Ambient music for different rooms", "k": ["Ambient 1: Music for Airports", "Music for Nine Postcards", "Sleep"], "same": "All three are meant for passive listening, with no driving beat.", "diff": "Eno calms a stressful airport. Yoshimura warms a serene museum. Richter guides listeners through sleep itself, at 8.5 hours.", "use": "Whether ambient music belongs only in liminal spaces, or in everyday life too."}, {"t": "Welcome or tundra", "k": ["\"The New Colossus\"", "\"We Are Americans Now, We Live in the Tundra\""], "same": "Both are about arriving in America.", "diff": "Lazarus promises a warm \"golden door\" before the crossing. Chin's speakers have crossed and found a freezing wasteland where roots can't grow.", "use": "The promise of immigration against the reality of assimilation."}, {"t": "Two sides of the border song", "k": ["\"Illegal Alien\"", "\"Isle of Hope, Isle of Tears\""], "same": "Both are songs about the legal threshold of entering the US.", "diff": "Genesis treats the border as satire and stereotype. Graham treats Ellis Island with reverence and tragedy.", "use": "How tone changes the meaning of the same threshold, and who gets to tell the story."}, {"t": "Refugee or invader", "k": ["\"The New Colossus\"", "\"Immigrant Song\""], "same": "Both are about people arriving by sea.", "diff": "Lazarus's migrants are vulnerable and seek refuge. Led Zeppelin's are Viking invaders who arrive t ilway Station"], "same": "All three show trains as the symbol of a changing age.", "diff": "Turner dissolves a train into weather. Monet makes the station into light and steam. Frith focuses on the crowd and class.", "use": "What each artist thinks modern life really is: speed, atmosphere or people."}, {"t": "Old and new meet on the tracks", "k": ["Picture of the Railroad at Takanawa", "Train Station, Agra, 1983"], "same": "Both set a locomotive against an older world.", "diff": "Yoshitoshi shows Japan entering modernity before the line had even opened. McCurry shows India's ancient past behind a dark steam engine.", "use": "Trains as a threshold between past and future."}, {"t": "Judgment or no judgment", "k": ["The Last Judgment", "The Triumph of Death"], "same": "Both depict mass death for a frightened 16th-century Europe.", "diff": "Michelangelo has Christ, angels and heaven. Bruegel has no angels and no promise of heaven.", "use": "Whether the end of the world has meaning or is pure destruction."}, {"t": "Idealized road or empty motel", "k": ["\"Get Your Kicks on Route 66\"", "Western Motel", "Standard Station"], "same": "All three are about American car culture in the postwar decades.", "diff": "The song sells freedom and fun. Hopper shows lonely alienation. Ruscha shows a road tamed by branding.", "use": "Whether the road is over-idealized, and for whom. For Black travelers, the song's towns were dangerous."}, {"t": "Big road or private car", "k": ["\"Life is a Highway\"", "\"Drive\""], "same": "Both praise being in motion.", "diff": "Cochrane makes the road a loud public metaphor for life. Runga makes the car a quiet private bubble.", "use": "Freedom as adventure against freedom as closeness."}, {"t": "Choice or necessity", "k": ["\"Sea Fever\"", "\"Sonnet 50\"", "\"Travelling Again\""], "same": "All three answer Bilbo's warning about leaving home.", "diff": "Masefield's speaker must go and loves it. Shakespeare's rides away in grief. Du Fu, a refugee, finds const IDX0={"F":[["Before progress bars, users had no way to know whether a machine had crashed or was simply taking longer to load.","progress","s18tmhly"],["1950–1960: users sat on a screen during loading, with no idea of the time needed or whether it was loading at all.","progress","s1i2b210"],["1960–1970: screens said \"Loading…\" or \"Please Wait\", with no bar and no percentage.","progress","s16zjkvl"],["1979: Mitchell Model introduced the first graphical progress indicator.","progress","somaup5"],["Mitchell Model built that first progress indicator during his work at Xerox PARC, on monitoring complex computational systems.","progress","s1o9sw5b"],["1985: Brad A. Myers published \"The Importance of Percent-Done Progress Indicators for Computer-Human Interfaces.\"","progress","s2wam1x"],["Myers's study found people preferred progress indicators even when the work itself was not any faster.","progress","s1dctgt9"],["Myers asked 48 students to search on 2 computers, one with and one without a progress bar.","progress","sx0lvqd"],["In Myers's study, 41 of the students preferred the bar, around 85–86%.","progress","shhbz2t"],["Myers on progress bars: \"People didn't mind so much if it was inaccurate. They still preferred the progress bar to not having anything at all.\"","progress","s7yzsx4"],["1986–1992: there were 2 types of bar: indeterminate and determinate.","progress","spz6n0d"],["An indeterminate bar cannot estimate total work; it only shows that something is progressing.","progress","s44mtyc"],["A determinate bar's percentage implies actual completion.","progress","s1q0jds4"],["Installers and iOS updates sometimes sit at 99 percent because the difficult work happens at the end.","progress","sedvzkw"],["When a progress bar sits at 99%, users have invested too much to cancel. This is the sunk cost fallacy.","progress","s1qe3nv4"],["The indeterminate bar loops or pulses with no percentage, so you can't tell if it will take 1 minute or 1 hour.","progress","s10x3xpi"],["Indeterminate bar advantages: reassurance, visual continuity, and ease of implementation.","progress","sxwuuen"],["Indeterminate bar disadvantages: more anxiety, since there is no end point, and lack of control.","progress","s1q0z88"],["A splash screen shows a logo or brand image when an app opens.","progress","s1f3jstv"],["Splash screen advantages: system relief and brand advertisement.","progress","snv1qsv"],["A splash screen's disadvantage is double loading: a splash screen followed by a throbber feels even worse.","progress","s1mun6m"],["Console output runs in a text-based window.","progress","s1141jzo"],["Data input through a keyboard is called console input.","progress","sti9hs4"],["Console inputs can also come from files, microphones and barcode readers.","progress","s1qvs0kq"],["A console program's output may be displayed on the screen or sent to a file.","progress","s7ihvkz"],["Console output is widely used for debugging and testing.","progress","s1nqtvs2"],["A progress bar answers \"How long until this is done?\"; console output answers \"What exactly is happening right now, and is it working?\"","progress","srm1i16"],["Console advantages: it captures the exact process, shows when it fails, and needs no complex front-end UI.","progress","swv1rgv"],["Console disadvantage: a fast-moving wall of text can overwhelm users.","progress","s1rndot0"],["A skeleton screen mimics the layout of the final page, with content blurred or shown as outlines.","progress","s1anzrrl"],["Skeleton screens make apps feel faster because users see something immediately instead of a blank screen.","progress","szqfiff"],["A skeleton screen's disadvantage: it can be misleading; if loading takes too long, users may feel tricked.","progress","slgy278"],["A throbber is also known as a loading icon.","progress","s119z0fw"],["The throbber was first introduced in the NCSA Mosaic web browser in the early 1990s.","progress","skyg6dk"],["A throbber's advantage is simplicity. Its disadvantage is that it shows no progress.","progress","s1t6k3wt"],["Skeleton screens are said to reduce confusion by giving a visual structure of what's coming.","progress","s1lbspj2"],["Which alternative to the progress bar is used widely for debugging code? Console output","progress","q44gqi9"],["Which of these first appeared in the NCSA Mosaic browser? Throbber","progress","q1eabpbu"],["A placebo button looks real but is not connected to any function, giving a sense of false control.","progress","s1tt1rxy"],["Many pedestrian crossing buttons do nothing because lights are now run by computers and timers.","progress","ssrxmzy"],["Most disabled crosswalk buttons were left in place because replacing them was too big a task.","progress","s1j3jce2"],["Elevator \"close door\" buttons in the US have not actually closed doors in elevators built since the 1990s.","progress","suj52k8"],["In lots of offices, false thermostats stop people from costing companies money.","progress","swji2fu"],["Airport story: passengers at Houston complained about long waits at baggage claim.","progress","s9wpsgl"],["At Houston's airport, executives first added more baggage handlers, bringing the average wait to eight minutes, but complaints continued.","progress","s19tjpao"],["At Houston's airport, passengers took 1 minute to walk to baggage claim and seven more to get their bags.","progress","s1ot2w0y"],["At Houston's baggage claim, roughly 88% of the time was spent standing around waiting.","progress","s5stkiq"],["Houston's fix moved arrival gates farther away and routed bags to the farthest point in the terminal.","progress","s1ag3p67"],["After Houston's change, passengers walked six minutes and waited only two minutes. Complaints dropped.","progress","s19tyoh0"],["The lesson from Houston's baggage claim: active waiting (walking) is less boring than standing.","progress","skfik6z"],["A survey study tested 3 progress bars: fast-to-slow, stationary, and slow-to-fast.","progress","s1ucl62v"],["Slow-to-fast bars had the highest quitting rate at 21.8% of people quitting halfway.","progress","sdmr756"],["Fast-to-slow bars had the lowest quitting rate at 11.3%.","progress","s5yea1f"],["A steady bar had an average break-off rate of 14.4%.","progress","s1188xbi"],["The progress bar study's conclusion: the faster the bar starts, the less likely a user is to quit.","progress","s1oxltm3"],["In 1994, the makers of Ridge Racer added an Easter egg to its loading screens.","progress","skljdk"],["Ridge Racer's loading-screen Easter egg was a version of the classic game Galaxian.","progress","s14guylg"],["Ridge Racer's minigame ran on the PlayStation.","progress","suu4qmt"],["Video game specialist David Hoppe writes about Bandai Namco's \"dubious patent\" on auxiliary games.","progress","s1il92iu"],["Some games have no pause button on purpose, so you don't stop the \"run\".","progress","sjuq1c9"],["Google's Dino Game appears when your device goes offline.","progress","s8n8lec"],["The Dino Game is an \"endless runner\" game, replacing a boring offline page.","progress","seeb1n6"],["Restaurants like Chili's and Olive Garden have added $1.99 entertainment fees to bills when children play on tabletop tablets.","progress","spf9s2b"],["The tabletop game tablets at Chili's and Olive Garden lack age verification.","progress","s1kot2ec"],["Chili's says the fee covers unlimited games and requires the user to opt in and confirm twice.","progress","s11hxtey"],["California has laws protecting against unauthorized purchases by minors; Illinois does not.","progress","s16b7h5p"],["GDP is the total market value of all goods and services produced within a country's borders in a period.","progress","s1h9ug1j"],["GDP formula: GDP = C + I + G + (X − M).","progress","s1npczdw"],["In the GDP formula, C stands for consumption, the largest part of GDP.","progress","s1gytxwi"],["In the GDP formula, I is investment: business spending on tools, factories, buildings and new houses.","progress","shxle8t"],["In the GDP formula, G is government spending: roads, schools, defense, public pay.","progress","s1o8wtsf"],["In the GDP formula, X is exports and M is imports.","progress","s1s6qrvn"],["GDP measures volume, not value.","progress","s19pdkwf"],["After a massive natural disaster, GDP can go up because rebuilding is economic activity.","progress","soecge9"],["GNI is the total domestic and foreign income claimed by a country's residents.","progress","s1o8qut8"],["GNI formula: GNI = GDP + net income from abroad.","progress","s80jlsd"],["Net income from abroad = foreign income inflow − foreign income outflow.","progress","s17dbba2"],["GNI per capita PPP adjusts for differences in cost of living and price levels.","progress","s1loq4ts"],["GNI per capita Atlas uses a 3-year average of exchange rates to reduce currency fluctuations.","progress","s1jtxh5s"],["GDP growth is the yearly percentage increase in GDP.","progress","so83uke"],["GDP per capita is the average income for each person.","progress","s1xa0xw5"],["GNI adds net receipts of primary income, meaning compensation and property income.","progress","sv738mx"],["The Gini coefficient was developed by Corrado Gini in 1912.","progress","su5ssj9"],["The Gini coefficient ranges from 0, meaning perfect equality, to 1.","progress","s1kimr3o"],["The Gini is commonly visualized with the Lorenz curve.","progress","s1wcrxg5"],["On a Lorenz curve chart, the 45-degree line is the line of equality.","progress","szwplhy"],["A Lorenz curve chart plots cumulative % of income against cumulative % of households.","progress","sk4nblc"],["The farther the Lorenz curve sits from the line of equality, the less equal a country is.","progress","sgmqe3"],["HDI is used by the United Nations to assess long-term progress in human development.","progress","s1nhtx00"],["HDI's 3 dimensions: a long and healthy life, access to knowledge, and a decent standard of living.","progress","sh4m05q"],["HDI is measured on a scale of 0–1.","progress","s1wxef1p"],["HDI inputs: GNI per capita, life expectancy at birth, expected years of schooling, and mean years of schooling.","progress","s181v48s"],["Expected years of schooling is how long a child is expected to study. Mean years of schooling is the actual average.","progress","s5se3e7"],["The MPI measures acute, non-monetary poverty across over 100 developing countries.","progress","s18e8bu0"],["The MPI assesses overlapping deprivations in health, education and living standards.","progress","s1mttpf2"],["The global MPI uses 10 indicators across 3 dimensions.","progress","s1h608hz"],["A person counts as poor under the MPI if deprived in at least ⅓ of the weighted indicators.","progress","s10b4uwz"],["The final MPI score runs from 0 to 1, calculated by multiplying the share of people in poverty and the average share of deprivations they experience.","progress","s1pcr0sa"],["Labor productivity measures output per unit of labor.","progress","sporsld"],["If 10 workers produce 100 chairs in a week, labor productivity is 10 items per worker per week.","progress","s1uja4ks"],["GDP $10 trillion ÷ 300 billion labor hours is about $33 per labor hour.","progress","s17nbbng"],["If GDP grows to $20 trillion and hours to 350 billion, productivity is about $57 per hour, growth of 72%, using the rounded $33 and $57.","progress","s1anhidg"],["Growth in labor productivity can be read as improved standards of living.","progress","snlhlzy"],["The Happiness Index is an annual international survey of citizens' subjective life satisfaction.","progress","sce4mmu"],["The Happiness Index's factors: GDP per capita, social support, life expectancy, freedom, generosity, and low corruption.","progress","s1h43dde"],["The Happiness Index's core score comes from a single question: people imagine a ladder with steps from 0 (worst life) to 10 (best life).","progress","sec8z04"],["Happiness Index samples are collected in nearly 150 countries.","progress","s3hhke9"],["The Passport Index ranks passports by
